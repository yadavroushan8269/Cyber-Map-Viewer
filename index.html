<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ConnectSnap</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="authView" class="center">
    <div class="card auth">
      <h1>ConnectSnap</h1>
      <p class="muted">Stories • Friends • Calls • Chat</p>
      <input id="nameInput" placeholder="Your name" maxlength="30">
      <button id="loginBtn">Create / Login</button>
      <p id="authMsg" class="msg"></p>
    </div>
  </div>

  <div id="appView" hidden>
    <header>
      <div>
        <h2>ConnectSnap</h2>
        <span id="welcome"></span>
      </div>
      <button id="logoutBtn" class="secondary">Logout</button>
    </header>

    <main>
      <section class="card room">
        <div>
          <small>YOUR ROOM ID</small>
          <h2 id="roomId">—</h2>
        </div>
        <button id="copyRoomBtn">Copy</button>
      </section>

      <section class="card">
        <h3>Add friend</h3>
        <div class="row">
          <input id="friendRoomInput" placeholder="Enter friend's Room ID">
          <button id="sendRequestBtn">Send request</button>
        </div>
        <p id="requestMsg" class="msg"></p>
      </section>

      <section class="card">
        <h3>Incoming requests</h3>
        <div id="requests"></div>
      </section>

      <section class="card">
        <h3>Friends</h3>
        <div id="friends"></div>
      </section>

      <section class="card">
        <h3>My 24-hour story</h3>
        <div class="row">
          <textarea id="storyText" placeholder="Write a story..." maxlength="500"></textarea>
          <button id="postStoryBtn">Post</button>
        </div>
        <p class="muted">Stories automatically disappear after 24 hours.</p>
      </section>

      <section class="card">
        <h3>Friends' stories</h3>
        <div id="stories"></div>
      </section>

      <section class="card">
        <h3>Call & Chat</h3>
        <p class="muted">Video/audio calling and realtime call-chat are connected in the next module.</p>
        <button class="secondary" disabled>Start video call</button>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
