<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Colour Game</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="app">

  <header class="topbar">
    <div>
      <div class="logo">COLOUR</div>
      <small>Game</small>
    </div>

    <div class="balance">
      <span>Points</span>
      <strong id="balance">10000</strong>
    </div>
  </header>

  <main>

    <section class="hero">
      <h1>Colour Game</h1>
      <p>Choose a colour and test your luck.</p>
    </section>

    <section class="round-card">

      <div class="round-title">
        <span>Current Round</span>
        <b id="round">1001</b>
      </div>

      <div class="timer">
        <span id="timer">30</span>
        <small>seconds</small>
      </div>

      <div class="colours">

        <button class="colour red" onclick="selectColour('Red')">
          <span>●</span>
          RED
        </button>

        <button class="colour green" onclick="selectColour('Green')">
          <span>●</span>
          GREEN
        </button>

        <button class="colour purple" onclick="selectColour('Purple')">
          <span>●</span>
          PURPLE
        </button>

      </div>

      <div id="selected" class="selected">
        No colour selected
      </div>

      <button class="play-btn" onclick="playRound()">
        PLAY ROUND
      </button>

    </section>

    <section class="history-card">
      <h2>Recent Results</h2>

      <div id="history" class="history"></div>
    </section>

  </main>

  <nav class="bottom-nav">

    <a class="active" href="/">
      <span>⌂</span>
      Home
    </a>

    <a href="/wallet.html">
      <span>◉</span>
      Wallet
    </a>

    <a href="/history.html">
      <span>☷</span>
      History
    </a>

    <a href="/profile.html">
      <span>●</span>
      Profile
    </a>

  </nav>

</div>

<script src="/js/game.js"></script>

</body>
</html>
