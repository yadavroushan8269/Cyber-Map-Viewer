<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   GLOBAL VARIABLES
========================================= */

let map = null;

let cameraStream = null;

let currentFacing = "environment";

let mirrorEnabled = false;

let currentFilter = "none";

let currentMode = "photo";

let currentZoom = 1;

let recorder = null;

let recordedChunks = [];

let recordingStartedAt = 0;

let recordingTimer = null;

let capturedBlob = null;

let capturedImageData = null;

let capturedVideoUrl = null;

let capturedType = null;

let selectedQuality = 480;

let isPostingSnap = false;

let currentPosition = null;

let userLocationMarker = null;

let galleryItems = [];

let galleryIndex = 0;


/* =========================================
   ELEMENTS
========================================= */

const cameraModal =
document.getElementById("cameraModal");

const previewModal =
document.getElementById("previewModal");

const galleryModal =
document.getElementById("galleryModal");

const cameraVideo =
document.getElementById("cameraVideo");

const cameraCanvas =
document.getElementById("cameraCanvas");


/* =========================================
   STATUS
========================================= */

function showStatus(message, time = 2200){

  const status =
  document.getElementById("status");

  status.textContent = message;

  status.style.display = "block";

  clearTimeout(showStatus.timer);

  showStatus.timer =
  setTimeout(() => {

    status.style.display = "none";

  }, time);

}


/* =========================================
   MAP
========================================= */

map =
L.map("map", {

  zoomControl:true,

  attributionControl:true

}).setView(
  [20.5937,78.9629],
  5
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:20,
    attribution:
    "© OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================
   DISTANCE
========================================= */

function distanceMeters(a,b){

  const R = 6371000;

  const p1 =
  a.lat * Math.PI / 180;

  const p2 =
  b.lat * Math.PI / 180;

  const dp =
  (b.lat-a.lat) * Math.PI / 180;

  const dl =
  (b.lng-a.lng) * Math.PI / 180;

  const x =
  Math.sin(dp/2)**2 +
  Math.cos(p1) *
  Math.cos(p2) *
  Math.sin(dl/2)**2;

  return 2 *
  R *
  Math.atan2(
    Math.sqrt(x),
    Math.sqrt(1-x)
  );
}


/* =========================================
   MARKER
========================================= */

function makeGhostIcon(count){

  return L.divIcon({

    className:"",

    html:
    '<div class="markerGhost">' +
    '👻' +
    '<span>' +
    count +
    '</span>' +
    '</div>',

    iconSize:[40,40],

    iconAnchor:[20,20]

  });

}


/* =========================================
   RENDER SNAPS
========================================= */

function renderSnaps(rows){

  map.eachLayer(layer => {

    if(
      layer instanceof L.Marker &&
      layer !== userLocationMarker
    ){

      map.removeLayer(layer);

    }

  });


  const groups = [];


  rows.forEach(row => {

    let group =
    groups.find(g =>

      distanceMeters(
        {
          lat:g.latitude,
          lng:g.longitude
        },
        {
          lat:row.latitude,
          lng:row.longitude
        }
      ) < 70

    );


    if(!group){

      group = {

        latitude:row.latitude,

        longitude:row.longitude,

        items:[]

      };

      groups.push(group);

    }


    group.items.push(row);

  });


  groups.forEach(group => {

    const marker =
    L.marker(
      [
        group.latitude,
        group.longitude
      ],
      {
        icon:
        makeGhostIcon(
          group.items.length
        )
      }
    ).addTo(map);


    marker.on(
      "click",
      () =>
      openGallery(group.items)
    );

  });

}


/* =========================================
   LOAD SNAPS
========================================= */

async function loadSnaps(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("snaps")
  .select("*")
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    console.error(error);

    showStatus(
      "Snaps load nahi ho paaye."
    );

    return;

  }


  renderSnaps(data || []);

}


/* =========================================
   SEARCH
========================================= */

async function searchPlace(){

  const input =
  document.getElementById(
    "searchInput"
  );

  const q =
  input.value.trim();


  if(!q){

    showStatus(
      "Location ka naam likho."
    );

    return;

  }


  showStatus(
    "Location search ho rahi hai..."
  );


  try{

    const url =
    "https://nominatim.openstreetmap.org/search" +
    "?format=jsonv2" +
    "&addressdetails=1" +
    "&limit=8" +
    "&accept-language=en" +
    "&q=" +
    encodeURIComponent(
      q + ", India"
    );


    const response =
    await fetch(
      url,
      {
        headers:{
          "Accept":
          "application/json"
        }
      }
    );


    const results =
    await response.json();


    if(!results.length){

      showStatus(
        "Location nahi mili."
      );

      return;

    }


    const place =
    results[0];


    const lat =
    Number(place.lat);

    const lon =
    Number(place.lon);


    map.setView(
      [lat,lon],
      15
    );


    showStatus(
      place.display_name ||
      "Location found"
    );


  }catch(error){

    console.error(error);

    showStatus(
      "Search failed."
    );

  }

}


document
.getElementById("searchBtn")
.onclick =
searchPlace;


document
.getElementById("searchInput")
.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      searchPlace();

    }

  }
);


/* =========================================
   MY LOCATION
========================================= */

function getMyLocation(){

  if(!navigator.geolocation){

    showStatus(
      "Browser location support nahi karta."
    );

    return;

  }


  showStatus(
    "Location mil rahi hai..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      currentPosition = {

        latitude:
        position.coords.latitude,

        longitude:
        position.coords.longitude

      };


      map.setView(
        [
          currentPosition.latitude,
          currentPosition.longitude
        ],
        17
      );


      if(userLocationMarker){

        map.removeLayer(
          userLocationMarker
        );

      }


      userLocationMarker =
      L.circleMarker(

        [
          currentPosition.latitude,
          currentPosition.longitude
        ],

        {
          radius:8
        }

      ).addTo(map);


      showStatus(
        "📍 Current location set."
      );

    },


    function(error){

      console.error(error);

      showStatus(
        "Location permission allow karo."
      );

    },


    {
      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:5000

    }

  );

}


document
.getElementById("locBtn")
.onclick =
getMyLocation;


/* =========================================
   FILTERS
========================================= */

function filterToCss(filter){

  switch(filter){

    case "vintage":
      return "sepia(.7) contrast(1.1) saturate(.8)";

    case "bw":
      return "grayscale(1)";

    case "warm":
      return "sepia(.25) saturate(1.35)";

    case "cool":
      return "saturate(.9) hue-rotate(15deg)";

    case "glow":
      return "brightness(1.1) saturate(1.2)";

    case "night":
      return "brightness(.65) contrast(1.25) saturate(1.2)";

    case "pop":
      return "saturate(1.8) contrast(1.15)";

    case "dream":
      return "brightness(1.08) contrast(.9) saturate(1.2)";

    case "sunset":
      return "sepia(.25) saturate(1.5) hue-rotate(-10deg)";

    default:
      return "none";

  }

}


function updateLiveFilter(){

  cameraVideo.style.filter =
  filterToCss(
    currentFilter
  );

}


document
.querySelectorAll(".filterBtn")
.forEach(button => {

  button.onclick = function(){

    document
    .querySelectorAll(".filterBtn")
    .forEach(
      b =>
      b.classList.remove(
        "active"
      )
    );


    button.classList.add(
      "active"
    );


    currentFilter =
    button.dataset.filter;


    updateLiveFilter();

  };

});


/* =========================================
   MIRROR
========================================= */

function updateMirrorPreview(){

  const button =
  document.getElementById(
    "mirrorBtn"
  );


  if(mirrorEnabled){

    cameraVideo.classList.add(
      "mirror-preview"
    );

    button.classList.add(
      "active"
    );

    button.textContent =

        facingMode:{

          currentFacing
        },

        width:{

        },

        height:{
          ideal:1080
        }

    updateLiveFilter();

}

/* =========================================
   ZOOM
========================================= */

async function applyHardwareZoom(){

  if(!cameraStream)
    return;


  const track =
  cameraStream
  .getVideoTracks()[0];


  if(!track)
    return;


  const capabilities =
  track.getCapabilities
  ? track.getCapabilities()
  : {};


  if(capabilities.zoom){

    const zoom =
    Math.max(
      capabilities.zoom.min,
      Math.min(
        capabilities.zoom.max,
        currentZoom
      )
    );


    try{

      await track.applyConstraints({

        advanced:[
          {
            zoom:zoom
          }
        ]

      });


      return;

    }catch(error){

      console.log(
        "Hardware zoom unavailable"
      );

    }

  }


  /* Browser fallback */

  const scale =
  Math.max(
    .5,
    Math.min(
      20,
      currentZoom
    )
  );


  cameraVideo.style.transform =
  mirrorEnabled

  ? "scaleX(-1) scale("+scale+")"

  : "scale("+scale+")";

}

/* =========================================
   DRAW CAMERA
========================================= */

function drawVideoToCanvas(
  targetWidth,
  targetHeight
){

  cameraCanvas.width =
  targetWidth;

  cameraCanvas.height =
  targetHeight;


  const ctx =
  cameraCanvas.getContext(
    "2d"
  );


  ctx.save();


  ctx.filter =
  filterToCss(
    currentFilter
  );


  const vw =
  cameraVideo.videoWidth;

  const vh =
  cameraVideo.videoHeight;


  const targetRatio =
  targetWidth /
  targetHeight;


  const sourceRatio =
  vw / vh;


  let sw = vw;

  let sh = vh;


  if(sourceRatio > targetRatio){

    sw =
    vh * targetRatio;

  }else{

    sh =
    vw / targetRatio;

  }


  const cropW =
  Math.min(
    vw,
    sw / currentZoom
  );


  const cropH =
  Math.min(
    vh,
    sh / currentZoom
  );


  const sx =
  (vw-cropW)/2;


  const sy =
  (vh-cropH)/2;


  if(mirrorEnabled){

    ctx.translate(
      targetWidth,
      0
    );

    ctx.scale(
      -1,
      1
    );

  }


  ctx.drawImage(

    cameraVideo,

    sx,
    sy,
    cropW,
    cropH,

    0,
    0,
    targetWidth,
    targetHeight

  );


  ctx.restore();

}

/* =========================================
   VIDEO
========================================= */

function chooseMime(){

  const types = [

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  return types.find(
    type =>
    MediaRecorder
    .isTypeSupported(type)
  ) || "";

}


function startRecording(){

  if(!cameraStream)
    return;


  const mime =
  chooseMime();


  if(!mime){

    showStatus(
      "Is browser me video recording supported nahi hai."
    );

    return;

  }


  recordedChunks = [];


  recorder =
  new MediaRecorder(

    cameraStream,

    {
      mimeType:mime
    }

  );


  recordingStartedAt =
  Date.now();


  recorder.ondataavailable =
  function(event){

    if(
      event.data &&
      event.data.size
    ){

      recordedChunks.push(
        event.data
      );

    }

  };


  recorder.onstop =
  function(){

    const blob =
    new Blob(
      recordedChunks,
      {
        type:mime
      }
    );


    capturedBlob =
    blob;


    capturedType =
    "video";


    capturedImageData =
    null;


    capturedVideoUrl =
    URL.createObjectURL(
      blob
    );


    const previewVideo =
    document.getElementById(
      "previewVideo"
    );


    previewVideo.src =
    capturedVideoUrl;


    previewVideo.style.display =
    "block";


    document
    .getElementById(
      "previewImage"
    )
    .style.display =
    "none";


    previewVideo.load();


    const duration =
    (Date.now() -
    recordingStartedAt)
    / 1000;


    document
    .getElementById(
      "previewInfo"
    )
    .textContent =

    "Duration: " +
    formatDuration(
      duration
    ) +

    " • Size: " +
    formatMB(
      blob.size
    ) +

    " • Resolution: " +
    cameraVideo.videoWidth +
    "×" +
    cameraVideo.videoHeight +

    " • Quality: " +
    selectedQuality +
    "p";


    document
    .getElementById(
      "qualityBox"
    )
    .style.display =
    "flex";


    stopCameraStream();


    cameraModal.style.display =
    "none";


    previewModal.style.display =
    "flex";


    updateRecordUI(false);

  };


  recorder.start(250);


  updateRecordUI(true);


  recordingTimer =
  setInterval(
    updateRecordTimer,
    250
  );

}


function stopRecording(){

  if(
    recorder &&
    recorder.state === "recording"
  ){

    recorder.stop();

  }


  clearInterval(
    recordingTimer
  );


  recordingTimer =
  null;

}

}


function updateRecordTimer(){

}

/* =========================================
   HELPERS
========================================= */

function formatMB(bytes){

  return (
    bytes /
    1024 /
    1024
  ).toFixed(2)
  + " MB";

}


function formatDuration(
  seconds
){

  seconds =
  Math.max(
    0,
    Math.floor(seconds)
  );


  const minutes =
  String(
    Math.floor(
      seconds / 60
    )
  ).padStart(
    2,
    "0"
  );


  const secs =
  String(
    seconds % 60
  ).padStart(
    2,
    "0"
  );


  return (
    minutes +
    ":" +
    secs
  );

}


function dataURLToBlob(
  dataURL
){

  const parts =
  dataURL.split(",");


  const mime =
  parts[0]
  .match(
    /:(.*?);/
  )[1];


  const binary =
  atob(
    parts[1]
  );


  const array =
  new Uint8Array(
    binary.length
  );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    array[i] =
    binary.charCodeAt(i);

  }


  return new Blob(
    [array],
    {
      type:mime
    }
  );

}

/* =========================================

function setUploadProgress(
  percent,
  text
){

  Math.max(

      100,

  .getElementById(

  )
  .textContent =
  text;

}


function xhrUpload(
  filePath,
  blob
){

  return new Promise(
    function(
      resolve,
      reject
    ){

      const url =
      SUPABASE_URL +
      "/storage/v1/object/past-snaps/" +
      encodeURIComponent(
        filePath
      );


      const xhr =
      new XMLHttpRequest();


      xhr.open(
        "POST",
        url,
        true
      );


      xhr.setRequestHeader(
        "apikey",
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "Authorization",
        "Bearer " +
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "Content-Type",
        blob.type ||
        "application/octet-stream"
      );


      xhr.setRequestHeader(
        "x-upsert",
        "false"
      );


      xhr.upload.onprogress =
      function(event){

        if(event.lengthComputable){

          const percent =
          (
            event.loaded /
            event.total
          ) * 100;


          setUploadProgress(
            percent,
            "Uploading " +
            formatMB(
              event.loaded
            ) +
            " / " +
            formatMB(
              event.total
            )
          );

        }

      };


      xhr.onload =
      function(){

        if(
          xhr.status >= 200 &&
          xhr.status < 300
        ){

          resolve();

        }else{

          reject(
            new Error(
              "Storage upload failed: " +
              xhr.status
            )
          );

        }

      };


      xhr.onerror =
      function(){

        reject(
          new Error(
            "Network error"
          )
        );

      };


      xhr.send(blob);

    }
  );

}


/* =========================================
   POST SNAP
========================================= */

async function postSnap(){

  if(isPostingSnap)
    return;


  if(!capturedBlob){

    showStatus(
      "Pehle photo ya video capture karo."
    );

    return;

  }


  if(!currentPosition){

    showStatus(
      "Pehle My Location dabao."
    );

    getMyLocation();

    return;

  }


  isPostingSnap =
  true;


  const postButton =
  document.getElementById(
    "postBtn"
  );


  postButton.disabled =
  true;


  postButton.textContent =
  "Uploading...";


  const uploadBox =
  document.getElementById(
    "uploadBox"
  );


  uploadBox.style.display =
  "block";


  setUploadProgress(
    0,
    "Preparing upload..."
  );


  try{

    const extension =
    capturedType === "video"
    ? "webm"
    : "jpg";


    const filePath =
    "snap_" +
    Date.now() +
    "_" +
    Math.random()
    .toString(36)
    .slice(2,10) +
    "." +
    extension;


    await xhrUpload(
      filePath,
      capturedBlob
    );


    const publicUrl =
    SUPABASE_URL +
    "/storage/v1/object/public/past-snaps/" +
    encodeURIComponent(
      filePath
    );


    setUploadProgress(
      100,
      "Saving snap..."
    );


    const video =
    document.getElementById(
      "previewVideo"
    );


    const duration =
    capturedType === "video" &&
    video.duration &&
    Number.isFinite(
      video.duration
    )
    ? video.duration
    : null;


    const row = {

      latitude:
      currentPosition.latitude,

      longitude:
      currentPosition.longitude,

      image_url:
      publicUrl,

      media_type:
      capturedType,

      duration_seconds:
      capturedType === "video"
      ? duration
      : null,

      width:
      capturedType === "video"
      ? video.videoWidth
      : null,

      height:
      capturedType === "video"
      ? video.videoHeight
      : null

    };


    const {
      error
    } =
    await supabaseClient
    .from("snaps")
    .insert(row);


    if(error)
      throw error;


    uploadBox.style.display =
    "none";


    previewModal.style.display =
    "none";


    showStatus(
      "✅ Snap posted successfully!",
      2500
    );


    if(capturedVideoUrl){

      URL.revokeObjectURL(
        capturedVideoUrl
      );

    }


    capturedVideoUrl =
    null;

    capturedBlob =
    null;

    capturedImageData =
    null;


    await loadSnaps();


  }catch(error){

    console.error(error);


    setUploadProgress(
      0,
      "Upload failed."
    );


    setTimeout(
      () =>
      uploadBox.style.display =
      "none",
      1200
    );


    showStatus(
      "Upload failed. Dobara try karo.",
      3000
    );


  }finally{

    isPostingSnap =
    false;


    postButton.disabled =
    false;


    postButton.textContent =
    "📍 Post Snap";

  }

}
