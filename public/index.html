<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Past Snap</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#000;
}


/* =====================================================
   MAP
===================================================== */

#map{
  position:absolute;
  inset:0;
  z-index:1;
}


/* =====================================================
   TOP BAR
===================================================== */

#topBar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;

  z-index:1000;

  display:flex;
  gap:10px;
}

#searchInput{
  flex:1;

  height:50px;

  border:0;
  outline:0;

  border-radius:28px;

  padding:0 18px;

  background:#fff;
  color:#111;

  font-size:16px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.25);
}

#searchBtn{
  width:50px;
  height:50px;

  border:0;
  border-radius:50%;

  background:#111;
  color:#fff;

  font-size:25px;
}


/* =====================================================
   CAMERA OPEN BUTTON
   NO PLUS BUTTON
===================================================== */

#cameraOpenBtn{
  position:absolute;

  top:75px;
  right:15px;

  z-index:1000;

  width:52px;
  height:52px;

  border:3px solid #fff;
  border-radius:50%;

  background:#111;
  color:#fff;

  font-size:23px;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.35);
}


/* =====================================================
   SEARCH RESULTS
===================================================== */

#searchResults{
  position:absolute;

  top:70px;
  left:12px;
  right:72px;

  z-index:1500;

  display:none;

  max-height:230px;

  overflow:auto;

  background:#fff;
  color:#111;

  border-radius:15px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.3);
}

.searchItem{
  padding:13px 15px;

  border-bottom:
    1px solid #eee;

  font-size:14px;
}


/* =====================================================
   MY LOCATION
===================================================== */

#locationBtn{
  position:absolute;

  right:14px;
  bottom:24px;

  z-index:1000;

  border:0;

  border-radius:28px;

  padding:14px 20px;

  background:#fff;
  color:#111;

  font-size:15px;
  font-weight:700;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.3);
}


/* =====================================================
   CAMERA MODAL
===================================================== */

#cameraModal{
  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  background:#000;
}


/* =====================================================
   VIDEO
===================================================== */

#cameraVideo{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;

  filter:
    var(
      --camera-filter,
      none
    ) !important;
}


/*
   FRONT CAMERA PREVIEW MIRROR
*/

#cameraVideo.selfie-preview{
  transform:scaleX(-1);
}


/* =====================================================
   CAMERA TOP CONTROLS
===================================================== */

#cameraTop{
  position:absolute;

  top:0;
  left:0;
  right:0;

  z-index:200;

  padding:
    calc(env(safe-area-inset-top) + 12px)
    15px
    10px;

  display:flex;

  justify-content:space-between;
}

.cameraTopBtn{
  width:46px;
  height:46px;

  border:0;
  border-radius:50%;

  background:
    rgba(0,0,0,.48);

  color:#fff;

  font-size:20px;
}


/* =====================================================
   6 CIRCULAR LENSES
===================================================== */

#lensBar{
  position:absolute;

  left:0;
  right:0;

  bottom:82px;

  z-index:300;

  display:flex;

  align-items:center;

  gap:17px;

  padding:
    15px 30px
    20px;

  overflow-x:auto;

  scrollbar-width:none;

  scroll-snap-type:x mandatory;

  -webkit-overflow-scrolling:touch;
}

#lensBar::-webkit-scrollbar{
  display:none;
}


/*
   EACH CIRCLE
*/

.lensBtn{
  flex:0 0 64px;

  width:64px;
  height:64px;

  padding:0;

  border:0;

  background:transparent;

  border-radius:50%;

  scroll-snap-align:center;

  transition:
    transform .18s ease,
    opacity .18s ease;
}

.lensBtn:not(.active){
  opacity:.78;
}

.lensBtn.active{
  transform:scale(1.28);
  opacity:1;
}


.lensPreview{
  width:64px;
  height:64px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:27px;

  border:2px solid
    rgba(255,255,255,.8);

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.55);
}


/*
   SELECTED CIRCLE
*/

.lensBtn.active
.lensPreview{
  border:3px solid #fff;

  box-shadow:
    0 0 0 3px
      rgba(255,255,255,.25),
    0 6px 22px
      rgba(0,0,0,.65);
}


/* =====================================================
   SIX ORIGINAL LENSES
===================================================== */

.lensNormal{
  background:
    linear-gradient(
      135deg,
      #eaf6ff,
      #ffffff
    );
}

.lensWarm{
  background:
    linear-gradient(
      135deg,
      #ffc16f,
      #ff654d
    );
}

.lensVintage{
  background:
    linear-gradient(
      135deg,
      #d8b48b,
      #67472f
    );
}

.lensGlow{
  background:
    linear-gradient(
      135deg,
      #ffd9ff,
      #91d0ff
    );
}

.lensCool{
  background:
    linear-gradient(
      135deg,
      #9be9ff,
      #405bd2
    );
}

.lensBW{
  background:
    linear-gradient(
      135deg,
      #111,
      #eee
    );
}


/* =====================================================
   CAPTURE BUTTON
===================================================== */

#captureBtn{
  position:absolute;

  left:50%;
  bottom:10px;

  transform:translateX(-50%);

  z-index:400;

  width:72px;
  height:72px;

  border-radius:50%;

  border:5px solid #fff;

  background:#fff;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,.55);
}


/* =====================================================
   PREVIEW
===================================================== */

#previewModal{
  position:fixed;

  inset:0;

  z-index:6000;

  display:none;

  background:#000;
}

#previewImage{
  width:100%;
  height:100%;

  object-fit:contain;
}

#previewActions{
  position:absolute;

  left:15px;
  right:15px;
  bottom:25px;

  display:flex;

  gap:10px;

  z-index:20;
}

.previewBtn{
  flex:1;

  padding:14px;

  border:0;

  border-radius:25px;

  font-weight:700;
  font-size:15px;
}

#cancelPreview{
  background:#222;
  color:#fff;
}

#postBtn{
  background:#fff;
  color:#111;
}


/* =====================================================
   GALLERY
===================================================== */

#galleryModal{
  position:fixed;

  inset:0;

  z-index:7000;

  display:none;

  overflow:auto;

  background:#050505;
}

.galleryTop{
  position:sticky;

  top:0;

  z-index:10;

  display:flex;

  justify-content:space-between;

  padding:15px;

  background:#050505;
}

#galleryGrid{
  display:grid;

  grid-template-columns:

  gap:4px;

  width:100%;

  aspect-ratio:1/1;

  object-fit:cover;

/* =====================================================
   LOADING
===================================================== */

#loading{
  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    rgba(0,0,0,.65);

  color:#fff;

  font-size:18px;

  font-weight:700;
}


/* =====================================================
   MESSAGE
===================================================== */

#message{
  position:fixed;

  left:50%;
  bottom:95px;

  transform:translateX(-50%);

  z-index:10000;

  display:none;

  max-width:90%;

  padding:12px 18px;

  border-radius:25px;

  background:#111;
  color:#fff;

  text-align:center;

  box-shadow:
    0 4px 15px
    rgba(0,0,0,.4);
}

<!-- =====================================================
     LIBRARIES
===================================================== -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   MAP
===================================================== */

const map =
  L.map("map").setView(
    [20.5937,78.9629],
    5
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:
      "© OpenStreetMap"
  }
).addTo(map);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let userLat = null;

let userLng = null;

let locationMarker = null;

let cameraStream = null;

let currentFacingMode =
  "user";

/*
   Current selected circular lens.
*/

let currentLens =
  "normal";

let capturedBlob =
  null;

let capturedDataUrl =
  null;

let allSnapMarkers =
  [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent =
    text;

  box.style.display =
    "block";


  setTimeout(
    () => {

      box.style.display =
        "none";

    },
    3000
  );

}


/* =====================================================
   LOCATION
===================================================== */

function getMyLocation(
  centerMap = true
){

  if(
    !navigator.geolocation
  ){

    showMessage(
      "Location supported nahi hai."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;


      if(locationMarker){

        map.removeLayer(
          locationMarker
        );

      }


      locationMarker =
        L.circleMarker(
          [
            userLat,
            userLng
          ],
          {
            radius:9,
            color:"#fff",
            weight:3,
            fillColor:"#2196f3",
            fillOpacity:1
          }
        ).addTo(map);


      locationMarker.bindPopup(
        "📍 You are here"
      );


      if(centerMap){

        map.setView(
          [
            userLat,
            userLng
          ],
          17
        );

      }

    },

    error => {

      console.log(error);

      showMessage(
        "Location permission allow karo."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:10000
    }

  );

}


/* =====================================================
   LOCATION BUTTON
===================================================== */

document
  .getElementById(
    "locationBtn"
  )
  .addEventListener(
    "click",
    () => {

      getMyLocation(true);

    }
  );


/* =====================================================
   CAMERA OPEN BUTTON
===================================================== */

document
  .getElementById(
    "cameraOpenBtn"
  )
  .addEventListener(
    "click",
    () => {

      getMyLocation(false);

      openCamera();

    }
  );


/* =====================================================
   LOAD SNAPS
===================================================== */

async function loadSnaps(){

  try{

    const bounds =
      map.getBounds();


    const south =
      bounds.getSouth();

    const north =
      bounds.getNorth();

    const west =
      bounds.getWest();

    const east =
      bounds.getEast();


    const {
      data,
      error
    } =
      await supabaseClient
        .from("snaps")
        .select("*")
        .gte(
          "latitude",
          south
        )
        .lte(
          "latitude",
          north
        )
        .gte(
          "longitude",
          west
        )
        .lte(
          "longitude",
          east
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      console.error(
        error
      );

      return;

    }


    allSnapMarkers.forEach(
      marker => {

        map.removeLayer(
          marker
        );

      }
    );


    allSnapMarkers =
      [];


    const groups =
      [];


    data.forEach(
      snap => {

        let group =
          groups.find(
            g =>

              distanceMeters(
                g.latitude,
                g.longitude,
                snap.latitude,
                snap.longitude
              ) < 15
          );


        if(!group){

          group = {

            latitude:
              snap.latitude,

            longitude:
              snap.longitude,

            snaps:[]

          };


          groups.push(
            group
          );

        }


        group.snaps.push(
          snap
        );

      }
    );


    groups.forEach(
      group => {

        const count =
          group.snaps.length;


        const icon =
          L.divIcon({

            className:"",

            html:`

              <div style="
                width:58px;
                height:58px;
                border-radius:50%;
                background:#111;
                border:3px solid white;
                box-shadow:0 4px 15px rgba(0,0,0,.45);
                display:flex;
                align-items:center;
                justify-content:center;
                color:white;
                font-size:13px;
                font-weight:800;
              ">

                ${count} 👻

              </div>

            `,

            iconSize:[
              58,
              58
            ],

            iconAnchor:[
              29,
              29
            ]

          });


        const marker =
          L.marker(
            [
              group.latitude,
              group.longitude
            ],
            {
              icon
            }
          ).addTo(map);


        marker.on(
          "click",
          () => {

            openGallery(
              group.snaps,
              count
            );

          }
        );


        allSnapMarkers.push(
          marker
        );

      }
    );


  }catch(error){

    console.error(
      error
    );

  }

}


map.on(
  "moveend",
  loadSnaps
);


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;


  const dLat =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dLon =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =
    Math.sin(
      dLat / 2
    ) *
    Math.sin(
      dLat / 2
    ) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(
      dLon / 2
    ) *
    Math.sin(
      dLon / 2
    );


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* =====================================================
   SEARCH
===================================================== */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchResults =
  document.getElementById(
    "searchResults"
  );


async function searchPlace(){

  const query =
    searchInput.value.trim();


  if(!query){

    return;

  }


  searchResults.innerHTML =
    "Searching...";


  searchResults.style.display =
    "block";


  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search?" +

        new URLSearchParams({

          q:query,

          format:"json",

          limit:"5"

        })
      );


    const results =
      await response.json();


    searchResults.innerHTML =
      "";


    if(!results.length){

      searchResults.innerHTML =
        `
          <div class="searchItem">
            No place found.
          </div>
        `;

      return;

    }


    results.forEach(
      result => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "searchItem";


        item.textContent =
          result.display_name;


        item.addEventListener(
          "click",
          () => {

            map.setView(
              [
                Number(
                  result.lat
                ),
                Number(
                  result.lon
                )
              ],
              15
            );


            searchInput.value =
              result.display_name;


            searchResults.style.display =
              "none";

          }
        );


        searchResults.appendChild(
          item
        );

      }
    );


  }catch(error){

    console.error(
      error
    );


    searchResults.innerHTML =
      `
        <div class="searchItem">
          Search failed.
        </div>
      `;

  }

}


document
  .getElementById(
    "searchBtn"
  )
  .addEventListener(
    "click",
    searchPlace
  );


searchInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Enter"
    ){

      searchPlace();

    }

  }
);


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cameraModal =
  document.getElementById(
    "cameraModal"
  );

const cameraVideo =
  document.getElementById(
    "cameraVideo"
  );


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

  try{

    /*
      Stop previous stream.
    */

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      cameraStream =
        null;

    }


    /*
      Open current camera.
    */

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:
              currentFacingMode,

            width:{
              ideal:1280
            },

            height:{
              ideal:1920
            }
          },

          audio:false

        });


    cameraVideo.srcObject =
      cameraStream;


    /*
      FRONT CAMERA
      mirror preview.
    */

    if(
      currentFacingMode ===
      "user"
    ){

      cameraVideo.classList.add(
        "selfie-preview"
      );

    }else{

      cameraVideo.classList.remove(
        "selfie-preview"
      );

    }


    await cameraVideo.play();


    /*
      Apply currently selected
      circular lens.

      This is called every time
      camera opens, so BOTH
      cameras receive the effect.
    */

    applyCameraLens();


    cameraModal.style.display =
      "block";


  }catch(error){

    console.error(
      error
    );


    showMessage(
      "Camera permission allow karo."
    );

  }

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

document
  .getElementById(
    "switchCameraBtn"
  )
  .addEventListener(
    "click",
    async () => {

      currentFacingMode =
        currentFacingMode ===
        "user"

          ? "environment"

          : "user";


      /*
        Selected lens remains
        unchanged.
      */

      await openCamera();

    }
  );


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    cameraStream =
      null;

  }


  cameraVideo.srcObject =
    null;


  cameraModal.style.display =
    "none";

}


document
  .getElementById(
    "closeCameraBtn"
  )
  .addEventListener(
    "click",
    closeCamera
  );


/* =====================================================
   SIX LENS FILTERS
===================================================== */

function lensToCss(
  lens
){

  switch(lens){

    case "warm":

      return (
        "sepia(.2) " +
        "saturate(1.55) " +
        "brightness(1.06) " +
        "contrast(1.03)"
      );


    case "vintage":

      return (
        "sepia(.55) " +
        "contrast(1.12) " +
        "saturate(.82)"
      );


    case "glow":

      return (
        "brightness(1.15) " +
        "contrast(.9) " +
        "saturate(1.3)"
      );


    case "cool":

      return (
        "saturate(1.05) " +
        "hue-rotate(18deg) " +
        "brightness(1.04)"
      );


    case "bw":

      return (
        "grayscale(1) " +
        "contrast(1.12)"
      );


    case "normal":

    default:

      return "none";

  }

}


/* =====================================================
   APPLY SELECTED LENS
===================================================== */

function applyCameraLens(){

  if(!cameraVideo){

    return;

  }


  const filter =
    lensToCss(
      currentLens
    );


  cameraVideo.style.setProperty(
    "--camera-filter",
    filter
  );

}


/* =====================================================
   LENS BUTTONS
===================================================== */

document
  .querySelectorAll(
    ".lensBtn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          /*
            Remove selected
            state from all.
          */

          document
            .querySelectorAll(
              ".lensBtn"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          /*
            Select clicked lens.
          */

          button.classList.add(
            "active"
          );


          currentLens =
            button.dataset.lens;


          /*
            Apply immediately
            to live camera.
          */

          applyCameraLens();


          /*
            Center selected circle.
          */

          button.scrollIntoView({

            behavior:
              "smooth",

            block:
              "nearest",

            inline:
              "center"

          });

        }
      );

    }
  );


/* =====================================================
   CAPTURE PHOTO
===================================================== */

document
  .getElementById(
    "captureBtn"
  )
  .addEventListener(
    "click",
    capturePhoto
  );


function capturePhoto(){

  if(
    !cameraStream ||
    !cameraVideo.videoWidth
  ){

    showMessage(
      "Camera ready nahi hai."
    );

    return;

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  const width =
    cameraVideo.videoWidth;


  const height =
    cameraVideo.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
    Apply same lens
    to captured photo.
  */

  ctx.filter =
    lensToCss(
      currentLens
    );


  /*
    Do not mirror saved photo.

    Preview is mirrored only.
  */

  ctx.drawImage(
    cameraVideo,
    0,
    0,
    width,
    height
  );


  capturedDataUrl =
    canvas.toDataURL(
      "image/jpeg",
      .88
    );


  capturedBlob =
    dataUrlToBlob(
      capturedDataUrl
    );


  document
    .getElementById(
      "previewImage"
    )
    .src =
      capturedDataUrl;


  cameraModal.style.display =
    "none";


  document
    .getElementById(
      "previewModal"
    )
    .style.display =
      "block";

}


/* =====================================================
   DATA URL TO BLOB
===================================================== */

function dataUrlToBlob(
  dataUrl
){

  const parts =
    dataUrl.split(",");


  const mime =
    parts[0].match(
      /:(.*?);/
    )[1];


  const binary =
    atob(
      parts[1]
    );


  const array =
    new Uint8Array(
      binary.length
    );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    array[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [array],
    {
      type:mime
    }
  );

}


/* =====================================================
   RETAKE
===================================================== */

document
  .getElementById(
    "cancelPreview"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "previewModal"
        )
        .style.display =
          "none";


      openCamera();

    }
  );


/* =====================================================
   UPLOAD SNAP
===================================================== */

document
  .getElementById(
    "postBtn"
  )
  .addEventListener(
    "click",
    uploadSnap
  );


async function uploadSnap(){

  if(
    userLat === null ||
    userLng === null
  ){

    showMessage(
      "Pehle My Location allow karo."
    );


    getMyLocation(true);

    return;

  }


  if(!capturedBlob){

    showMessage(
      "Photo nahi mili."
    );

    return;

  }


  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "flex";


  try{

    const fileName =
      Date.now() +
      "-" +
      crypto.randomUUID() +
      ".jpg";


    const {
      error:
        uploadError
    } =
      await supabaseClient
        .storage
        .from("past-snaps")
        .upload(
          fileName,
          capturedBlob,
          {
            contentType:
              "image/jpeg",

            upsert:false
          }
        );


    if(uploadError){

      throw uploadError;

    }


    const {
      data:urlData
    } =
      supabaseClient
        .storage
        .from("past-snaps")
        .getPublicUrl(
          fileName
        );


    const imageUrl =
      urlData.publicUrl;


    const {
      error:
        insertError
    } =
      await supabaseClient
        .from("snaps")
        .insert({

          latitude:
            userLat,

          longitude:
            userLng,

          image_url:
            imageUrl

        });


    if(insertError){

      throw insertError;

    }


    loading.style.display =
      "none";


    document
      .getElementById(
        "previewModal"
      )
      .style.display =
        "none";


    capturedBlob =
      null;

    capturedDataUrl =
      null;


    showMessage(
      "📍 Snap posted successfully!"
    );


    await loadSnaps();


  }catch(error){

    console.error(
      error
    );


    loading.style.display =
      "none";


    showMessage(
      "Upload failed: " +
      error.message
    );

  }

}


/* =====================================================
   GALLERY
===================================================== */

function openGallery(
  snaps,
  count
){

  const modal =
    document.getElementById(
      "galleryModal"
    );


  const grid =
    document.getElementById(
      "galleryGrid"
    );


  const title =
    document.getElementById(
      "galleryTitle"
    );


  title.textContent =
    `${count} 👻 Snaps`;


  grid.innerHTML =
    "";


  snaps.forEach(
    snap => {

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "galleryImg";


      img.loading =
        "lazy";


      img.src =
        snap.image_url;


      img.onclick =
        () => {

          window.open(
            snap.image_url,
            "_blank"
          );

        };


      grid.appendChild(
        img
      );

    }
  );


  modal.style.display =
    "block";

}


/* =====================================================
   CLOSE GALLERY
===================================================== */

document
  .getElementById(
    "closeGalleryBtn"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "galleryModal"
        )
        .style.display =
          "none";

    }
  );


/* =====================================================
   INITIAL LOCATION + SNAPS
===================================================== */

getMyLocation(false);

loadSnaps();

</script>
