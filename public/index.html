<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Past Snap</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#111;
  color:#fff;
}

button,input,textarea,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

.topbar{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:1000;
  display:flex;
  gap:8px;
  align-items:center;
}

.searchBox{
  flex:1;
  display:flex;
  background:rgba(20,20,20,.92);
  border-radius:14px;
  padding:4px;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

#searchInput{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:11px;
}

#searchInput::placeholder{
  color:#aaa;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:12px;
  background:#252525;
  color:#fff;
  font-size:19px;
}

.iconBtn:active{
  transform:scale(.95);
}

.userBtn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#111;
  border:2px solid white;
  color:#fff;
  font-size:18px;
}

.bottomBar{
  position:absolute;
  left:10px;
  right:10px;
  bottom:12px;
  z-index:1000;
  display:flex;
  gap:8px;
}

.bottomBtn{
  flex:1;
  min-height:52px;
  border-radius:16px;
  background:rgba(15,15,15,.94);
  color:#fff;
  font-weight:bold;
  box-shadow:0 5px 18px rgba(0,0,0,.3);
}

.bottomBtn.primary{
  background:#fff;
  color:#111;
}

.bottomBtn:active{
  transform:scale(.97);
}

.leaflet-control-attribution{
  font-size:9px;
}

.clusterGhost{
  width:auto;
  min-width:62px;
  height:42px;
  padding:0 9px;
  border-radius:22px;
  background:rgba(20,20,20,.94);
  border:2px solid #fff;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.singleGhost{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#111;
  border:2px solid white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.modal{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:700px;
  max-height:94vh;
  overflow:auto;
  background:#151515;
  border-radius:24px 24px 0 0;
  padding:18px;
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.modalTitle{
  font-size:20px;
  font-weight:bold;
  margin-bottom:14px;
}

.closeRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.closeBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#292929;
  color:white;
  font-size:20px;
}

.field{
  margin-bottom:12px;
}

.field label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-bottom:5px;
}

.field input,
.field textarea{
  width:100%;
  border:1px solid #333;
  outline:0;
  background:#202020;
  color:white;
  border-radius:12px;
  padding:12px;
}

.field textarea{
  min-height:90px;
  resize:none;
}

.action{
  width:100%;
  min-height:48px;
  border-radius:13px;
  background:#fff;
  color:#111;
  font-weight:bold;
  margin-top:7px;
}

.action.dark{
  background:#292929;
  color:white;
}

.action.danger{
  background:#b92d2d;
  color:#fff;
}

.authTabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.authTabs button{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:#282828;
  color:#aaa;
}

.authTabs button.active{
  background:white;
  color:#111;
}

.cameraModal{
  align-items:center;
}

.cameraSheet{
  max-height:100vh;
  height:100%;
  border-radius:0;
  padding:10px;
  background:#000;
  display:flex;
  flex-direction:column;
}

.cameraPreviewWrap{
  flex:1;
  min-height:0;
  position:relative;
  background:#050505;
  border-radius:18px;
  overflow:hidden;
}

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:contain;
  transform-origin:center;
}

.cameraControls{
  padding:10px 0 4px;
}

.controlRow{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:5px 0;
}

.smallControl{
  flex:0 0 auto;
  padding:9px 12px;
  border-radius:11px;
  background:#222;
  color:#fff;
  font-size:13px;
}

.smallControl.active{
  background:#fff;
  color:#111;
}

.captureRow{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:8px 0;
}

.captureBtn{
  width:72px;
  height:72px;
  border-radius:50%;
  background:white;
  border:6px solid #555;
}

.captureBtn.recording{
  background:#e33;
}

.cameraClose{
  position:absolute;
  top:12px;
  left:12px;
  z-index:5;
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
}

.cameraMode{
  position:absolute;
  top:14px;
  right:14px;
  z-index:5;
  padding:8px 12px;
  background:rgba(0,0,0,.6);
  border-radius:12px;
  font-size:12px;
}

.previewMedia{
  width:100%;
  max-height:55vh;
  object-fit:contain;
  background:#000;
  border-radius:16px;
}

.filterNormal{
  filter:none;
}

.filterVintage{
  filter:sepia(.45) saturate(.85) contrast(.95);
}

.filterBW{
  filter:grayscale(1) contrast(1.08);
}

.filterWarm{
  filter:sepia(.25) saturate(1.25) hue-rotate(-8deg);
}

.filterCool{
  filter:saturate(.95) hue-rotate(18deg);
}

.filterGlow{
  filter:brightness(1.1) saturate(1.3) contrast(.95);
}

.filterNight{
  filter:brightness(.68) contrast(1.2) saturate(.8);
}

.filterColorPop{
  filter:saturate(1.75) contrast(1.08);
}

.filterDream{
  filter:brightness(1.08) saturate(.85) contrast(.9);
}

.filterSunset{
  filter:sepia(.22) saturate(1.35) hue-rotate(-12deg) brightness(1.03);
}

.detailCard{
  background:#202020;
  border-radius:16px;
  padding:13px;
  margin-top:12px;
}

.detailTop{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.detailName{
  font-weight:bold;
}

.detailTime{
  color:#999;
  font-size:12px;
  margin-top:3px;
}

.detailLocation{
  margin-top:9px;
  color:#bbb;
  font-size:13px;
}

.detailDescription{
  margin-top:9px;
  line-height:1.45;
  white-space:pre-wrap;
}

.socialRow{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.socialBtn{
  flex:1;
  padding:10px;
  border-radius:12px;
  background:#2c2c2c;
  color:white;
}

.socialBtn.liked{
  background:#fff;
  color:#111;
}

.comments{
  margin-top:12px;
}

.comment{
  background:#292929;
  border-radius:12px;
  padding:9px;
  margin-top:7px;
}

.commentName{
  font-weight:bold;
  font-size:13px;
}

.commentText{
  margin-top:3px;
  font-size:13px;
  color:#ddd;
}

.clusterHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.clusterCount{
  color:#aaa;
  font-size:13px;
}

.snapList{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.snapItem{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px;
  border-radius:14px;
  background:#222;
  cursor:pointer;
}

.snapThumb{
  width:72px;
  height:72px;
  border-radius:10px;
  object-fit:cover;
  background:#111;
}

.snapItemInfo{
  min-width:0;
  flex:1;
}

.snapItemName{
  font-weight:bold;
}

.snapItemMeta{
  color:#999;
  font-size:11px;
  margin-top:4px;
}

.snapItemDesc{
  color:#ccc;
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#toast{
  position:fixed;
  left:50%;
  bottom:86px;
  transform:translateX(-50%);
  z-index:9000;
  background:#111;
  color:white;
  border:1px solid #444;
  padding:11px 15px;
  border-radius:13px;
  display:none;
  max-width:90%;
  text-align:center;
}

#loading{
  position:fixed;
  inset:0;
  z-index:10000;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
}

.loadingBox{
  background:#181818;
  padding:20px;
  border-radius:16px;
  text-align:center;
  min-width:190px;
}

.spinner{
  width:35px;
  height:35px;
  border:4px solid #444;
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.progress{
  width:100%;
  height:8px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:10px;
}

.progressBar{
  height:100%;
  width:0%;
  background:white;
}

.hidden{
  display:none !important;
}

.exitOverlay{
  position:fixed;
  inset:0;
  z-index:12000;
  background:rgba(0,0,0,.78);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.exitBox{
  width:100%;
  max-width:360px;
  background:#1a1a1a;
  border-radius:20px;
  padding:20px;
}

.exitBox h3{
  margin:0 0 8px;
}

.exitBox p{
  color:#aaa;
  font-size:14px;
}

.exitActions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.exitActions button{
  flex:1;
  padding:12px;
  border-radius:12px;
}

.editBtn{
  background:white;
  color:#111;
}

.cancelBtn{
  background:#333;
  color:white;
}

.exitBtn{
  background:#b52c2c;
  color:white;
}

#notificationDot{
  position:absolute;
  right:0;
  top:0;
  width:10px;
  height:10px;
  background:red;
  border-radius:50%;
  display:none;
}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div class="topbar">

    <div class="searchBox">
      <input
        id="searchInput"
        placeholder="Search place..."
        autocomplete="off">
      <button class="iconBtn" id="searchBtn">⌕</button>
    </div>

    <button class="userBtn" id="accountBtn">
      👤
      <span id="notificationDot"></span>
    </button>

  </div>

  <div class="bottomBar">

    <button class="bottomBtn" id="locationBtn">
      📍 My Location
    </button>

    <button class="bottomBtn primary" id="cameraBtn">
      📸 Post Snap
    </button>

    <button class="bottomBtn" id="galleryBtn">
      👻 Gallery
    </button>

  </div>

</div>


<!-- AUTH MODAL -->

<div class="modal" id="authModal">
  <div class="sheet">

    <div class="closeRow">
      <div class="modalTitle">Account</div>
      <button class="closeBtn" onclick="closeModal('authModal')">×</button>
    </div>

    <div id="loggedOutBox">

      <div class="authTabs">
        <button id="loginTab" class="active">Login</button>
        <button id="registerTab">Register</button>
      </div>

      <div class="field">

      <div class="field">

    <div id="loggedInBox" class="hidden">

      </div>

      <button class="action" id="notificationBtn">

      </button>

      <button class="action dark" id="logoutBtn">

</div>


<!-- CAMERA MODAL -->

<div class="modal cameraModal" id="cameraModal">

  <div class="cameraSheet">

    <div class="cameraPreviewWrap">

      <button class="cameraClose" id="cameraCloseBtn">×</button>

      <div class="cameraMode" id="cameraModeText">

      </div>

      <video id="cameraVideo"

    </div>

    <div class="cameraControls">

      <div class="controlRow">

        <button class="smallControl active"

        <button class="smallControl"

          Vintage

        <button class="smallControl"
                data-filter="B&W">
          B&W
        </button>

        <button class="smallControl"
                data-filter="Warm">
          Warm
        </button>

        <button class="smallControl"
                data-filter="Cool">
          Cool
        </button>

        <button class="smallControl"
                data-filter="Glow">
          Glow
        </button>

        <button class="smallControl"
                data-filter="Night">
          Night
        </button>

        <button class="smallControl"
                data-filter="Color Pop">
          Color Pop
        </button>

        <button class="smallControl"
                data-filter="Dream">
          Dream

<!-- PREVIEW / POST MODAL -->

    <div class="closeRow">

<!-- CLUSTER MODAL -->

      </div>

</div>

<div class="modal" id="notificationsModal">

  <div class="sheet">

    <div class="closeRow">

      <div class="modalTitle">

      </div>

        ×
      </button>

    </div>

<!-- EXIT CONFIRM -->

<div class="exitOverlay" id="exitOverlay">

  <div class="exitBox">

    <h3>Website close kare?</h3>

    <p>
      Agar abhi bahar jaoge to Past Snap close ho jayega.
    </p>

    <div class="exitActions">

      <button class="editBtn"
              id="exitEditBtn">
        Edit
      </button>

      <button class="cancelBtn"
              id="exitCancelBtn">
        Cancel
      </button>

      <button class="exitBtn"
              id="exitConfirmBtn">
        Exit
      </button>

    </div>

  </div>
</div>


<div id="toast"></div>

<div id="loading">

  <div class="loadingBox">

    <div class="spinner"></div>

    <div id="loadingText">
      Please wait...
    </div>

    <div class="progress">
      <div class="progressBar"
           id="progressBar"></div>
    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBALS
========================================================= */

let currentUser = null;
let currentProfile = null;

let map = null;
let userMarker = null;

let allSnaps = [];
let markerLayers = [];

let currentStream = null;
let currentFacingMode = "user";

let currentFilter = "Normal";
let currentMirror = true;

let currentZoom = 1;

let cameraMode = "photo";
let selectedQuality = 480;

let mediaRecorder = null;
let recordedChunks = [];
let recordingStartedAt = 0;
let lastRecordingDuration = 0;

let capturedBlob = null;
let capturedMediaType = null;

let capturedWidth = null;
let capturedHeight = null;

let selectedPost = null;
let selectedCluster = [];

let isPosting = false;

let backHistoryActive = false;

const CLUSTER_RADIUS_METERS = 50;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function showToast(message){

  const el = $("toast");

  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(()=>{
      el.style.display = "none";
    },3000);
}


function showLoading(text="Please wait..."){

  $("loadingText").textContent = text;
  $("progressBar").style.width = "0%";
  $("loading").style.display = "flex";
}


function hideLoading(){
  $("loading").style.display = "none";
}


function setProgress(percent){
  $("progressBar").style.width =
    Math.max(0,Math.min(100,percent)) + "%";
}


function openModal(id){

  $(id).classList.add("show");

  if(
    id !== "cameraModal" &&
    id !== "authModal"
  ){
    pushBackState();
  }
}


function closeModal(id){

  $(id).classList.remove("show");

  if(id === "cameraModal"){
    stopCamera();
  }

  if(id === "detailModal"){
    selectedPost = null;
  }

/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const p1 =
    lat1 * Math.PI / 180;

  const p2 =
    lat2 * Math.PI / 180;

  const dp =
    (lat2-lat1) * Math.PI / 180;

  const dl =
    (lon2-lon1) * Math.PI / 180;

  const a =
    Math.sin(dp/2) *
    Math.sin(dp/2) +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl/2) *
    Math.sin(dl/2);

  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    );

  return R*c;
}


/* =========================================================
   50M CLUSTERING
========================================================= */

function build50mClusters(snaps){

  const clusters = [];
  const used = new Set();

  for(let i=0;i<snaps.length;i++){

    if(used.has(i)) continue;

    const base = snaps[i];

    const cluster = [base];

    used.add(i);

    let changed = true;

    /*
      Important:
      We keep adding posts that are within
      50m of the cluster center.
    */

    while(changed){

      changed = false;

      const center =
        cluster.reduce(
          (acc,s)=>{
            acc.lat += Number(s.latitude);
            acc.lng += Number(s.longitude);
            return acc;
          },
          {lat:0,lng:0}
        );

      center.lat /= cluster.length;
      center.lng /= cluster.length;

      for(let j=0;j<snaps.length;j++){

        if(used.has(j)) continue;

        const candidate = snaps[j];

        const d =
          distanceMeters(
            center.lat,
            center.lng,
            Number(candidate.latitude),
            Number(candidate.longitude)
          );

        if(d <= CLUSTER_RADIUS_METERS){

          cluster.push(candidate);
          used.add(j);
          changed = true;
        }
      }
    }

    const center =
      cluster.reduce(
        (acc,s)=>{
          acc.lat += Number(s.latitude);
          acc.lng += Number(s.longitude);
          return acc;
        },
        {lat:0,lng:0}
      );

    center.lat /= cluster.length;
    center.lng /= cluster.length;

    clusters.push({
      lat:center.lat,
      lng:center.lng,
      snaps:cluster
    });
  }

  return clusters;
}

function clearMarkers(){

    layer => map.removeLayer(layer)

function createGhostIcon(count){

  if(count <= 1){

    return L.divIcon({
      className:"",
      html:`<div class="singleGhost">👻</div>`,
      iconSize:[42,42],
      iconAnchor:[21,21]
    });

  }

  return L.divIcon({

    className:"",

    html:`
      <div class="clusterGhost">
        ${count} 👻
      </div>
    `,

    iconSize:[80,42],
    iconAnchor:[40,21]
  });
}


function renderClusters(){

  if(!map) return;

  clearMarkers();

  const clusters =
    build50mClusters(allSnaps);

  clusters.forEach(cluster=>{

    const marker =
      L.marker(
        [cluster.lat,cluster.lng],
        {
          icon:createGhostIcon(
            cluster.snaps.length
          )
        }
      );

    marker.on(
      "click",
      ()=>{
        openCluster(cluster.snaps);
      }
    );

    marker.addTo(map);

    markerLayers.push(marker);
  });
}

async function attachProfiles(snaps){

  const ids =
    [...new Set(
      snaps
      .map(s=>s.user_id)
      .filter(Boolean)
    )];

  if(!ids.length) return;

  const {data,error} =
    await supabaseClient
    .from("profiles")
    .select("id,display_name")
    .in("id",ids);

  if(error){
    console.warn(error);
    return;
  }

  const mapProfiles = {};

  (data || []).forEach(profile=>{
    mapProfiles[profile.id] =
      profile.display_name;
  });

  snaps.forEach(snap=>{
    snap.display_name =
      mapProfiles[snap.user_id] ||
      "Past Snap User";
  });
}

/* =========================================================
   CAPTURE PHOTO
========================================================= */

async function capturePhoto(){

  if(!currentStream){

    showToast("Camera ready nahi hai.");
    return;
  }

  const video =
    $("cameraVideo");

  const canvas =
    document.createElement("canvas");

  const vw =
    video.videoWidth || 1280;

  const vh =
    video.videoHeight || 720;

  canvas.width = vw;
  canvas.height = vh;

  const ctx =
    canvas.getContext("2d");

  ctx.save();

  if(currentMirror){

    ctx.translate(vw,0);
    ctx.scale(-1,1);
  }

  ctx.filter =
    getCanvasFilter(currentFilter);

  ctx.drawImage(
    video,
    0,
    0,
    vw,
    vh
  );

  ctx.restore();

  canvas.toBlob(
    async blob=>{

      capturedBlob = blob;

      capturedMediaType =
        "image";

      capturedWidth =
        canvas.width;

      capturedHeight =
        canvas.height;

      await openPostPreview();

    },
    "image/jpeg",
    .90
  );
}


/* =========================================================
   FILTER FOR CANVAS
========================================================= */

function getCanvasFilter(filter){

  const filters = {

    "Normal":"none",

    "Vintage":
      "sepia(.45) saturate(.85) contrast(.95)",

    "B&W":
      "grayscale(1) contrast(1.08)",

    "Warm":
      "sepia(.25) saturate(1.25)",

    "Cool":
      "saturate(.95) hue-rotate(18deg)",

    "Glow":
      "brightness(1.1) saturate(1.3)",

    "Night":
      "brightness(.68) contrast(1.2)",

    "Color Pop":
      "saturate(1.75) contrast(1.08)",

    "Dream":
      "brightness(1.08) saturate(.85)",

    "Sunset":
      "sepia(.22) saturate(1.35)"
  };

  return filters[filter] || "none";
}


/* =========================================================
   VIDEO RECORD
========================================================= */

function startRecording(){

  if(!currentStream){

    showToast("Camera ready nahi hai.");
    return;
  }

  recordedChunks = [];

  const mimeTypes = [

    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];

  let mimeType = "";

  for(const type of mimeTypes){

    if(
      MediaRecorder.isTypeSupported(type)
    ){
      mimeType = type;
      break;
    }
  }

  try{

    mediaRecorder =
      new MediaRecorder(
        currentStream,
        mimeType
        ? {mimeType}
        : undefined
      );

  }catch(err){

    console.error(err);

    showToast(
      "Video recording supported nahi hai."
    );

    return;
  }

  recordingStartedAt =
    Date.now();

  mediaRecorder.ondataavailable =
    event=>{

      if(event.data &&
         event.data.size > 0){

        recordedChunks.push(
          event.data
        );
      }
    };


  mediaRecorder.onstop =
    async ()=>{

      lastRecordingDuration =
        Math.round(
          (Date.now() -
            recordingStartedAt) / 1000
        );

      const blob =
        new Blob(
          recordedChunks,
          {
            type:
              mimeType ||
              "video/webm"
          }
        );

      capturedBlob = blob;

      capturedMediaType =
        "video";

      capturedWidth =
        $("cameraVideo").videoWidth;

      capturedHeight =
        $("cameraVideo").videoHeight;

      $("captureBtn")
        .classList.remove(
          "recording"
        );

      await openPostPreview();
    };


  mediaRecorder.start();

  $("captureBtn")
    .classList.add("recording");

  showToast(
    "Recording started. Dubara press karke stop karo."
  );
}


function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ){

    mediaRecorder.stop();
  }
}

/* =========================================================
   POST LOCATION
========================================================= */

async function detectPostLocation(){

  if(!navigator.geolocation){

    $("postLocation").value =
      "Location unavailable";

    return;
  }

  navigator.geolocation.getCurrentPosition(

    async position=>{

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      const name =
        await reverseGeocode(
          lat,
          lon
        );

      $("postLocation").value =
        name ||
        `${lat.toFixed(5)}, ${lon.toFixed(5)}`;

      $("postLocation").dataset.lat =
        lat;

      $("postLocation").dataset.lon =
        lon;
    },

    ()=>{
      $("postLocation").value =
        "Location unavailable";
    },

    {
      enableHighAccuracy:true,
      timeout:12000
    }
  );
}


/* =========================================================
   REVERSE GEOCODE
========================================================= */

async function reverseGeocode(
  lat,
  lon
){

  try{

    const url =
      "https://nominatim.openstreetmap.org/reverse?" +
      new URLSearchParams({
        lat,
        lon,
        format:"json",
        zoom:"18"
      });

    const response =
      await fetch(url,{
        headers:{
          "Accept-Language":"en"
        }
      });

    const data =
      await response.json();

    return data.display_name || "";

  }catch(err){

    console.warn(err);

    return "";
  }
}

      : "jpg";

    const path =
      `${currentUser.id}/` +
      `${Date.now()}.` +
      extension;


    /* ---------------------------------------------
       Get current auth session
    --------------------------------------------- */

    const {
      data:sessionData,
      error:sessionError
    } =
      await supabaseClient.auth.getSession();

    if(sessionError)
      throw sessionError;

    const session =
      sessionData.session;

    if(!session){

      throw new Error(
        "Login session expired."
      );
    }


    /* ---------------------------------------------
       Upload directly with access token
    --------------------------------------------- */

    const uploadUrl =
      `${SUPABASE_URL}/storage/v1/object/past-snaps/${path}`;

    const uploadResponse =
      await fetch(
        uploadUrl,
        {
          method:"POST",

          headers:{
            "Authorization":
              `Bearer ${session.access_token}`,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              capturedBlob.type ||
              (
                capturedMediaType === "video"
                ? "video/webm"
                : "image/jpeg"
              )
          },

          body:capturedBlob
        }
      );

    if(!uploadResponse.ok){

      const errorText =
        await uploadResponse.text();

      throw new Error(
        errorText ||
        "Storage upload failed."
      );
    }

    setProgress(65);


    /* ---------------------------------------------
       Public URL
    --------------------------------------------- */

    const imageUrl =
      `${SUPABASE_URL}/storage/v1/object/public/past-snaps/${path}`;


    /* ---------------------------------------------
       Insert database row
       NO SONG DATA
    --------------------------------------------- */

    const row = {

      latitude:lat,

      longitude:lon,

      image_url:imageUrl,

      media_type:
        capturedMediaType,

      duration_seconds:
        capturedMediaType === "video"
        ? lastRecordingDuration
        : null,

      width:
        capturedWidth,

      height:
        capturedHeight,

      user_id:
        currentUser.id,

      description:
        $("postDescription")
        .value
        .trim(),

      location_name:
        $("postLocation")
        .value
        .trim()
    };


    const {
      error:insertError
    } =
      await supabaseClient
      .from("snaps")
      .insert(row);

    if(insertError)
      throw insertError;

    setProgress(100);

    showToast(
      "Snap successfully posted 👻"
    );

    closeModal("postModal");

    capturedBlob = null;
    capturedMediaType = null;

    await loadSnaps();

  }catch(err){

    console.error(err);

    showToast(
      err.message ||
      "Snap upload failed."
    );

  }finally{

    isPosting = false;

    $("publishBtn").disabled =
      false;

    setTimeout(
      hideLoading,
      400
    );
  }
}


/* =========================================================

========================================================= */

function openCluster(snaps){

  selectedCluster =
    snaps;

  $("clusterCount").textContent =
    `${snaps.length} posts within 50 meters`;

  const list =
    $("clusterList");

  list.innerHTML = "";

  snaps.forEach(
    snap=>{
      list.appendChild(
        createSnapListItem(snap)
      );
    }
  );

  openModal("clusterModal");
}


function createSnapListItem(snap){

  const item =
    document.createElement("div");

  item.className =
    "snapItem";

  const thumb =
    document.createElement(
      snap.media_type === "video"
      ? "video"
      : "img"
    );

  thumb.className =
    "snapThumb";

  thumb.src =
    snap.image_url;

  if(snap.media_type === "video"){
    thumb.muted = true;
    thumb.playsInline = true;
  }

  const info =
    document.createElement("div");

  info.className =
    "snapItemInfo";

  const name =
    document.createElement("div");

  name.className =
    "snapItemName";

  name.textContent =
    snap.display_name ||
    "Past Snap User";


  const meta =
    document.createElement("div");

  meta.className =
    "snapItemMeta";

  meta.textContent =
    formatDateTime(
      snap.created_at
    );


  const desc =
    document.createElement("div");

  desc.className =
    "snapItemDesc";

  desc.textContent =
    snap.description ||
    "No description";


  info.appendChild(name);
  info.appendChild(meta);
  info.appendChild(desc);

  item.appendChild(thumb);
  item.appendChild(info);

  item.addEventListener(
    "click",
    ()=>{
      openSnapDetail(snap);
    }
  );

  return item;
}


/* =========================================================
   DATE/TIME
========================================================= */

function formatDateTime(date){

  if(!date) return "";

  const d =
    new Date(date);

  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

  --------------------------------------------- */

    document.createElement("div");

    document.createElement("div");

  top.className =
    "detailTop";

    document.createElement("div");


  const name =
    document.createElement("div");

    "detailName";

    "Past Snap User";


  const time =
    document.createElement("div");

  time.className =

    );

  userInfo.appendChild(time);

  top.appendChild(avatar);
  top.appendChild(userInfo);

  card.appendChild(top);


  /* ---------------------------------------------
     LOCATION
  --------------------------------------------- */

  const location =
    document.createElement("div");

  location.className =
    "detailLocation";

  location.textContent =
    "📍 " +
    (
      snap.location_name ||
      `${Number(snap.latitude).toFixed(5)}, ${Number(snap.longitude).toFixed(5)}`
    );

  card.appendChild(location);


  /* ---------------------------------------------

  --------------------------------------------- */

      document.createElement("div");

    desc.className =
      "detailDescription";

    desc.textContent =
      snap.description;

    card.appendChild(desc);
  }


  /* ---------------------------------------------
     SOCIAL
  --------------------------------------------- */

  const social =
    document.createElement("div");

  social.className =
    "socialRow";


  const likeBtn =
    document.createElement("button");

  likeBtn.className =
    "socialBtn";

  likeBtn.textContent =
    "❤️ Like";

    document.createElement("button");

  commentBtn.className =
    "socialBtn";

  commentBtn.textContent =

  social.appendChild(commentBtn);

  card.appendChild(social);

  content.appendChild(card);


  /* ---------------------------------------------

  --------------------------------------------- */

  await refreshLikeButton(
    snap.id,
    likeBtn
  );


  likeBtn.addEventListener(
    "click",
    async ()=>{
      await toggleLike(
        snap.id,
        likeBtn
      );
    }
  );


  /* ---------------------------------------------
     COMMENTS
  --------------------------------------------- */

  const comments =
    document.createElement("div");

  comments.className =
    "comments";

  comments.innerHTML =
    "<b>Comments</b>";

  content.appendChild(comments);

  await loadComments(
    snap.id,
    comments
  );


  /* ---------------------------------------------
     COMMENT INPUT
  --------------------------------------------- */

  if(currentUser){

    const input =
      document.createElement("textarea");

    input.placeholder =
      "Write a comment...";

    input.maxLength = 2000;

    input.style.width =
      "100%";

    input.style.marginTop =
      "10px";

    input.style.background =
      "#202020";

    input.style.color =
      "white";

    input.style.border =
      "1px solid #333";

    input.style.borderRadius =
      "12px";

    input.style.padding =
      "10px";


    const send =
      document.createElement("button");

    send.className =
      "action";

    send.textContent =
      "Post Comment";


    send.addEventListener(
      "click",
      async ()=>{

        const text =
          input.value.trim();

        if(!text) return;

        const words =
          text
          .split(/\s+/)
          .filter(Boolean);

        if(words.length > 250){

          showToast(
            "Maximum 250 words."
          );

          return;
        }

        const {error} =
          await supabaseClient
          .from("snap_comments")
          .insert({
            snap_id:snap.id,
            user_id:currentUser.id,
            comment_text:text

        if(error){

          console.error(error);

          showToast(

        }

        input.value = "";

        await loadComments(
          snap.id,
          comments

        showToast(
          "Comment added."
        );
      }
    );


    content.appendChild(input);
    content.appendChild(send);
  }


  openModal("detailModal");

  await registerView(snap.id);
}


/* =========================================================
   LIKES
========================================================= */

async function refreshLikeButton(
  snapId,
  btn
){

  if(!currentUser){

    btn.textContent =
      "❤️ Like";

    return;
  }

  const {data,error} =
    await supabaseClient
    .from("snap_likes")
    .select("id")
    .eq("snap_id",snapId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(error) return;

  if(data){

    btn.classList.add("liked");
    btn.textContent =
      "❤️ Liked";

  }else{

    btn.classList.remove("liked");
    btn.textContent =
      "❤️ Like";
  }
}


async function toggleLike(
  snapId,
  btn
){

  if(!currentUser){

    showToast("Login required.");
    return;
  }

  const {data} =
    await supabaseClient
    .from("snap_likes")
    .select("id")
    .eq("snap_id",snapId)
    .eq("user_id",currentUser.id)
    .maybeSingle();

  if(data){

    await supabaseClient
    .from("snap_likes")
    .delete()
    .eq("id",data.id);

  }else{

    await supabaseClient
    .from("snap_likes")
    .insert({
      snap_id:snapId,
      user_id:currentUser.id
    });
  }

  await refreshLikeButton(
    snapId,
    btn
  );
}


/* =========================================================
   COMMENTS
========================================================= */

async function loadComments(
  snapId,
  container
){

  const {data,error} =
    await supabaseClient
    .from("snap_comments")
    .select("*")
    .eq("snap_id",snapId)
    .order("created_at",{
      ascending:true
    });

  if(error){

    console.error(error);
    return;
  }

  const ids =
    [...new Set(
      (data || [])
      .map(c=>c.user_id)
    )];

  let profiles = {};

  if(ids.length){

    const {data:pdata} =
      await supabaseClient
      .from("profiles")
      .select("id,display_name")
      .in("id",ids);

    (pdata || []).forEach(
      p=>{
        profiles[p.id] =
          p.display_name;
      }
    );
  }

  container.innerHTML =
    "<b>Comments</b>";

  (data || []).forEach(
    comment=>{

      const div =
        document.createElement("div");

      div.className =
        "comment";

      div.innerHTML = `
        <div class="commentName">
          ${escapeHtml(
            profiles[comment.user_id] ||
            "User"
          )}
        </div>

        <div class="commentText">
          ${escapeHtml(
            comment.comment_text
          )}
        </div>
      `;

      container.appendChild(div);
    }
  );
}

async function loadNotifications(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
    .from("notifications")
    .select("*")
    .eq(
      "recipient_id",
      currentUser.id
    )
    .order("created_at",{
      ascending:false
    })
    .limit(100);

  if(error){

    console.error(error);
    return;
  }

  const container =
    $("notificationsList");

  container.innerHTML = "";

  if(!data?.length){

    container.innerHTML =
      `<div style="color:#999">
        No notifications.
      </div>`;

    return;
  }

  data.forEach(notification=>{

    const div =
      document.createElement("div");

    div.className =
      "comment";

    div.textContent =
      notification.message;

    container.appendChild(div);
  });

  await supabaseClient
  .from("notifications")
  .update({
    is_read:true
  })
  .eq(
    "recipient_id",
    currentUser.id
  )
  .eq(
    "is_read",
    false
  );

  updateNotificationDot();
}


async function updateNotificationDot(){

  if(!currentUser){

    $("notificationDot")
      .style.display =
      "none";

    return;
  }

  const {count,error} =
    await supabaseClient
    .from("notifications")
    .select(
      "id",
      {
        count:"exact",
        head:true
      }
    )
    .eq(
      "recipient_id",
      currentUser.id
    )
    .eq(
      "is_read",
      false
    );

  if(error) return;

  $("notificationDot")
    .style.display =
    count > 0
    ? "block"
    : "none";
}

$("galleryBtn").addEventListener(
  "click",
  async ()=>{

    await loadSnaps();

    if(!allSnaps.length){

      showToast(
        "Abhi koi snap nahi hai."
      );

      return;
    }

    const userLocation =
      await getLocationPromise();

    if(!userLocation){

      showToast(
        "Gallery ke liye location allow karo."
      );

      return;
    }

    const nearby =
      allSnaps
      .map(snap=>{

        const distance =
          distanceMeters(
            userLocation.lat,
            userLocation.lon,
            Number(snap.latitude),
            Number(snap.longitude)
          );

        return {
          snap,
          distance
        };
      })
      .sort(
        (a,b)=>a.distance-b.distance
      )
      .slice(0,100);

    const list =
      nearby.map(
        x=>x.snap
      );

    openCluster(list);
  }
);


/* =========================================================
   LOCATION PROMISE
========================================================= */

function getLocationPromise(){

  return new Promise(
    resolve=>{

      if(!navigator.geolocation){

        resolve(null);
        return;
      }

      navigator.geolocation.getCurrentPosition(

        position=>{

          resolve({
            lat:
              position.coords.latitude,

            lon:
              position.coords.longitude
          });

        },

        ()=>{
          resolve(null);
        },

        {
          enableHighAccuracy:true,
          timeout:10000
        }
      );
    }
  );
}

/* =========================================================
   BROWSER / ANDROID BACK
========================================================= */

window.addEventListener(
  "popstate",
  ()=>{

    backHistoryActive = false;

    const detailOpen =
      $("detailModal")
      .classList.contains("show");

    const clusterOpen =
      $("clusterModal")
      .classList.contains("show");

    const postOpen =
      $("postModal")
      .classList.contains("show");

    const cameraOpen =
      $("cameraModal")
      .classList.contains("show");

    if(cameraOpen){

      closeModal("cameraModal");
      return;
    }

    if(postOpen){

      showExitConfirmation();
      return;
    }

    if(detailOpen){

      closeModal("detailModal");
      return;
    }

    if(clusterOpen){

      closeModal("clusterModal");
      return;
    }

    /*
      Browser may not allow a webpage to
      completely control closing the tab.

      For Android/browser navigation we
      show our confirmation screen when
      possible.
    */

    showExitConfirmation();
  }
);

  ()=>{

      Browser security normally prevents
      JavaScript from force-closing a normal tab.
      Going back is allowed when history permits.
    */

      showToast(

      );
    }
  }
);


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
