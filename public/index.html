<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Past Snap</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* HEADER */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      z-index: 1000;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: rgba(10, 10, 10, 0.92);
      color: white;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 12px;
      color: #bbb;
      margin-top: 3px;
    }

    /* MAP */
    #map {
      position: absolute;
      top: 68px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #e8edf3;
      z-index: 1;
    }

    /* MAP ERROR */
    #mapStatus {
      position: absolute;
      z-index: 900;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.78);
      color: white;
      padding: 9px 14px;
      border-radius: 20px;
      font-size: 12px;
      display: none;
      max-width: 90%;
      text-align: center;
    }

    /* MY LOCATION */
    #locationBtn {
      position: absolute;
      z-index: 1000;
      right: 15px;
      bottom: 20px;
      border: none;
      background: #111;
      color: white;
      padding: 14px 18px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
    }

    #locationBtn:active {
      transform: scale(0.96);
    }

    /* INFO */
    .info {
      position: absolute;
      z-index: 1000;
      left: 15px;
      bottom: 20px;
      max-width: 240px;
      padding: 10px 13px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.94);
      color: #111;
      font-size: 12px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    /* GHOST MARKER */
    .ghost-marker {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: white;
      border: 3px solid #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    }

    /* CAMERA MODAL */
    #cameraModal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: #000;
      display: none;
      flex-direction: column;
    }

    #cameraVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .cameraTop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cameraTop button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 20px;
    }

    /* FILTERS */
    .filters {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 115px;
      z-index: 20;
      display: flex;
      gap: 10px;
      padding: 8px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filterBtn {
      min-width: 70px;
      height: 62px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .filterBtn.active {
      border-color: white;
      background: rgba(255, 255, 255, 0.2);
    }

    /* CAMERA CONTROLS */
    .cameraBottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 20px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 35px;
    }

    #captureBtn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 7px solid white;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.3);
    }

    #switchCameraBtn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      font-size: 21px;
    }

    /* PREVIEW */
    #previewModal {
      position: fixed;
      inset: 0;
      z-index: 6000;
      background: #000;
      display: none;
      flex-direction: column;
    }

    #previewImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .previewTop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px;
      z-index: 10;
      display: flex;
      justify-content: flex-start;
    }

    .previewTop button {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 20px;
    }

    .previewBottom {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    .previewBottom button {
      flex: 1;
      border: none;
      padding: 15px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
    }

    #retakeBtn {
      background: white;
      color: #111;
    }

    #postBtn {
      background: #111;
      color: white;
      border: 1px solid white;
    }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    /* POPUP IMAGE */
    .popupImage {
      width: 210px;
      max-width: 70vw;
      border-radius: 12px;
      display: block;
    }

    .popupTime {
      margin-top: 6px;
      font-size: 11px;
      color: #777;
    }

    /* HIDE LEAFLET attribution styling only, attribution itself remains */
    .leaflet-control-attribution {
      font-size: 9px;
    }
  </style>
</head>

<body>
  <div id="app">

    <div class="topbar">
      <div>
        <div class="brand">📸 Past Snap</div>
        <div class="subtitle">Share a snap from where you are</div>
      </div>
    </div>

    <div id="map"></div>

    <div id="mapStatus"></div>

    <div class="info">
      📍 Tap <b>My Location</b><br />
      📸 Take a photo from your camera<br />
      🌍 Your snap appears on the map
    </div>

    <button id="locationBtn">📍 My Location</button>

  </div>

  <!-- CAMERA -->
  <div id="cameraModal">

    <video id="cameraVideo" autoplay playsinline></video>

    <div class="cameraTop">
      <button id="closeCameraBtn">✕</button>
    </div>

    <div class="filters">

      <button class="filterBtn active" data-filter="none">
        Normal
      </button>

      <button class="filterBtn" data-filter="vintage">
        Vintage
      </button>

      <button class="filterBtn" data-filter="bw">
        B&W
      </button>

      <button class="filterBtn" data-filter="warm">
        Warm
      </button>

      <button class="filterBtn" data-filter="cool">
        Cool
      </button>

      <button class="filterBtn" data-filter="glow">
        Glow
      </button>

      <button class="filterBtn" data-filter="night">
        Night
      </button>

      <button class="filterBtn" data-filter="pop">
        Color Pop
      </button>

      <button class="filterBtn" data-filter="dream">
        Dream
      </button>

      <button class="filterBtn" data-filter="sunset">
        Sunset
      </button>

    </div>

    <div class="cameraBottom">
      <button id="switchCameraBtn">🔄</button>

      <button id="captureBtn"></button>

      <div style="width:48px;"></div>
    </div>

  </div>

  <!-- PREVIEW -->
  <div id="previewModal">

    <div class="previewTop">
      <button id="closePreviewBtn">✕</button>
    </div>

    <img id="previewImage" />

    <div class="previewBottom">
      <button id="retakeBtn">Retake</button>
      <button id="postBtn">📍 Post Snap</button>
    </div>

  </div>

  <div id="loading">
    Uploading Snap...
  </div>

  <!-- LEAFLET -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script>

    // ============================================================
    // CONFIG
    // ============================================================

    const SUPABASE_URL =
      "https://zzxhymydsvwpjbyaslde.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";


    // ============================================================
    // GLOBAL VARIABLES
    // ============================================================

    let map = null;
    let userMarker = null;
    let snapMarkers = null;

    let currentLocation = null;

    let cameraStream = null;
    let facingMode = "environment";

    let currentFilter = "none";

    let capturedBlob = null;
    let capturedImageUrl = null;

    let supabaseClient = null;


    // ============================================================
    // ELEMENTS
    // ============================================================

    const mapStatus =
      document.getElementById("mapStatus");

    const locationBtn =
      document.getElementById("locationBtn");

    const cameraModal =
      document.getElementById("cameraModal");

    const cameraVideo =
      document.getElementById("cameraVideo");

    const closeCameraBtn =
      document.getElementById("closeCameraBtn");

    const captureBtn =
      document.getElementById("captureBtn");

    const switchCameraBtn =
      document.getElementById("switchCameraBtn");

    const previewModal =
      document.getElementById("previewModal");

    const previewImage =
      document.getElementById("previewImage");

    const closePreviewBtn =
      document.getElementById("closePreviewBtn");

    const retakeBtn =
      document.getElementById("retakeBtn");

    const postBtn =
      document.getElementById("postBtn");

    const loading =
      document.getElementById("loading");


    // ============================================================
    // MAP INITIALIZATION
    // IMPORTANT: MAP LOADS BEFORE SUPABASE
    // ============================================================

    function initMap() {

      try {

        if (!window.L) {
          throw new Error("Leaflet load nahi hua.");
        }

        map = L.map("map", {
          zoomControl: true,
          attributionControl: true
        }).setView([20.5937, 78.9629], 5);


        const tiles = L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
          }
        );


        let tileErrors = 0;

        tiles.on("tileerror", function () {

          tileErrors++;

          if (tileErrors >= 3) {

            showMapStatus(
              "Map tiles load nahi ho rahe. Internet connection check karo."
            );

          }

        });


        tiles.addTo(map);


        snapMarkers = L.layerGroup().addTo(map);


        setTimeout(function () {
          map.invalidateSize();
        }, 300);


      } catch (error) {

        console.error("Map error:", error);

        showMapStatus(
          "Map start nahi ho paya. Page reload karke try karo."
        );

      }

    }


    // ============================================================
    // MAP STATUS
    // ============================================================

    function showMapStatus(message) {

      mapStatus.textContent = message;
      mapStatus.style.display = "block";

    }


    function hideMapStatus() {

      mapStatus.style.display = "none";

    }


    // ============================================================
    // SUPABASE LAZY INITIALIZATION
    // ============================================================

    function getSupabase() {

      if (supabaseClient) {
        return supabaseClient;
      }


      if (!window.supabase) {

        throw new Error(
          "Supabase library load nahi hui. Internet check karo."
        );

      }


      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );


      return supabaseClient;

    }


    // ============================================================
    // LOCATION
    // ============================================================

    locationBtn.addEventListener(
      "click",
      getMyLocation
    );


    function getMyLocation() {

      if (!navigator.geolocation) {

        alert(
          "Is browser me location support nahi hai."
        );

        return;

      }


      locationBtn.disabled = true;
      locationBtn.textContent = "📍 Getting location...";


      navigator.geolocation.getCurrentPosition(

        function (position) {

          const lat =
            position.coords.latitude;

          const lng =
            position.coords.longitude;


          currentLocation = {
            lat: lat,
            lng: lng
          };


          // MAP CENTER

          if (map) {

            map.setView(
              [lat, lng],
              17,
              {
                animate: true
              }
            );

          }


          // USER MARKER

          if (map) {

            if (userMarker) {
              map.removeLayer(userMarker);
            }


            userMarker =
              L.circleMarker(
                [lat, lng],
                {
                  radius: 9,
                  color: "#111",
                  weight: 4,
                  fillColor: "#fff",
                  fillOpacity: 1
                }
              ).addTo(map);


            userMarker.bindPopup(
              "📍 You are here"
            );

          }


          locationBtn.disabled = false;
          locationBtn.textContent =
            "📸 Take Snap";


          hideMapStatus();


          // Open camera automatically

          openCamera();

        },

        function (error) {

          console.error(
            "Location error:",
            error
          );


          locationBtn.disabled = false;
          locationBtn.textContent =
            "📍 My Location";


          if (error.code === 1) {

            alert(
              "Location permission denied. Browser settings me location permission allow karo."
            );

          } else {

            alert(
              "Location nahi mil pa rahi. GPS/Location ON karke dobara try karo."
            );

          }

        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }


    // ============================================================
    // CAMERA
    // ============================================================

    async function openCamera() {

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {

        alert(
          "Camera is browser me available nahi hai."
        );

        return;

      }


      try {

        stopCamera();


        cameraStream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: facingMode
              },
              width: {
                ideal: 1920
              },
              height: {
                ideal: 1080
              }
            },

            audio: false

          });


        cameraVideo.srcObject =
          cameraStream;


        cameraModal.style.display =
          "flex";


        applyVideoFilter();


      } catch (error) {

        console.error(
          "Camera error:",
          error
        );


        alert(
          "Camera open nahi hua. Camera permission allow karo."
        );

      }

    }


    function stopCamera() {

      if (!cameraStream) {
        return;
      }


      cameraStream
        .getTracks()
        .forEach(function (track) {

          track.stop();

        });


      cameraStream = null;
      cameraVideo.srcObject = null;

    }


    closeCameraBtn.addEventListener(
      "click",
      function () {

        stopCamera();

        cameraModal.style.display =
          "none";

        locationBtn.disabled = false;
        locationBtn.textContent =
          "📍 My Location";

      }
    );


    // ============================================================
    // CAMERA SWITCH
    // ============================================================

    switchCameraBtn.addEventListener(
      "click",
      async function () {

        facingMode =
          facingMode === "environment"
            ? "user"
            : "environment";


        await openCamera();

      }
    );


    // ============================================================
    // FILTERS
    // ============================================================

    document
      .querySelectorAll(".filterBtn")
      .forEach(function (button) {

        button.addEventListener(
          "click",
          function () {

            document
              .querySelectorAll(".filterBtn")
              .forEach(function (btn) {

                btn.classList.remove(
                  "active"
                );

              });


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            applyVideoFilter();

          }
        );

      });


    function getFilterCSS(filter) {

      switch (filter) {

        case "vintage":
          return "sepia(0.55) contrast(1.1) saturate(0.8)";

        case "bw":
          return "grayscale(1) contrast(1.15)";

        case "warm":
          return "sepia(0.25) saturate(1.3) contrast(1.05)";

        case "cool":
          return "saturate(0.9) hue-rotate(15deg) contrast(1.05)";

        case "glow":
          return "brightness(1.12) saturate(1.3) contrast(1.05)";

        case "night":
          return "brightness(0.65) contrast(1.3) saturate(0.8)";

        case "pop":
          return "saturate(1.8) contrast(1.15)";

        case "dream":
          return "brightness(1.08) saturate(1.15) blur(0.3px)";

        case "sunset":
          return "sepia(0.25) saturate(1.55) contrast(1.1)";

        default:
          return "none";

      }

    }


    function applyVideoFilter() {

      cameraVideo.style.filter =
        getFilterCSS(currentFilter);

    }


    // ============================================================
    // CAPTURE PHOTO
    // ============================================================

    captureBtn.addEventListener(
      "click",
      capturePhoto
    );


    function capturePhoto() {

      if (!cameraVideo.videoWidth) {

        alert(
          "Camera ready hone ka wait karo."
        );

        return;

      }


      const canvas =
        document.createElement("canvas");


      canvas.width =
        cameraVideo.videoWidth;

      canvas.height =
        cameraVideo.videoHeight;


      const ctx =
        canvas.getContext("2d");


      // Mirror front camera

      if (facingMode === "user") {

        ctx.translate(
          canvas.width,
          0
        );

        ctx.scale(-1, 1);

      }


      ctx.filter =
        getFilterCSS(currentFilter);


      ctx.drawImage(
        cameraVideo,
        0,
        0,
        canvas.width,
        canvas.height
      );


      canvas.toBlob(
        function (blob) {

          if (!blob) {

            alert(
              "Photo capture nahi ho paya."
            );

            return;

          }


          capturedBlob = blob;


          if (capturedImageUrl) {

            URL.revokeObjectURL(
              capturedImageUrl
            );

          }


          capturedImageUrl =
            URL.createObjectURL(blob);


          previewImage.src =
            capturedImageUrl;


          stopCamera();


          cameraModal.style.display =
            "none";


          previewModal.style.display =
            "flex";

        },

        "image/jpeg",

        0.88

      );

    }


    // ============================================================
    // PREVIEW CLOSE
    // ============================================================

    closePreviewBtn.addEventListener(
      "click",
      function () {

        closePreview();

      }
    );


    function closePreview() {

      previewModal.style.display =
        "none";


      capturedBlob = null;


      if (capturedImageUrl) {

        URL.revokeObjectURL(
          capturedImageUrl
        );

        capturedImageUrl = null;

      }


      locationBtn.disabled = false;
      locationBtn.textContent =
        "📍 My Location";

    }


    // ============================================================
    // RETAKE
    // ============================================================

    retakeBtn.addEventListener(
      "click",
      function () {

        previewModal.style.display =
          "none";


        capturedBlob = null;


        if (capturedImageUrl) {

          URL.revokeObjectURL(
            capturedImageUrl
          );

          capturedImageUrl = null;

        }


        openCamera();

      }
    );


    // ============================================================
    // POST SNAP
    // ============================================================

    postBtn.addEventListener(
      "click",
      postSnap
    );


    async function postSnap() {

      if (!capturedBlob) {

        alert(
          "Photo nahi mili."
        );

        return;

      }


      // Get fresh live location

      if (!navigator.geolocation) {

        alert(
          "Location available nahi hai."
        );

        return;

      }


      loading.style.display =
        "flex";


      try {

        const position =
          await getFreshLocation();


        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        // If previous location exists,
        // check that user didn't move too far.

        if (currentLocation) {

          const distance =
            getDistanceMeters(
              currentLocation.lat,
              currentLocation.lng,
              lat,
              lng
            );


          if (distance > 50) {

            loading.style.display =
              "none";


            alert(
              "Aap location se kaafi door chale gaye ho. Pehle My Location dobara press karo."
            );


            closePreview();

            return;

          }

        }


        // Supabase

        const supabase =
          getSupabase();


        const fileName =
          "snap_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2, 8) +
          ".jpg";


        const filePath =
          "public/" + fileName;


        // Upload

        const uploadResult =
          await supabase
            .storage
            .from("past-snaps")
            .upload(
              filePath,
              capturedBlob,
              {
                contentType:
                  "image/jpeg",
                upsert: false
              }
            );


        if (uploadResult.error) {

          throw uploadResult.error;

        }


        // Public URL

        const publicUrlResult =
          supabase
            .storage
            .from("past-snaps")
            .getPublicUrl(filePath);


        const imageUrl =
          publicUrlResult
            .data
            .publicUrl;


        // Database

        const insertResult =
          await supabase
            .from("snaps")
            .insert({

              latitude: lat,

              longitude: lng,

              image_url: imageUrl

            });


        if (insertResult.error) {

          throw insertResult.error;

        }


        loading.style.display =
          "none";


        alert(
          "✅ Snap successfully posted!"
        );


        closePreview();


        currentLocation = {
          lat: lat,
          lng: lng
        };


        if (map) {

          map.setView(
            [lat, lng],
            17
          );

        }


        await loadSnaps();


      } catch (error) {

        console.error(
          "POST ERROR:",
          error
        );


        loading.style.display =
          "none";


        alert(
          "Snap upload nahi hua:\n\n" +
          (error.message ||
            "Unknown error")
        );

      }

    }


    // ============================================================
    // FRESH LOCATION
    // ============================================================

    function getFreshLocation() {

      return new Promise(
        function (resolve, reject) {

          navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
              enableHighAccuracy: true,
              timeout: 15000,
              maximumAge: 0
            }
          );

        }
      );

    }


    // ============================================================
    // DISTANCE
    // ============================================================

    function getDistanceMeters(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const dLat =
        toRadians(lat2 - lat1);

      const dLon =
        toRadians(lon2 - lon1);


      const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
          toRadians(lat1)
        ) *

        Math.cos(
          toRadians(lat2)
        ) *

        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);


      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );


      return R * c;

    }


    function toRadians(value) {

      return value *
        Math.PI /
        180;

    }


    // ============================================================
    // LOAD PUBLIC SNAPS
    // ============================================================

    async function loadSnaps() {

      if (!map || !snapMarkers) {
        return;
      }


      try {

        const supabase =
          getSupabase();


        const result =
          await supabase
            .from("snaps")
            .select(
              "id, latitude, longitude, image_url, created_at"
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            )
            .limit(500);


        if (result.error) {

          throw result.error;

        }


        snapMarkers.clearLayers();


        result.data.forEach(
          function (snap) {

            if (
              typeof snap.latitude !==
                "number" ||
              typeof snap.longitude !==
                "number"
            ) {

              return;

            }


            const icon =
              L.divIcon({

                className: "",

                html:
                  '<div class="ghost-marker">👻</div>',

                iconSize: [
                  42,
                  42
                ],

                iconAnchor: [
                  21,
                  21
                ],

                popupAnchor: [
                  0,
                  -21
                ]

              });


            const marker =
              L.marker(
                [
                  snap.latitude,
                  snap.longitude
                ],
                {
                  icon: icon
                }
              );


            const date =
              snap.created_at
                ? new Date(
                    snap.created_at
                  ).toLocaleString()
                : "";


            marker.bindPopup(
              `
                <div style="text-align:center">
                  <img
                    class="popupImage"
                    src="${escapeHtml(
                      snap.image_url
                    )}"
                    alt="Past Snap"
                  />

                  <div class="popupTime">
                    ${escapeHtml(date)}
                  </div>
                </div>
              `
            );


            marker.addTo(
              snapMarkers
            );

          }
        );


      } catch (error) {

        console.error(
          "LOAD SNAPS ERROR:",
          error
        );

        // Do NOT break map if Supabase fails.

      }

    }


    // ============================================================
    // BASIC HTML ESCAPE
    // ============================================================

    function escapeHtml(value) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ============================================================
    // START APP
    // ============================================================

    window.addEventListener(
      "load",
      async function () {

        // IMPORTANT:
        // Map starts FIRST.

        initMap();


        // Give Leaflet time to render.

        setTimeout(
          function () {

            if (map) {
              map.invalidateSize();
            }

          },
          500
        );


        // Supabase is loaded separately.
        // If it fails, map still works.

        try {

          await loadSnaps();

        } catch (error) {

          console.error(
            "Initial snap loading failed:",
            error
          );

        }

      }
    );

  </script>

</body>
