<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

const supabaseClient =
window.supabase.createClient(

 SUPABASE_KEY
);


/* =========================================================
   GLOBALS
========================================================= */

let currentUser = null;

/* =========================================================

document.getElementById("cameraModal");

/* =========================================================
   STATUS
========================================================= */

function showStatus(msg,ms=2500){

 const el =
 document.getElementById("status");

 el.textContent = msg;
 el.style.display = "block";

 clearTimeout(showStatus.timer);

 showStatus.timer =
 setTimeout(()=>{
  el.style.display = "none";
 },ms);

}


/* =========================================================
   MAP
========================================================= */

map =
L.map("map",{
 zoomControl:true
})
.setView(
 [20.5937,78.9629],
 5
);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  maxZoom:20,
  attribution:
  "© OpenStreetMap contributors"
 }
)
.addTo(map);


/* =========================================================
   IMPORTANT
   NO MAP CLICK CAMERA
========================================================= */


/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(a,b){

 const R=6371000;

 const p1 =
 a.lat*Math.PI/180;

 const p2 =
 b.lat*Math.PI/180;

 const dp =
 (b.lat-a.lat)*Math.PI/180;

 const dl =
 (b.lng-a.lng)*Math.PI/180;

 const x =
 Math.sin(dp/2)**2+
 Math.cos(p1)*
 Math.cos(p2)*
 Math.sin(dl/2)**2;

 return 2*R*
 Math.atan2(
  Math.sqrt(x),
  Math.sqrt(1-x)
 );

}


/* =========================================================
   GHOST MARKER
========================================================= */

function makeGhostIcon(count){

 return L.divIcon({

  className:"",

  html:
  `<div class="markerGhost">
    👻
    <span>${count}</span>
   </div>`,

  iconSize:[40,40],
  iconAnchor:[20,20]

 });

}


/* =========================================================
   CLUSTER
========================================================= */

function renderSnaps(rows){

 Object.values(markerGroups)
 .forEach(marker=>{
  map.removeLayer(marker);
 });

 markerGroups={};

 const groups=[];

 rows.forEach(row=>{

  const lat =
  Number(row.latitude);

  const lng =
  Number(row.longitude);

  let group =
  groups.find(g=>
   distanceMeters(
    {
     lat:g.latitude,
     lng:g.longitude
    },
    {
     lat:lat,
     lng:lng
    }
   ) < 50
  );

  if(!group){

   group={
    latitude:lat,
    longitude:lng,
    items:[]
   };

   groups.push(group);

  }

  group.items.push(row);

 });


 groups.forEach((group,index)=>{

  const marker =
  L.marker(
   [
    group.latitude,
    group.longitude
   ],
   {
    icon:
    makeGhostIcon(
     group.items.length
    )
   }
  )
  .addTo(map);


  marker.on(
   "click",
   ()=>{
    openGallery(
     group.items
    );
   }
  );


  markerGroups[index]=marker;

 });

}


/* =========================================================
   LOAD SNAPS
========================================================= */

async function loadSnaps(){

 const {data,error} =
 await supabaseClient
 .from("snaps")
 .select("*")
 .order(
  "created_at",
  {
   ascending:false
  }
 );


 if(error){

  console.error(error);

  showStatus(
   "Snaps load nahi ho paaye."
  );

  return;

 }


 renderSnaps(
  data || []
 );

}


/* =========================================================
   SEARCH
========================================================= */

async function searchPlace(){

 const q =
 document
 .getElementById("searchInput")
 .value
 .trim();

 if(!q)return;

 showStatus(
  "Location search ho rahi hai..."
 );

 try{

  const url =
  "https://nominatim.openstreetmap.org/search"+
  "?format=jsonv2"+
  "&limit=8"+
  "&q="+
  encodeURIComponent(q+", India");

  const response =
  await fetch(url);

  const data =
  await response.json();

  if(!data.length){

   showStatus(
    "Location nahi mili."
   );

   return;

  }

  const p=data[0];

  map.setView(
   [
    Number(p.lat),
    Number(p.lon)
   ],
   15
  );

 }catch(error){

  console.error(error);

  showStatus(
   "Search failed."
  );

 }

}

document
.getElementById("searchBtn")
.onclick=searchPlace;

document
.getElementById("searchInput")
.addEventListener(
 "keydown",
 e=>{
  if(e.key==="Enter")
   searchPlace();
 }
);


/* =========================================================
   AUTH
========================================================= */

async function loadAuth(){

 const {
  data
 } =
 await supabaseClient
 .auth
 .getSession();

 currentUser =
 data.session?.user ||
 null;

 if(currentUser){

  await loadProfile();

  document
  .getElementById("accountBtn")
  .textContent =
  currentProfile?.display_name ||
  "Account";

 }else{

  document
  .getElementById("accountBtn")
  .textContent =
  "Login";

 }

}


async function loadProfile(){

 if(!currentUser)return;

 const {data,error} =
 await supabaseClient
 .from("profiles")
 .select("*")
 .eq(
  "id",
  currentUser.id
 )
 .maybeSingle();

 if(error){

  console.error(error);
  return;

 }

 currentProfile=data;

}


/* =========================================================

========================================================= */

function openAuth(mode="register"){

 document

 const title =

  "authTitle"
 );

 const name =
 document.getElementById(
  "authName"
 );

 const main =
 document.getElementById(
  "authMainBtn"
 );

 const switchBtn =
 document.getElementById(
  "authSwitch"
 );


 if(mode==="register"){

  title.textContent =
  "Register";

function filterToCss(filter){

 switch(filter){

  case "vintage":
   return "sepia(.7) contrast(1.1) saturate(.8)";

  case "bw":
   return "grayscale(1)";

  case "warm":
   return "sepia(.25) saturate(1.35)";

  case "cool":
   return "saturate(.9) hue-rotate(15deg)";

  case "glow":
   return "brightness(1.1) saturate(1.2)";

  case "night":
   return "brightness(.65) contrast(1.25) saturate(1.2)";

  case "pop":
   return "saturate(1.8) contrast(1.15)";

  case "dream":
   return "brightness(1.08) contrast(.9) saturate(1.2)";

  case "sunset":
   return "sepia(.25) saturate(1.5) hue-rotate(-10deg)";

  default:
   return "none";

 }

}

 return types.find(
  t=>MediaRecorder

async function startRecording(){

 if(!cameraStream)return;

 if(
  !(await lockCaptureLocation())
 )
 return;


 const mime =
 chooseMime();

 if(!mime){

  showStatus(
   "Video recording supported nahi hai."
  );

  return;

 }


 recordedChunks=[];

 recorder =
 new MediaRecorder(
  cameraStream,
  {
   mimeType:mime
  }
 );


 recordingStartedAt =
 Date.now();


 recorder.ondataavailable =
 e=>{

  if(
   e.data &&
   e.data.size
  ){

   recordedChunks.push(
    e.data
   );

  }

 };


 recorder.onstop=()=>{

  capturedBlob =
  new Blob(
   recordedChunks,
   {
    type:mime
   }
  );


  capturedType="video";

  capturedVideoUrl =
  URL.createObjectURL(

  );

  .style.display=
  "flex";

  "none";

 };

/* =========================================================
   HELPERS
========================================================= */

function formatMB(bytes){

 return (
  bytes/
  1024/
  1024
 )
 .toFixed(2)
 +" MB";

}


function formatDuration(sec){

 sec=Math.max(
  0,
  Math.floor(sec)
 );

 return String(
  Math.floor(sec/60)
 )
 .padStart(2,"0")
 +":"+
 String(
  sec%60
 )
 .padStart(2,"0");

}


function dataURLToBlob(dataURL){

 const parts =
 dataURL.split(",");

 const mime =
 parts[0]
 .match(
  /:(.*?);/
 )[1];

 const binary =
 atob(parts[1]);

 const arr =
 new Uint8Array(
  binary.length
 );

 for(
  let i=0;
  i<binary.length;
  i++
 ){

  arr[i]=
  binary.charCodeAt(i);

 }

 return new Blob(
  [arr],
  {
   type:mime
  }
 );

}

async function uploadFile(
 path,
 blob,
 accessToken
){

 const url =
 SUPABASE_URL+
 "/storage/v1/object/past-snaps/"+
 encodeURIComponent(path);


 const xhr =
 new XMLHttpRequest();


 return new Promise(
  (resolve,reject)=>{

   xhr.open(
    "POST",
    url,
    true
   );


   xhr.setRequestHeader(
    "apikey",
    SUPABASE_KEY
   );


   xhr.setRequestHeader(
    "Authorization",
    "Bearer "+
    accessToken
   );


   xhr.setRequestHeader(
    "Content-Type",
    blob.type
   );


   xhr.setRequestHeader(
    "x-upsert",
    "false"
   );


   xhr.upload.onprogress=
   e=>{

    if(
     e.lengthComputable
    ){

     setUploadProgress(
      (
       e.loaded/
       e.total
      )*100,
      "Uploading..."
     );

    }

   };


   xhr.onload=()=>{

    if(
     xhr.status>=200 &&
     xhr.status<300
    ){

     resolve();

    }else{

     reject(
      new Error(
       xhr.responseText
      )
     );

    }

   };


   xhr.onerror=
   ()=>reject(
    new Error(
     "Network error"
    )
   );


   xhr.send(blob);

  }
 );

}

 ){

  );

 }


 let pos;


 try{

  pos =
  await getFreshPosition();

 }catch(e){

  showStatus(
   "Live location required hai.",
   3000
  );

  return;

 }


 const currentLat =
 pos.coords.latitude;

 const currentLng =
 pos.coords.longitude;


 const distance =
 distanceMeters(
  {
   lat:
   capturedLatitude,
   lng:
   capturedLongitude
  },
  {
   lat:
   currentLat,
   lng:
   currentLng
  }
 );


 if(distance>50){

  );

 const {

 } =

 ?.access_token;


 if(!accessToken){

  isPostingSnap=false;
  btn.disabled=false;
  btn.textContent="📍 Post Snap";

  openAuth("login");

  return;

 }


 const uploadBox =
 document.getElementById(
  "uploadBox"
 );

 uploadBox.style.display=

 try{

  capturedType==="video"
  ?"webm"
  :"jpg";

  "/snap_"+
  Date.now()+
  "_"+
  Math.random()
  .toString(36)
  .slice(2,9)+

   path,
   capturedBlob,
   accessToken
  );


  const publicUrl =
  SUPABASE_URL+
  "/storage/v1/object/public/past-snaps/"+
  path;


  const {error} =
  await supabaseClient
  .from("snaps")
  .insert({

   latitude:

   capturedLongitude,

   image_url:
   publicUrl,

  });


  if(error)
   throw error;


  uploadBox.style.display=
  "none";

  "none";


  showStatus(
   "✅ Snap posted successfully!",
   3000
  );


  capturedBlob=null;
  capturedImageData=null;
  capturedLatitude=null;
  capturedLongitude=null;

   );

 }catch(error){

  showStatus(
   "Post failed: "+
   (
    error.message ||

   ),
   5000
  );


 }finally{

 items || [];

 galleryIndex=0;

 if(!galleryItems.length)
  return;


 galleryModal.style.display=
 "flex";

 await renderGalleryItem();

}


async function renderGalleryItem(){

 const item =
 galleryItems[
  galleryIndex
 ];


 currentGallerySnap =
 item;


 document
 .getElementById(
  "galleryCounter"
 )
 .textContent =
 (
  galleryIndex+1
 )+
 " / "+
 galleryItems.length;


 const img =
 document.getElementById(
  "galleryImage"
 );

 const video =
 document.getElementById(
  "galleryVideo"
 );


 img.style.display="none";
 video.style.display="none";

 video.pause();


 if(
  item.media_type==="video"
 ){

  video.src=
  item.image_url;

  video.style.display=
  "block";

 }else{

  img.src=
  item.image_url;

  img.style.display=
  "block";

 }


 await loadPostDetails(item);

}


/* =========================================================
   POST INFORMATION + SOCIAL
========================================================= */

async function loadPostDetails(item){

 let profile=null;


 if(item.user_id){

  const {data} =
  await supabaseClient
  .from("profiles")
  .select(
   "display_name"
  )
  .eq(
   "id",
   item.user_id
  )
  .maybeSingle();

  profile=data;

 }


 const {
  count:likes
 } =
 await supabaseClient
 .from("snap_likes")
 .select(
  "*",
  {
   count:"exact",
   head:true
  }
 )
 .eq(
  "snap_id",
  item.id
 );


 const {
  count:comments
 } =
 await supabaseClient
 .from("snap_comments")
 .select(
  "*",
  {
   count:"exact",
   head:true
  }
 )
 .eq(
  "snap_id",
  item.id
 );


 const {
  count:views
 } =
 await supabaseClient
 .from("snap_views")
 .select(
  "*",
  {
   count:"exact",
   head:true
  }
 )
 .eq(
  "snap_id",
  item.id
 );


 let liked=false;


 if(currentUser){

  const {data} =
  await supabaseClient
  .from("snap_likes")
  .select("id")
  .eq(
   "snap_id",
   item.id
  )
  .eq(
   "user_id",
   currentUser.id
  )
  .maybeSingle();

  liked=!!data;

 }


 const date =
 item.created_at
 ?
 new Date(
  item.created_at
 ).toLocaleDateString()
 :"";


 const time =
 item.created_at
 ?
 new Date(
  item.created_at
 ).toLocaleTimeString(
  [],
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 )
 :"";


 const location =
 Number(
  item.latitude
 ).toFixed(5)+
 ", "+
 Number(
  item.longitude
 ).toFixed(5);


 document
 .getElementById(
  "galleryDetails"
 )
 .innerHTML =

 `<div>
   <b>👤 Posted by:</b>
   ${escapeHtml(
    profile?.display_name ||
    "User"
   )}
  </div>

  <div>
   <b>📍 Location:</b>
   ${location}
  </div>

  <div>
   <b>📅 Date:</b>
   ${date}
   &nbsp;
   <b>🕐 Time:</b>
   ${time}
  </div>

  ${
   item.description
   ?
   `<div>
    <b>📝:</b>
    ${escapeHtml(
     item.description
    )}
   </div>`
   :""
  }`;


 document
 .getElementById(
  "likeCount"
 )
 .textContent =
 likes || 0;


 document
 .getElementById(
  "commentCount"
 )
 .textContent =
 comments || 0;


 document
 .getElementById(
  "viewCount"
 )
 .textContent =
 views || 0;


 document
 .getElementById(
  "likeBtn"
 )
 .classList
 .toggle(
  "liked",
  liked
 );


 document
 .getElementById(
  "commentsList"
 )
 .style.display=
 "none";


 await addViewOnce(item);

}


/* =========================================================
   VIEW
========================================================= */

async function addViewOnce(item){

 if(!currentUser)return;

 const {error} =
 await supabaseClient
 .from("snap_views")
 .insert({

  snap_id:
  item.id,

  user_id:
  currentUser.id

 });


 if(error){

  // Unique constraint means
  // user already viewed it.
  return;

 }


 const {
  count
 } =
 await supabaseClient
 .from("snap_views")
 .select(
  "*",
  {
   count:"exact",
   head:true
  }
 )
 .eq(
  "snap_id",
  item.id
 );


 document
 .getElementById(
  "viewCount"
 )
 .textContent =
 count || 0;

}


/* =========================================================
   LIKE
========================================================= */

document
.getElementById(
 "likeBtn"
)
.onclick=
async()=>{

 if(!currentUser){

  openAuth("login");
  return;

 }


 if(!currentGallerySnap)
  return;


 const snapId =
 currentGallerySnap.id;


 const {
  data:existing
 } =
 await supabaseClient
 .from("snap_likes")
 .select("id")
 .eq(
  "snap_id",
  snapId
 )
 .eq(
  "user_id",
  currentUser.id
 )
 .maybeSingle();


 if(existing){

  const {error} =
  await supabaseClient
  .from("snap_likes")
  .delete()
  .eq(
   "id",
   existing.id
  );

  if(error){

   showStatus(
    "Like remove nahi hua."
   );

   return;

  }

 }else{

  const {error} =
  await supabaseClient
  .from("snap_likes")
  .insert({

   snap_id:snapId,

   user_id:
   currentUser.id

  });


  if(error){

   showStatus(
    "Like nahi hua."
   );

   return;

  }

 }


 await loadPostDetails(
  currentGallerySnap
 );

};


/* =========================================================
   COMMENTS
========================================================= */

document
.getElementById(
 "commentBtn"
)
.onclick=
async()=>{

 if(!currentUser){

  openAuth("login");
  return;

 }


 const box =
 document.getElementById(
  "commentBox"
 );

 const list =
 document.getElementById(
  "commentsList"
 );


 box.style.display =
 box.style.display==="block"
  ?"none"
  :"block";


 if(box.style.display==="block"){

  await loadComments(
   currentGallerySnap.id
  );

 }

};


async function loadComments(snapId){

 const {
  data,
  error
 } =
 await supabaseClient
 .from("snap_comments")
 .select("*")
 .eq(
  "snap_id",
  snapId
 )
 .order(
  "created_at",
  {
   ascending:true
  }
 );


 if(error){

  console.error(error);
  return;

 }


 const list =
 document.getElementById(
  "commentsList"
 );


 list.style.display=
 "block";


 if(!data.length){

  list.innerHTML=
  "<div>No comments yet.</div>";

  return;

 }


 const userIds =
 [
  ...new Set(
   data.map(
    x=>x.user_id
   )
  )
 ];


 const {data:profiles} =
 await supabaseClient
 .from("profiles")
 .select(
  "id,display_name"
 )
 .in(
  "id",
  userIds
 );


 const names={};


 (profiles||[])
 .forEach(
  p=>{
   names[p.id]=
   p.display_name;
  }
 );


 list.innerHTML =
 data.map(c=>`

  <div class="commentRow">

   <div class="commentUser">
    ${escapeHtml(
     names[c.user_id] ||
     "User"
    )}
   </div>

   <div>
    ${escapeHtml(
     c.comment_text
    )}
   </div>

   <div class="commentTime">
    ${new Date(
     c.created_at
    ).toLocaleString()}
   </div>

  </div>

 `).join("");

}


document
.getElementById(
 "sendCommentBtn"
)
.onclick=
async()=>{

 if(!currentUser){

  openAuth("login");
  return;

 }


 if(!currentGallerySnap)
  return;


 const input =
 document.getElementById(
  "commentInput"
 );


 const text =
 input.value.trim();


 if(!text){

  showStatus(
   "Comment likho."
  );

  return;

 }


 if(
  text.split(/\s+/).length >
  250
 ){

  showStatus(
   "Comment maximum 250 words ka hai."
  );

  return;

 }


 const {error} =
 await supabaseClient
 .from("snap_comments")
 .insert({

  snap_id:
  currentGallerySnap.id,

  user_id:
  currentUser.id,

  comment_text:
  text

 });


 if(error){

  console.error(error);

  showStatus(
   "Comment post nahi hua."
  );

  return;

 }


 input.value="";


 await loadComments(
  currentGallerySnap.id
 );


 await loadPostDetails(
  currentGallerySnap
 );


};


document
.getElementById(
 "cancelCommentBtn"
)
.onclick=()=>{

 document
 .getElementById(
  "commentBox"
 )
 .style.display=
 "none";

};


/* =========================================================
   VIEWER SWIPE
========================================================= */

let touchStartX=0;


const galleryBox =
document.getElementById(
 "galleryImageBox"
);


galleryBox
.addEventListener(
 "touchstart",
 e=>{

  touchStartX =
  e.changedTouches[0]
  .clientX;

 },
 {
  passive:true
 }
);


galleryBox
.addEventListener(
 "touchend",
 async e=>{

  const dx =
  e.changedTouches[0]
  .clientX-
  touchStartX;


  if(
   Math.abs(dx)<50
  )
  return;


  if(dx<0){

   galleryIndex =
   (
    galleryIndex+1
   )%
   galleryItems.length;

  }else{

   galleryIndex =
   (
    galleryIndex-1+
    galleryItems.length
   )%
   galleryItems.length;

  }


  await renderGalleryItem();

 },
 {
  passive:true
 }
);


/* =========================================================
   CLOSE VIEWER
========================================================= */

document
.getElementById(
 "closeGalleryBtn"
)
.onclick=()=>{

 document
 .getElementById(
  "galleryVideo"
 )
 .pause();

 document
 .getElementById(
  "commentsList"
 )
 .style.display=
 "none";

 document
 .getElementById(
  "commentBox"
 )
 .style.display=
 "none";

 galleryModal.style.display=
 "none";

 currentGallerySnap=null;

};

let modalHistory=false;


function openCameraWithHistory(){

 if(!modalHistory){

  history.pushState(
   {
    pastSnapModal:
    "camera"
   },
   "",
   "#camera"
  );

  modalHistory=true;

 }

 openCamera();

}


window.addEventListener(
 "popstate",
 ()=>{

  if(
   cameraModal.style.display===
   "flex"
  ){

   stopCameraStream();

   cameraModal.style.display=
   "none";

  }

  if(
   previewModal.style.display===
   "flex"
  ){

   previewModal.style.display=
   "none";

  }

  if(
   galleryModal.style.display===
   "flex"
  ){

   document
   .getElementById(
    "galleryVideo"
   )
   .pause();

   galleryModal.style.display=
   "none";

  }

  modalHistory=false;

 });


/* =========================================================
   START
========================================================= */

(async()=>{

 await loadAuth();

 await loadSnaps();

 if(currentUser){

  await loadNotifications();

 }

})();
