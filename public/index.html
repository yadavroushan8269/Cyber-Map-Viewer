<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Past Snap</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #app {

      height: 100%;

    /* HEADER */

      right: 10px;

      position: absolute;

    /* MY LOCATION */

      border-radius: 30px;

      color: #111;

      box-shadow: 0 4px 18px rgba(0,0,0,.25);

      z-index: 1100;

      left: 50%;
      bottom: 80px;

      transform: translateX(-50%);

      max-width: 90%;

      padding: 9px 14px;

      border-radius: 20px;

      background: rgba(0,0,0,.78);
      color: white;

      font-size: 13px;
      text-align: center;

      display: none;

      position: fixed;
      z-index: 5000;

      inset: 0;

      background: #000;

      display: none;

    }

    #cameraVideo {
      width: 100%;
      height: 100%;

      object-fit: cover;
      background: #000;
    }

    #cameraCanvas {

    }

    }

    #filterBar {

      z-index: 10;

    .filterBtn {

      border: 1px solid rgba(255,255,255,.5);

      background: rgba(0,0,0,.5);
      color: white;

      font-size: 12px;
    }

    .filterBtn.active {
      background: white;
      color: black;
    }

    #cameraBottom {
      position: absolute;
      z-index: 10;

      left: 0;
      right: 0;

      display: flex;
      justify-content: center;
      gap: 25px;
    }

    #captureBtn {
      width: 72px !important;
      height: 72px !important;

      border: 5px solid white !important;
      background: #fff !important;
    }

    /* PREVIEW */
    #previewModal {
      position: fixed;
      z-index: 6000;

      inset: 0;

      background: #000;

      display: none;
      flex-direction: column;
    }

    #previewImage {
      width: 100%;
      height: calc(100% - 90px);

      object-fit: contain;
    }

    #previewBottom {
      height: 90px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 15px;
    }

    #previewBottom button {
      padding: 13px 25px;

      border: none;
      border-radius: 25px;

      font-weight: bold;
    }

    #postBtn {
      background: white;
      color: black;
    }

    #cancelPreviewBtn {
      background: #333;
      color: white;
    }

    /* GALLERY */
    #galleryModal {
      position: fixed;
      z-index: 7000;

      inset: 0;

      background: rgba(0,0,0,.96);

      display: none;
      flex-direction: column;
    }

    #galleryTop {
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;

    }

    #galleryCounter {

    }

      max-width: 95%;
      max-height: 85%;
      object-fit: contain;
    }

    .galleryArrow {

      top: 50%;
      transform: translateY(-50%);

      width: 48px;

      border: none;

      color: white;

      font-size: 25px;

    }

    }

    /* MARKERS */
    .snap-marker {
      display: flex;
      align-items: center;
      justify-content: center;

      min-width: 38px;
      height: 38px;

      padding: 0 7px;

      border-radius: 22px;

      background: white;

      box-shadow: 0 3px 12px rgba(0,0,0,.35);

      font-size: 22px;

      border: 2px solid #111;
    }

    .snap-count {
      margin-left: 3px;

      font-size: 13px;
      font-weight: bold;
    }

    .leaflet-control-attribution {
      font-size: 9px;
    }
  </style>
</head>

<div id="app">

  <div id="topbar">

  <div id="map"></div>

  <button id="locationBtn">
    📍 My Location

  <!-- CAMERA -->

      autoplay

    <canvas id="cameraCanvas"></canvas>

      </button>

      <button class="filterBtn" data-filter="cool">

      </button>

      <button class="filterBtn" data-filter="night">

      <button

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

let supabaseClient = null;

let map = null;

let cameraStream = null;

let currentFacingMode = "environment";

let currentFilter = "none";

let currentLocation = null;

let selectedSnap = null;

let allSnaps = [];

let snapGroups = [];

let gallerySnaps = [];

let galleryIndex = 0;

let searchMarker = null;


/* ==========================================
   SUPABASE
========================================== */

function initSupabase(){

  if(supabaseClient){
    return supabaseClient;
  }

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){
      throw new Error("Supabase library not loaded");
    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return supabaseClient;

  }catch(error){

    console.error(error);

    showStatus(
      "Supabase load nahi hua."
    );

    return null;
  }
}


/* ==========================================
   STATUS
========================================== */

function showStatus(message){

  const el =
    document.getElementById("status");

  el.textContent = message;

  el.style.display = "block";

  clearTimeout(showStatus.timer);

  showStatus.timer =
    setTimeout(() => {

      el.style.display = "none";

    }, 3500);
}


/* ==========================================
   MAP
========================================== */

function initMap(){

  map =
    L.map("map", {
      zoomControl: true
    }).setView(
      [20.5937, 78.9629],
      5
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 20,
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  /*
   * IMPORTANT:
   * Map move/zoom hone par visible area ke
   * snaps dobara Supabase se load honge.
   */

  let moveTimer = null;

  map.on("moveend", function(){

    clearTimeout(moveTimer);

    moveTimer = setTimeout(
      loadSnapsForVisibleArea,
      250
    );

  });

}


/* ==========================================
   DISTANCE
========================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;

  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1 * Math.PI/180) *
    Math.cos(lat2 * Math.PI/180) *
    Math.sin(dLon/2) ** 2;

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );
}


/* ==========================================
   CREATE GROUPS
========================================== */

function makeGroups(snaps){

  const groups = [];

  const GROUP_DISTANCE = 30;

  snaps.forEach(function(snap){

    let found = null;

    for(
      let i = 0;
      i < groups.length;
      i++
    ){

      const g = groups[i];

      const d =
        distanceMeters(
          Number(snap.latitude),
          Number(snap.longitude),
          g.latitude,
          g.longitude
        );

      if(d <= GROUP_DISTANCE){

        found = g;
        break;
      }
    }

    if(!found){

      groups.push({

        latitude:
          Number(snap.latitude),

        longitude:
          Number(snap.longitude),

        snaps: [snap]

      });

    }else{

      found.snaps.push(snap);

      /*
       * Group center update
       */
      let latSum = 0;
      let lonSum = 0;

      found.snaps.forEach(function(item){

        latSum +=
          Number(item.latitude);

        lonSum +=
          Number(item.longitude);

      });

      found.latitude =
        latSum /
        found.snaps.length;

      found.longitude =
        lonSum /
        found.snaps.length;
    }

  });

  return groups;
}


/* ==========================================
   CLEAR MARKERS
========================================== */

function clearSnapMarkers(){

  if(!map){
    return;
  }

  map.eachLayer(function(layer){

    if(
      layer.options &&
      layer.options.isSnapMarker
    ){

      map.removeLayer(layer);

    }

  });

}


/* ==========================================
   DRAW MARKERS
========================================== */

function drawSnapMarkers(){

  if(!map){
    return;
  }

  clearSnapMarkers();

  snapGroups =
    makeGroups(allSnaps);

  snapGroups.forEach(function(group){

    const count =
      group.snaps.length;

    let html =
      '<div class="snap-marker">👻';

    if(count > 1){

      html +=
        '<span class="snap-count">' +
        count +
        '</span>';

    }

    html += "</div>";

    const icon =
      L.divIcon({

        html: html,

        className: "",

        iconSize: [
          count > 1 ? 65 : 40,
          40
        ],

        iconAnchor: [
          count > 1 ? 32 : 20,
          20
        ]

      });

    const marker =
      L.marker(
        [
          group.latitude,
          group.longitude
        ],
        {
          icon: icon,
          isSnapMarker: true
        }
      ).addTo(map);

    marker.on(
      "click",
      function(){

        openGallery(
          group.snaps
        );

      }
    );

  });

}


/* ==========================================
   LOAD VISIBLE AREA SNAPS
========================================== */

async function loadSnapsForVisibleArea(){

  const client =
    initSupabase();

  if(!client || !map){
    return;
  }

  const bounds =
    map.getBounds();

  const north =
    bounds.getNorth();

  const south =
    bounds.getSouth();

  const east =
    bounds.getEast();

  const west =
    bounds.getWest();

  try{

    /*
     * Visible map bounding box.
     *
     * Iska matlab:
     * Map ke current screen area ke bahar
     * ke snaps fetch nahi honge.
     */

    const { data, error } =
      await client
        .from("snaps")
        .select(
          "id,latitude,longitude,image_url,created_at"
        )
        .gte(
          "latitude",
          south
        )
        .lte(
          "latitude",
          north
        )
        .gte(
          "longitude",
          west
        )
        .lte(
          "longitude",
          east
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        )
        .limit(1000);

    if(error){
      throw error;
    }

    allSnaps =
      Array.isArray(data)
        ? data
        : [];

    drawSnapMarkers();

    console.log(
      "Visible area snaps:",
      allSnaps.length
    );

  }catch(error){

    console.error(
      "VISIBLE SNAP LOAD ERROR:",
      error
    );

  }

}


/* ==========================================
   INITIAL LOAD
========================================== */

async function loadSnaps(){

  await loadSnapsForVisibleArea();

}


/* ==========================================
   LOCATION
========================================== */

function getUserLocation(){

  if(!navigator.geolocation){

    showStatus(
      "Is device mein location supported nahi hai."
    );

    return;

  }

  showStatus(
    "📍 Location detect ho rahi hai..."
  );

  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      currentLocation = {
        latitude: lat,
        longitude: lng
      };

      map.setView(
        [lat, lng],
        17
      );

      L.circleMarker(
        [lat, lng],
        {
          radius: 8
        }
      )
      .addTo(map)
      .bindPopup(
        "📍 You are here"
      )
      .openPopup();

      showStatus(
        "📍 Location mil gayi."
      );

      openCamera();

    },

    function(error){

      console.error(error);

      showStatus(
        "Location permission allow karo."
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }

  );

}


/* ==========================================
   CAMERA
========================================== */

async function openCamera(){

  const modal =
    document.getElementById(
      "cameraModal"
    );

  try{

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode:
              currentFacingMode,

            width: {
              ideal: 1280
            },

            height: {
              ideal: 720
            }
          },

          audio: false

        });

    const video =
      document.getElementById(
        "cameraVideo"
      );

    video.srcObject =
      cameraStream;

    modal.style.display =
      "flex";

  }catch(error){

    console.error(error);

    showStatus(
      "Camera permission allow karo."
    );

  }

}


function closeCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    cameraStream = null;
  }

  document
    .getElementById(
      "cameraModal"
    )
    .style.display = "none";

}


/* ==========================================
   SWITCH CAMERA
========================================== */

async function switchCamera(){

  currentFacingMode =
    currentFacingMode === "user"
      ? "environment"
      : "user";

  await openCamera();

}


/* ==========================================
   FILTER
========================================== */

function filterToCss(filter){

  switch(filter){

    case "vintage":
      return "sepia(0.7) contrast(1.1) saturate(0.8)";

    case "bw":
      return "grayscale(1)";

    case "warm":
      return "sepia(0.25) saturate(1.35)";

    case "cool":
      return "saturate(0.9) hue-rotate(15deg)";

    case "glow":
      return "brightness(1.1) saturate(1.2)";

    case "night":
      return "brightness(0.65) contrast(1.25) saturate(1.2)";

    case "pop":
      return "saturate(1.8) contrast(1.15)";

    case "dream":
      return "brightness(1.08) contrast(0.9) saturate(1.2)";

    case "sunset":
      return "sepia(0.25) saturate(1.5) hue-rotate(-10deg)";

    default:
      return "none";

  }

}


function applyCameraFilter(){

  document
    .getElementById(
      "cameraVideo"
    )
    .style.filter =
      filterToCss(
        currentFilter
      );

}


/* ==========================================
   CAPTURE
========================================== */

function captureSnap(){

  if(!cameraStream){

    showStatus(
      "Camera ready nahi hai."
    );

    return;

  }

  if(!currentLocation){

    showStatus(
      "Pehle location detect karo."
    );

    return;

  }

  const video =
    document.getElementById(
      "cameraVideo"
    );

  const canvas =
    document.getElementById(
      "cameraCanvas"
    );

  canvas.width =
    video.videoWidth || 1280;

  canvas.height =
    video.videoHeight || 720;

  const ctx =
    canvas.getContext("2d");

  ctx.filter =
    filterToCss(
      currentFilter
    );

  /*
   * Front camera image ko mirror
   * karne ke liye.
   */

  if(
    currentFacingMode === "user"
  ){

    ctx.translate(
      canvas.width,
      0
    );

    ctx.scale(-1, 1);

  }

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.85
    );

  selectedSnap =
    imageData;

  document
    .getElementById(
      "previewImage"
    )
    .src = imageData;

  closeCamera();

  document
    .getElementById(
      "previewModal"
    )
    .style.display = "flex";

}


/* ==========================================
   POST SNAP
========================================== */

async function postSnap(){

  if(!selectedSnap){

    showStatus(
      "Photo available nahi hai."
    );

    return;

  }

  if(!currentLocation){

    showStatus(
      "Location available nahi hai."
    );

    return;

  }

  const client =
    initSupabase();

  if(!client){

    return;

  }

  try{

    showStatus(
      "📤 Snap upload ho raha hai..."
    );

    /*
     * Upload ke time fresh GPS
     * dobara check.
     */

    const position =
      await new Promise(
        function(resolve, reject){

          navigator.geolocation
            .getCurrentPosition(
              resolve,
              reject,
              {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
              }
            );

        }
      );

    const freshLat =
      position.coords.latitude;

    const freshLng =
      position.coords.longitude;

    /*
     * Photo sirf current live location
     * ke near hi post hogi.
     */

    const distance =
      distanceMeters(
        freshLat,
        freshLng,
        currentLocation.latitude,
        currentLocation.longitude
      );

    if(distance > 100){

      showStatus(
        "Aapki location change ho gayi. Dobara snap lo."
      );

      return;

    }

    /*
     * Base64 -> Blob
     */

    const response =
      await fetch(
        selectedSnap
      );

    const blob =
      await response.blob();

    const fileName =
      "snap-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      ".jpg";

    /*
     * Storage upload
     */

    const { error:
      uploadError
    } =
      await client
        .storage
        .from("past-snaps")
        .upload(
          fileName,
          blob,
          {
            contentType:
              "image/jpeg",
            upsert: false
          }
        );

    if(uploadError){

      throw uploadError;

    }

    /*
     * Public URL
     */

    const { data:
      publicData
    } =
      client
        .storage
        .from("past-snaps")
        .getPublicUrl(
          fileName
        );

    const imageUrl =
      publicData.publicUrl;

    /*
     * Database
     */

    const { error:
      dbError
    } =
      await client
        .from("snaps")
        .insert({

          latitude:
            freshLat,

          longitude:
            freshLng,

          image_url:
            imageUrl

        });

    if(dbError){

      throw dbError;

    }

    /*
     * Reset
     */

    selectedSnap = null;

    document
      .getElementById(
        "previewModal"
      )
      .style.display = "none";

    showStatus(
      "👻 Snap public ho gaya!"
    );

    /*
     * Visible area ko fresh load.
     */

    await loadSnapsForVisibleArea();

  }catch(error){

    console.error(
      "POST ERROR:",
      error
    );

    showStatus(
      "Snap post nahi hua: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* ==========================================
   SEARCH LOCATION
========================================== */

async function searchLocation(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const query =
    input.value.trim();

  if(!query){

    showStatus(
      "Location ka naam likho."
    );

    return;

  }

  try{

    showStatus(
      "🔍 Location search ho rahi hai..."
    );

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(query);

    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );

    const results =
      await response.json();

    if(
      !results ||
      results.length === 0
    ){

      showStatus(
        "Location nahi mili."
      );

      return;

    }

    const result =
      results[0];

    const lat =
      Number(result.lat);

    const lon =
      Number(result.lon);

    map.setView(
      [lat, lon],
      15
    );

    if(searchMarker){

      map.removeLayer(
        searchMarker
      );

    }

    searchMarker =
      L.marker(
        [lat, lon]
      )
      .addTo(map)
      .bindPopup(
        result.display_name
      )
      .openPopup();

    /*
     * map.setView ke baad moveend
     * automatically visible snaps load karega.
     */

    await loadSnapsForVisibleArea();

    showStatus(
      "📍 " +
      result.display_name
    );

  }catch(error){

    console.error(error);

    showStatus(
      "Location search failed."
    );

  }

}


/* ==========================================
   GALLERY
========================================== */

function openGallery(snaps){

  if(
    !snaps ||
    snaps.length === 0
  ){

    return;

  }

  gallerySnaps =
    snaps;

  galleryIndex = 0;

  document
    .getElementById(
      "galleryModal"
    )
    .style.display = "flex";

  updateGallery();

}


function updateGallery(){

  if(
    !gallerySnaps ||
    gallerySnaps.length === 0
  ){

    return;

  }

  const snap =
    gallerySnaps[
      galleryIndex
    ];

  document
    .getElementById(
      "galleryImage"
    )
    .src =
      snap.image_url;

  document
    .getElementById(
      "galleryCounter"
    )
    .textContent =
      (
        galleryIndex + 1
      ) +
      " / " +
      gallerySnaps.length;

  document
    .getElementById(
      "prevBtn"
    )
    .style.display =
      gallerySnaps.length > 1
        ? "block"
        : "none";

  document
    .getElementById(
      "nextBtn"
    )
    .style.display =
      gallerySnaps.length > 1
        ? "block"
        : "none";

}


function closeGallery(){

  document
    .getElementById(
      "galleryModal"
    )
    .style.display = "none";

}


function previousGallery(){

  if(
    gallerySnaps.length <= 1
  ){

    return;

  }

  galleryIndex--;

  if(galleryIndex < 0){

    galleryIndex =
      gallerySnaps.length - 1;

  }

  updateGallery();

}


function nextGallery(){

  if(
    gallerySnaps.length <= 1
  ){

    return;

  }

  galleryIndex++;

  if(
    galleryIndex >=
    gallerySnaps.length
  ){

    galleryIndex = 0;

  }

  updateGallery();

}
