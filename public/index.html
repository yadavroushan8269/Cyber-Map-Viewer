<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Past Snap</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

/* =========================
   TOP SEARCH
========================= */

#topbar{
  position:absolute;
  z-index:1000;

  top:10px;
  left:10px;
  right:10px;

  display:flex;
  gap:8px;
  align-items:center;

  padding:8px;

  background:rgba(255,255,255,.95);
  border-radius:16px;

  box-shadow:0 4px 18px rgba(0,0,0,.25);
}

#searchInput{
  flex:1;
  min-width:0;

  height:42px;

  padding:0 13px;

  border:1px solid #ddd;
  border-radius:12px;

  outline:none;

  font-size:14px;
}

#searchBtn{
  height:42px;

  padding:0 13px;

  border:0;
  border-radius:12px;

  background:#111;
  color:white;

  font-weight:bold;
}

/* =========================
   MAP
========================= */

#map{
  position:absolute;
  inset:0;

  z-index:1;

  background:#ddd;
}

/* =========================
   LOCATION
========================= */

#locationBtn{
  position:absolute;
  z-index:1000;

  left:15px;
  bottom:20px;

  padding:13px 17px;

  border:none;
  border-radius:30px;

  background:white;
  color:#111;

  font-weight:bold;
  font-size:14px;

  box-shadow:0 4px 18px rgba(0,0,0,.25);
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  z-index:1100;

  left:50%;
  bottom:80px;

  transform:translateX(-50%);

  max-width:90%;

  padding:9px 14px;

  border-radius:20px;

  background:rgba(0,0,0,.78);
  color:white;

  font-size:13px;
  text-align:center;

  display:none;
}

/* =========================
   CAMERA
========================= */

#cameraModal{
  position:fixed;
  z-index:5000;

  inset:0;

  background:#000;

  display:none;
  flex-direction:column;
}

/*
 IMPORTANT:
 Front camera preview is mirrored horizontally.
 This is the normal selfie-camera behavior.
*/
#cameraVideo{
  width:100%;
  height:100%;

  object-fit:cover;

  background:#000;

  display:block;

  transform:none;
}

/* Only front camera gets mirror */
#cameraVideo.selfie-preview{
  transform:scaleX(-1);
}

#cameraCanvas{
  display:none;
}

/* =========================
   CAMERA TOP
========================= */

#cameraTop{
  position:absolute;
  z-index:10;

  top:15px;
  left:15px;
  right:15px;

  display:flex;
  justify-content:space-between;
}

#cameraTop button,
#cameraBottom button{
  border:none;
  border-radius:50%;

  width:48px;
  height:48px;

  background:rgba(0,0,0,.55);
  color:white;

  font-size:20px;
}

/* =========================
   FILTERS
========================= */

#filterBar{
  position:absolute;
  z-index:10;

  left:10px;
  right:10px;
  bottom:105px;

  display:flex;
  gap:8px;

  overflow-x:auto;

  padding:8px 2px;

  scrollbar-width:none;
}

#filterBar::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:0 0 auto;

  padding:9px 13px;

  border:1px solid rgba(255,255,255,.5);
  border-radius:20px;

  background:rgba(0,0,0,.5);
  color:white;

  font-size:12px;
}

.filterBtn.active{
  background:white;
  color:black;
}

/* =========================
   CAMERA BOTTOM
========================= */

#cameraBottom{
  position:absolute;
  z-index:10;

  left:0;
  right:0;
  bottom:25px;

  display:flex;
  justify-content:center;
}

#captureBtn{
  width:72px !important;
  height:72px !important;

  border:5px solid white !important;

  background:white !important;
}

/* =========================
   PREVIEW
========================= */

#previewModal{
  position:fixed;
  z-index:6000;

  inset:0;

  background:#000;

  display:none;
  flex-direction:column;
}

#previewImage{
  width:100%;
  height:calc(100% - 90px);

  object-fit:contain;
}

#previewBottom{
  height:90px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:15px;
}

#previewBottom button{
  padding:13px 25px;

  border:none;
  border-radius:25px;

  font-weight:bold;
}

#postBtn{
  background:white;
  color:black;
}

#cancelPreviewBtn{
  background:#333;
  color:white;
}

/* =========================
   GALLERY
========================= */

#galleryModal{
  position:fixed;
  z-index:7000;

  inset:0;

  background:rgba(0,0,0,.96);

  display:none;
  flex-direction:column;
}

#galleryTop{
  height:65px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  color:white;
}

#galleryCounter{
  font-weight:bold;
}

#closeGalleryBtn{
  border:none;

  background:transparent;
  color:white;

  font-size:30px;
}

#galleryImageBox{
  flex:1;

  display:flex;
  align-items:center;
  justify-content:center;

  position:relative;
}

#galleryImage{
  max-width:95%;
  max-height:85%;

  object-fit:contain;
}

.galleryArrow{
  position:absolute;

  top:50%;

  transform:translateY(-50%);

  width:48px;
  height:48px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.2);
  color:white;

  font-size:25px;
}

#prevBtn{
  left:12px;
}

#nextBtn{
  right:12px;
}

/* =========================
   SNAP MARKER
========================= */

.snap-marker{
  display:flex;
  align-items:center;
  justify-content:center;

  min-width:38px;
  height:38px;

  padding:0 7px;

  border-radius:22px;

  background:white;

  box-shadow:0 3px 12px rgba(0,0,0,.35);

  font-size:22px;

  border:2px solid #111;
}

.snap-count{
  margin-left:3px;

  font-size:13px;
  font-weight:bold;
}

.leaflet-control-attribution{
  font-size:9px;
}

</style>
</head>

<body>

  <!-- SEARCH -->

  <!-- =========================

  <div id="cameraModal">

      </button>

      <button

        B&W
      </button>

      <button
        class="filterBtn"
        data-filter="warm"

      </button>

      <button

        data-filter="cool"
      >

      </button>

      <button

      </button>

        data-filter="night"
      >

      </button>

      </button>

    <div id="galleryImageBox">

      <img id="galleryImage">

        id="prevBtn"
        class="galleryArrow"

        ‹

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

let supabaseClient = null;


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map = null;

let cameraStream = null;

let currentFacingMode = "user";

let currentFilter = "none";

let currentLocation = null;

let selectedSnap = null;

let allSnaps = [];

let snapGroups = [];

let gallerySnaps = [];

let galleryIndex = 0;

let searchMarker = null;


/* =====================================================
   SUPABASE INIT
===================================================== */

function initSupabase(){

  if(supabaseClient){
    return supabaseClient;
  }

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      throw new Error(
        "Supabase library not loaded"
      );

    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return supabaseClient;

  }catch(error){

    console.error(error);

    showStatus(
      "Supabase load nahi hua."
    );

    return null;

  }

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(message){

  const el =
    document.getElementById(
      "status"
    );

  el.textContent = message;

  el.style.display = "block";

  clearTimeout(
    showStatus.timer
  );

  showStatus.timer =
    setTimeout(
      function(){

        el.style.display = "none";

      },
      3500
    );

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [20.5937,78.9629],
      5
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap contributors"

    }
  ).addTo(map);


  /*
   * Zoom / drag ke baad visible
   * area ke snaps load honge.
   */

  let moveTimer = null;

  map.on(
    "moveend",
    function(){

      clearTimeout(
        moveTimer
      );

      moveTimer =
        setTimeout(
          function(){

            loadSnapsForVisibleArea();

          },
          250
        );

    }
  );

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const dLat =
    (lat2-lat1) *
    Math.PI /
    180;

  const dLon =
    (lon2-lon1) *
    Math.PI /
    180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* =====================================================
   GROUP SNAPS
===================================================== */

function makeGroups(snaps){

  const groups = [];

  const GROUP_DISTANCE = 30;


  snaps.forEach(
    function(snap){

      let found = null;


      for(
        let i=0;
        i<groups.length;
        i++
      ){

        const group =
          groups[i];

        const distance =
          distanceMeters(
            Number(
              snap.latitude
            ),

            Number(
              snap.longitude
            ),

            group.latitude,

            group.longitude
          );


        if(
          distance <=
          GROUP_DISTANCE
        ){

          found = group;

          break;

        }

      }


      if(!found){

        groups.push({

          latitude:
            Number(
              snap.latitude
            ),

          longitude:
            Number(
              snap.longitude
            ),

          snaps:[
            snap
          ]

        });

      }else{

        found.snaps.push(
          snap
        );


        let latSum = 0;

        let lonSum = 0;


        found.snaps.forEach(
          function(item){

            latSum +=
              Number(
                item.latitude
              );

            lonSum +=
              Number(
                item.longitude
              );

          }
        );


        found.latitude =
          latSum /
          found.snaps.length;

        found.longitude =
          lonSum /
          found.snaps.length;

      }

    }
  );


  return groups;

}


/* =====================================================
   CLEAR MARKERS
===================================================== */

function clearSnapMarkers(){

  if(!map){
    return;
  }

  map.eachLayer(
    function(layer){

      if(
        layer.options &&
        layer.options.isSnapMarker
      ){

        map.removeLayer(
          layer
        );

      }

    }
  );

}


/* =====================================================
   DRAW MARKERS
===================================================== */

function drawSnapMarkers(){

  if(!map){
    return;
  }


  clearSnapMarkers();


  snapGroups =
    makeGroups(
      allSnaps
    );


  snapGroups.forEach(
    function(group){

      const count =
        group.snaps.length;


      let html =
        '<div class="snap-marker">👻';


      if(count > 1){

        html +=
          '<span class="snap-count">' +
          count +
          "</span>";

      }


      html +=
        "</div>";


      const icon =
        L.divIcon({

          html:html,

          className:"",

          iconSize:[
            count > 1
              ? 65
              : 40,

            40
          ],

          iconAnchor:[
            count > 1
              ? 32
              : 20,

            20
          ]

        });


      const marker =
        L.marker(
          [
            group.latitude,
            group.longitude
          ],
          {
            icon:icon,

            isSnapMarker:true
          }
        )
        .addTo(map);


      marker.on(
        "click",
        function(){

          openGallery(
            group.snaps
          );

        }
      );

    }
  );

}


/* =====================================================
   LOAD VISIBLE MAP AREA
===================================================== */

async function loadSnapsForVisibleArea(){

  const client =
    initSupabase();

  if(
    !client ||
    !map
  ){

    return;

  }


  const bounds =
    map.getBounds();


  const north =
    bounds.getNorth();

  const south =
    bounds.getSouth();

  const east =
    bounds.getEast();

  const west =
    bounds.getWest();


  try{

    const result =
      await client
        .from("snaps")
        .select(
          "id,latitude,longitude,image_url,created_at"
        )
        .gte(
          "latitude",
          south
        )
        .lte(
          "latitude",
          north
        )
        .gte(
          "longitude",
          west
        )
        .lte(
          "longitude",
          east
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(1000);


    if(result.error){

      throw result.error;

    }


    allSnaps =
      Array.isArray(
        result.data
      )
      ? result.data
      : [];


    drawSnapMarkers();


    console.log(
      "Visible snaps:",
      allSnaps.length
    );


  }catch(error){

    console.error(
      "VISIBLE SNAP LOAD ERROR:",
      error
    );

  }

}


/* =====================================================
   LOCATION
===================================================== */

function getUserLocation(){

  if(
    !navigator.geolocation
  ){

    showStatus(
      "Location supported nahi hai."
    );

    return;

  }


  showStatus(
    "📍 Location detect ho rahi hai..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      currentLocation = {

        latitude:lat,

        longitude:lng

      };


      map.setView(
        [lat,lng],
        17
      );


      L.circleMarker(
        [lat,lng],
        {
          radius:8
        }
      )
      .addTo(map)
      .bindPopup(
        "📍 You are here"
      )
      .openPopup();


      showStatus(
        "📍 Location mil gayi."
      );


      /*
       * Location milne ke baad
       * camera open.
       */

      openCamera();

    },


    function(error){

      console.error(error);

      showStatus(
        "Location permission allow karo."
      );

    },


    {
      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0

    }

  );

}


/* =====================================================
   CAMERA OPEN
===================================================== */

async function openCamera(){

  const modal =
    document.getElementById(
      "cameraModal"
    );

  const video =
    document.getElementById(
      "cameraVideo"
    );


  try{

    /*
     * Previous camera stop.
     */

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );

      cameraStream = null;

    }


    /*
     * Camera permission.
     */

    cameraStream =
      await navigator.mediaDevices
        .getUserMedia({

          video:{

            facingMode:{
              ideal:
                currentFacingMode
            },

            width:{
              ideal:1920
            },

            height:{
              ideal:1080
            },

            aspectRatio:{
              ideal:16/9
            }

          },

          audio:false

        });


    /*
     * Attach stream.
     */

    video.srcObject =
      cameraStream;


    /*
     * IMPORTANT:
     * Front camera = mirrored preview.
     * Back camera = normal preview.
     */

    if(
      currentFacingMode ===
      "user"
    ){

      video.classList.add(
        "selfie-preview"
      );

    }else{

      video.classList.remove(
        "selfie-preview"
      );

    }


    /*
     * Wait until video actually
     * gets dimensions.
     */

    await new Promise(
      function(resolve){

        if(
          video.readyState >= 2
        ){

          resolve();

        }else{

          video.onloadedmetadata =
            function(){

              resolve();

            };

        }

      }
    );


    await video.play();


    modal.style.display =
      "flex";


  }catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );


    showStatus(
      "Camera permission allow karo."
    );

  }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    cameraStream = null;

  }


  const video =
    document.getElementById(
      "cameraVideo"
    );


  video.srcObject = null;


  document
    .getElementById(
      "cameraModal"
    )
    .style.display =
      "none";

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

  currentFacingMode =
    currentFacingMode ===
    "user"
      ? "environment"
      : "user";


  await openCamera();

}


/* =====================================================
   FILTER CSS
===================================================== */

function filterToCss(filter){

  switch(filter){

    case "vintage":

      return
        "sepia(.7) contrast(1.1) saturate(.8)";


    case "bw":

      return
        "grayscale(1)";


    case "warm":

      return
        "sepia(.25) saturate(1.35)";


    case "cool":

      return
        "saturate(.9) hue-rotate(15deg)";


    case "glow":

      return
        "brightness(1.1) saturate(1.2)";


    case "night":

      return
        "brightness(.65) contrast(1.25) saturate(1.2)";


    case "pop":

      return
        "saturate(1.8) contrast(1.15)";


    case "dream":

      return
        "brightness(1.08) contrast(.9) saturate(1.2)";


    case "sunset":

      return
        "sepia(.25) saturate(1.5) hue-rotate(-10deg)";


    default:

      return "none";

  }

}


/* =====================================================
   APPLY FILTER
===================================================== */

function applyCameraFilter(){

  const video =
    document.getElementById(
      "cameraVideo"
    );


  video.style.filter =
    filterToCss(
      currentFilter
    );

}


/* =====================================================
   CAPTURE
===================================================== */

function captureSnap(){

  if(!cameraStream){

    showStatus(
      "Camera ready nahi hai."
    );

    return;

  }


  if(!currentLocation){

    showStatus(
      "Pehle location detect karo."
    );

    return;

  }


  const video =
    document.getElementById(
      "cameraVideo"
    );


  const canvas =
    document.getElementById(
      "cameraCanvas"
    );


  /*
   * Use actual camera dimensions.
   */

  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;


  if(
    !videoWidth ||
    !videoHeight
  ){

    showStatus(
      "Camera abhi ready ho raha hai."
    );

    return;

  }


  canvas.width =
    videoWidth;

  canvas.height =
    videoHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
   * Apply selected filter.
   */

  ctx.filter =
    filterToCss(
      currentFilter
    );


  /*
   * IMPORTANT:
   *
   * Preview front camera mirrored hai,
   * lekin saved photo ko normal
   * camera orientation mein rakhenge.
   *
   * Isliye yahan scaleX(-1)
   * NAHI kar rahe.
   */

  ctx.drawImage(
    video,
    0,
    0,
    videoWidth,
    videoHeight
  );


  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );


  selectedSnap =
    imageData;


  document
    .getElementById(
      "previewImage"
    )
    .src =
      imageData;


  closeCamera();


  document
    .getElementById(
      "previewModal"
    )
    .style.display =
      "flex";

}


/* =====================================================
   POST SNAP
===================================================== */

async function postSnap(){

  if(!selectedSnap){

    showStatus(
      "Photo available nahi hai."
    );

    return;

  }


  if(!currentLocation){

    showStatus(
      "Location available nahi hai."
    );

    return;

  }


  const client =
    initSupabase();


  if(!client){

    return;

  }


  try{

    showStatus(
      "📤 Snap upload ho raha hai..."
    );


    /*
     * Fresh GPS.
     */

    const position =
      await new Promise(
        function(resolve,reject){

          navigator.geolocation
            .getCurrentPosition(
              resolve,
              reject,
              {
                enableHighAccuracy:true,

                timeout:10000,

                maximumAge:0
              }
            );

        }
      );


    const freshLat =
      position.coords.latitude;

    const freshLng =
      position.coords.longitude;


    /*
     * Check distance.
     */

    const distance =
      distanceMeters(
        freshLat,
        freshLng,

        currentLocation.latitude,
        currentLocation.longitude
      );


    if(
      distance > 100
    ){

      showStatus(
        "Location change ho gayi. Dobara snap lo."
      );

      return;

    }


    /*
     * Base64 -> Blob
     */

    const response =
      await fetch(
        selectedSnap
      );


    const blob =
      await response.blob();


    const fileName =
      "snap-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      ".jpg";


    /*
     * Storage upload.
     */

    const uploadResult =
      await client
        .storage
        .from("past-snaps")
        .upload(
          fileName,
          blob,
          {
            contentType:
              "image/jpeg",

            upsert:false
          }
        );


    if(
      uploadResult.error
    ){

      throw uploadResult.error;

    }


    /*
     * Public URL.
     */

    const publicResult =
      client
        .storage
        .from("past-snaps")
        .getPublicUrl(
          fileName
        );


    const imageUrl =
      publicResult
        .data
        .publicUrl;


    /*
     * Database.
     */

    const insertResult =
      await client
        .from("snaps")
        .insert({

          latitude:
            freshLat,

          longitude:
            freshLng,

          image_url:
            imageUrl

        });


    if(
      insertResult.error
    ){

      throw insertResult.error;

    }


    selectedSnap = null;


    document
      .getElementById(
        "previewModal"
      )
      .style.display =
        "none";


    showStatus(
      "👻 Snap public ho gaya!"
    );


    /*
     * Current visible area refresh.
     */

    await loadSnapsForVisibleArea();


  }catch(error){

    console.error(
      "POST ERROR:",
      error
    );


    showStatus(
      "Snap post nahi hua: " +
      (
        error.message ||
        "Unknown error"
      )
    );

  }

}


/* =====================================================
   SEARCH
===================================================== */

async function searchLocation(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if(!query){

    showStatus(
      "Location ka naam likho."
    );

    return;

  }


  try{

    showStatus(
      "🔍 Location search ho rahi hai..."
    );


    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(
        query
      );


    const response =
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const results =
      await response.json();


    if(
      !results ||
      results.length === 0
    ){

      showStatus(
        "Location nahi mili."
      );

      return;

    }


    const result =
      results[0];


    const lat =
      Number(
        result.lat
      );


    const lon =
      Number(
        result.lon
      );


    map.setView(
      [lat,lon],
      15
    );


    if(searchMarker){

      map.removeLayer(
        searchMarker
      );

    }


    searchMarker =
      L.marker(
        [lat,lon]
      )
      .addTo(map)
      .bindPopup(
        result.display_name
      )
      .openPopup();


    /*
     * Search ke baad current
     * area ke snaps.
     */

    await loadSnapsForVisibleArea();


    showStatus(
      "📍 " +
      result.display_name
    );


  }catch(error){

    console.error(error);

    showStatus(
      "Location search failed."
    );

  }

}


/* =====================================================
   GALLERY
===================================================== */

function openGallery(snaps){

  if(
    !snaps ||
    snaps.length === 0
  ){

    return;

  }


  gallerySnaps =
    snaps;


  galleryIndex = 0;


  document
    .getElementById(
      "galleryModal"
    )
    .style.display =
      "flex";


  updateGallery();

}


function updateGallery(){

  if(
    !gallerySnaps ||
    gallerySnaps.length === 0
  ){

    return;

  }


  const snap =
    gallerySnaps[
      galleryIndex
    ];


  document
    .getElementById(
      "galleryImage"
    )
    .src =
      snap.image_url;


  document
    .getElementById(
      "galleryCounter"
    )
    .textContent =
      (
        galleryIndex + 1
      ) +
      " / " +
      gallerySnaps.length;


  const display =
    gallerySnaps.length > 1
      ? "block"
      : "none";


  document
    .getElementById(
      "prevBtn"
    )
    .style.display =
      display;


  document
    .getElementById(
      "nextBtn"
    )
    .style.display =
      display;

}


function closeGallery(){

  document
    .getElementById(
      "galleryModal"
    )
    .style.display =
      "none";

}


function previousGallery(){

  if(
    gallerySnaps.length <= 1
  ){

    return;

  }


  galleryIndex--;


  if(
    galleryIndex < 0
  ){

    galleryIndex =
      gallerySnaps.length - 1;

  }


  updateGallery();

}


function nextGallery(){

  if(
    gallerySnaps.length <= 1
  ){

    return;

  }


  galleryIndex++;


  if(
    galleryIndex >=
    gallerySnaps.length
  ){

    galleryIndex = 0;

  }


  updateGallery();

}
