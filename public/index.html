<style>
:root{
 --green:#00ff66;--green2:#00c853;--bg:#030603;--panel:rgba(3,10,5,.96);
 --line:rgba(0,255,102,.45);--muted:#8aa895;--danger:#ff416c

*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#eafff0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,input,textarea{font:inherit}
button{cursor:pointer}
#map{position:absolute;inset:0;z-index:1}
#app:after{
 content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,255,102,.025) 0 1px,transparent 1px 4px)
}
.leaflet-control-zoom a,.leaflet-control-attribution{
 background:#071109!important;color:var(--green)!important;border-color:var(--line)!important
}
#topBar{
 position:absolute;z-index:1000;top:10px;left:10px;right:10px;display:flex;gap:6px;
 padding:7px;background:rgba(0,0,0,.86);border:1px solid var(--line);border-radius:12px;
 box-shadow:0 0 18px rgba(0,255,102,.18)
}
#searchInput{
 min-width:0;flex:1;background:#020602;color:var(--green);border:1px solid var(--line);

}

}
.btn:active{transform:scale(.97)}
.danger{border-color:var(--danger)!important;color:var(--danger)!important}
#status{
 display:none;position:absolute;z-index:6000;top:68px;left:50%;transform:translateX(-50%);
 max-width:92%;padding:9px 13px;border:1px solid var(--green);border-radius:20px;
 background:#020602;color:var(--green);font-size:12px;text-align:center;
 box-shadow:0 0 15px rgba(0,255,102,.3)
}
#locBtn{

 padding:12px 17px
}
.panel{
 display:none;position:absolute;z-index:4000;top:66px;right:10px;width:min(94vw,390px);
 max-height:75vh;overflow:auto;background:var(--panel);border:1px solid var(--green);

}
.panelTitle{color:var(--green);font-weight:900;margin-bottom:10px}
.panelRow{display:flex;gap:7px;margin:7px 0}.panelRow>*{min-width:0}
.field{

 border-radius:8px;padding:10px;outline:none

.readonly{color:var(--green)}
.small{font-size:11px;color:var(--muted)}
.notificationItem,.commentRow{

.modal{

#cameraVideo{width:100%;height:100%;object-fit:cover;background:#000}

#cameraTop,#galleryTop{

.round{

#galleryImage,#galleryVideo{max-width:100%;max-height:100%;object-fit:contain}
#galleryDetails{

.localWrap video{width:100%;height:100%;object-fit:cover}
.callControls{

.markerGhost{

@media(min-width:700px){.galleryArrow{display:block}}

<script>
"use strict";

/* =========================
   SUPABASE
========================= */
const SUPABASE_URL="https://zzxhymydsvwpjbyaslde.supabase.co";
const SUPABASE_KEY="sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* =========================
   SOCKET
========================= */
const socket=io({transports:["websocket","polling"]});

/* =========================
   STATE
========================= */
let currentUser=null;
let currentProfile=null;
let authMode="login";

let map=null;
let userLocationMarker=null;

let cameraStream=null;
let currentFacing="environment";
let mirrorEnabled=false;
let currentFilter="none";
let currentMode="photo";
let currentZoom=1;

let recorder=null;
let recordedChunks=[];
let recordingStartedAt=0;
let recordingTimer=null;

let capturedBlob=null;
let capturedImageData=null;
let capturedVideoUrl=null;
let capturedType=null;
let capturedLatitude=null;
let capturedLongitude=null;
let selectedQuality=480;
let isPostingSnap=false;

let galleryItems=[];
let galleryIndex=0;
let markerGroups=[];
let currentGallerySnap=null;

let myRoom=null;

let incomingCallerId=null;
let incomingCallerRoom=null;

let currentCallPeerId=null;
let peerConnection=null;
let localCallStream=null;
let remoteCallStream=null;
let callMuted=false;
let callCameraOff=false;

/* =========================
   HELPERS
========================= */
const $=id=>document.getElementById(id);

function showStatus(message,ms=2800){
 const e=$("status");
 e.textContent=message;
 e.style.display="block";
 clearTimeout(showStatus.timer);
 showStatus.timer=setTimeout(()=>e.style.display="none",ms);
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[m]));
}

function formatMB(bytes){
 return (bytes/1048576).toFixed(2)+" MB";
}

function formatDuration(seconds){
 seconds=Math.max(0,Math.floor(seconds));
 return String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");
}

function distanceMeters(a,b){
 const R=6371000;
 const p1=a.lat*Math.PI/180;
 const p2=b.lat*Math.PI/180;
 const dp=(b.lat-a.lat)*Math.PI/180;
 const dl=(b.lng-a.lng)*Math.PI/180;
 const x=Math.sin(dp/2)**2+
 Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function randomRoom(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let value="";
 for(let i=0;i<6;i++){
  value+=chars[Math.floor(Math.random()*chars.length)];
 }
 return value;
}

/* =========================
   MAP
========================= */
map=L.map("map",{
 zoomControl:true,
 attributionControl:true
}).setView([20.5937,78.9629],5);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
 {
  maxZoom:20,
  attribution:"© OpenStreetMap contributors"
 }
).addTo(map);

function makeGhostIcon(count){
 return L.divIcon({
  className:"",
  html:'<div class="markerGhost">👻<span>'+count+"</span></div>",
  iconSize:[42,42],
  iconAnchor:[21,21]
 });
}

function renderSnaps(rows){
 markerGroups.forEach(marker=>{
  try{map.removeLayer(marker)}catch(e){}
 });
 markerGroups=[];

 const groups=[];

 for(const row of rows||[]){
  let group=groups.find(g=>
   distanceMeters(
    {lat:g.latitude,lng:g.longitude},
    {lat:row.latitude,lng:row.longitude}
   )<=50
  );

  if(!group){
   group={
    latitude:Number(row.latitude),
    longitude:Number(row.longitude),
    items:[]
   };
   groups.push(group);
  }

  group.items.push(row);
 }

 groups.forEach(group=>{
  const marker=L.marker(
   [group.latitude,group.longitude],
   {icon:makeGhostIcon(group.items.length)}
  ).addTo(map);

  marker.on("click",()=>openGallery(group.items));
  markerGroups.push(marker);
 });
}

async function loadSnaps(){
 const {data,error}=await supabaseClient
  .from("snaps")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  console.error("snaps:",error);
  showStatus("Snaps load nahi hue.");
  return;
 }

 renderSnaps(data||[]);
}

/* Map click intentionally does NOTHING.
   Only My Location opens camera. */

/* =========================
   SEARCH
========================= */
async function searchPlace(){
 const query=$("searchInput").value.trim();
 if(!query)return;

 showStatus("Searching...");

 try{
  const response=await fetch(
   "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=en&q="+
   encodeURIComponent(query+", India")
  );

  const data=await response.json();

  if(!data.length){
   showStatus("Location nahi mili.");
   return;
  }

  map.setView([+data[0].lat,+data[0].lon],15);
  showStatus(data[0].display_name);
 }catch(error){
  console.error(error);
  showStatus("Search failed.");
 }
}

$("searchBtn").onclick=searchPlace;

$("searchInput").onkeydown=event=>{
 if(event.key==="Enter")searchPlace();
};

/* =========================
   LOCATION
========================= */
function getFreshPosition(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation){
   reject(new Error("Geolocation unavailable"));
   return;
  }

  navigator.geolocation.getCurrentPosition(
   resolve,
   reject,
   {
    enableHighAccuracy:true,
    timeout:15000,
    maximumAge:0
   }
  );
 }
}

async function getMyLocationAndCamera(){
 if(!currentUser){
  openAuth("login");
  return;
 }

 try{
  const position=await getFreshPosition();
  const lat=position.coords.latitude;
  const lng=position.coords.longitude;

  map.setView([lat,lng],17);

  if(userLocationMarker){
   map.removeLayer(userLocationMarker);
  }

  userLocationMarker=L.circleMarker(
   [lat,lng],
   {
    radius:8,
    color:"#00ff66",
    fillColor:"#00ff66",
    fillOpacity:.7
   }
  ).addTo(map);

  capturedLatitude=lat;
  capturedLongitude=lng;

  await openCamera();
 }catch(error){
  console.error(error);
  showStatus("Live location permission required hai.",3500);
 }
}

$("locBtn").onclick=getMyLocationAndCamera;

/* =========================
   CAMERA
========================= */
function filterCss(filter){
 return {
  none:"none",
  vintage:"sepia(.7) contrast(1.1)",
  bw:"grayscale(1)",
  warm:"sepia(.25) saturate(1.35)",
  cool:"saturate(.9) hue-rotate(15deg)",
  glow:"brightness(1.1) saturate(1.2)",
  night:"brightness(.65) contrast(1.25)"
 }[filter]||"none";
}

function updateCameraView(){
 $("cameraVideo").style.filter=filterCss(currentFilter);
 $("cameraVideo").classList.toggle("mirror",mirrorEnabled);
}

async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia){
  showStatus("Camera API unavailable.");
  return;
 }

 stopCameraStream();

 try{
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:{ideal:currentFacing},
    width:{ideal:1920},
    height:{ideal:1080}
   },

/* =========================
   PHOTO
========================= */
function drawCapture(){
 const video=$("cameraVideo");
 const canvas=$("cameraCanvas");

 const width=video.videoWidth;
 const height=video.videoHeight;

 canvas.width=width;
 canvas.height=height;

 const ctx=canvas.getContext("2d");

 ctx.save();
 ctx.filter=filterCss(currentFilter);

 if(mirrorEnabled){
  ctx.translate(width,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(video,0,0,width,height);
 ctx.restore();

 return canvas;
}

function dataURLToBlob(dataUrl){
 const parts=dataUrl.split(",");
 const mime=parts[0].match(/:(.*?);/)[1];
 const binary=atob(parts[1]);
 const bytes=new Uint8Array(binary.length);

 for(let i=0;i<binary.length;i++){
  bytes[i]=binary.charCodeAt(i);
 }

 return new Blob([bytes],{type:mime});
}

async function capturePhoto(){
 if(!cameraStream)return;

 if(!(await lockCaptureLocation()))return;

 const canvas=drawCapture();

 capturedImageData=canvas.toDataURL("image/jpeg",.9);
 capturedBlob=dataURLToBlob(capturedImageData);
 capturedType="image";
 capturedVideoUrl=null;

 $("previewImage").src=capturedImageData;
 $("previewImage").style.display="block";
 $("previewVideo").style.display="none";
 $("qualityBox").style.display="none";
 $("previewInfo").textContent="Photo • "+formatMB(capturedBlob.size);

 stopCameraStream();
 $("cameraModal").style.display="none";
 $("previewModal").style.display="flex";
}

/* =========================
   VIDEO
========================= */
function getVideoMime(){
 const types=[
  "video/webm;codecs=vp9",
  "video/webm;codecs=vp8",
  "video/webm"
 ];

 return types.find(type=>MediaRecorder.isTypeSupported(type))||"";
}

async function startRecording(){
 if(!cameraStream)return;

 if(!(await lockCaptureLocation()))return;

 const mime=getVideoMime();

 if(!mime){
  showStatus("Video recording supported nahi hai.");
  return;
 }

 recordedChunks=[];

 recorder=new MediaRecorder(
  cameraStream,
  {mimeType:mime}
 );

 recordingStartedAt=Date.now();

 recorder.ondataavailable=event=>{
  if(event.data?.size){
   recordedChunks.push(event.data);
  }
 };

 recorder.onstop=()=>{
  capturedBlob=new Blob(recordedChunks,{type:mime});
  capturedType="video";

  capturedVideoUrl=URL.createObjectURL(capturedBlob);

  $("previewImage").style.display="none";
  $("previewVideo").style.display="block";
  $("previewVideo").src=capturedVideoUrl;
  $("previewVideo").load();

  $("previewInfo").textContent=
   "Video • "+formatMB(capturedBlob.size);

  $("qualityBox").style.display="flex";

  stopCameraStream();
  $("cameraModal").style.display="none";
  updateRecordingUI(false);
 };

 recorder.start(250);
 updateRecordingUI(true);

 recordingTimer=setInterval(()=>{
  $("recordTimer").textContent=
   formatDuration((Date.now()-recordingStartedAt)/1000);
 },250);
}

function stopRecording(){
 if(recorder?.state==="recording"){
  recorder.stop();
 }

 clearInterval(recordingTimer);
 recordingTimer=null;
}

 $("captureBtn").classList.toggle("recording",recording);
 $("recordTimer").style.display=recording?"block":"none";
}

/* =========================
   STORAGE UPLOAD
========================= */
function setUploadProgress(percent,text){
 $("uploadBar").style.width=
  Math.max(0,Math.min(100,percent))+"%";

 $("uploadPercent").textContent=Math.round(percent)+"%";
 $("uploadText").textContent=text;
}

function xhrUpload(path,blob){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();

  xhr.open(
   "POST",
   SUPABASE_URL+
   "/storage/v1/object/past-snaps/"+
   encodeURIComponent(path)
  );

  xhr.setRequestHeader("apikey",SUPABASE_KEY);
  xhr.setRequestHeader("Authorization","Bearer "+SUPABASE_KEY);
  xhr.setRequestHeader(
   "Content-Type",
   blob.type||"application/octet-stream"
  );
  xhr.setRequestHeader("x-upsert","false");

  xhr.upload.onprogress=event=>{
   if(event.lengthComputable){
    setUploadProgress(
     event.loaded/event.total*100,
     "Uploading "+
     formatMB(event.loaded)+
     " / "+
     formatMB(event.total)
    );
   }
  };

  xhr.onload=()=>{
   if(xhr.status>=200&&xhr.status<300){
    resolve();
   }else{
    reject(new Error(xhr.responseText||"Upload failed"));
   }
  };

  xhr.onerror=()=>reject(new Error("Network error"));
  xhr.send(blob);
 });
}

/* =========================
   POST SNAP
========================= */
async function postSnap(){
 if(isPostingSnap||!capturedBlob)return;

 if(capturedLatitude===null){
  showStatus("Capture GPS missing.");
  return;
 }

 try{
  const position=await getFreshPosition();

  const freshDistance=distanceMeters(
   {
    lat:capturedLatitude,
    lng:capturedLongitude
   },
   {
    lat:position.coords.latitude,
    lng:position.coords.longitude
   }
  );

  if(freshDistance>50){
   showStatus("❌ Capture location se 50m se zyada door ho.");
   return;
  }

  isPostingSnap=true;
  $("postBtn").disabled=true;
  $("uploadBox").style.display="block";

  setUploadProgress(0,"Preparing upload...");

  const extension=capturedType==="video"?"webm":"jpg";

  const path=
   currentUser.id+
   "/snap_"+
   Date.now()+
   "_"+
   Math.random().toString(36).slice(2,8)+
   "."+
   extension;

  await xhrUpload(path,capturedBlob);

  setUploadProgress(100,"Saving snap...");

  const publicUrl=
   SUPABASE_URL+
   "/storage/v1/object/public/past-snaps/"+
   path;

  const {error}=await supabaseClient
   .from("snaps")
   .insert({
    latitude:capturedLatitude,
    longitude:capturedLongitude,
    image_url:publicUrl,
    created_at:new Date().toISOString(),
    media_type:capturedType,
    user_id:currentUser.id
   });

  if(error)throw error;

  $("uploadBox").style.display="none";
  $("previewModal").style.display="none";

  showStatus("✅ Snap posted");

  capturedBlob=null;
  capturedLatitude=null;
  capturedLongitude=null;

  if(capturedVideoUrl){
   URL.revokeObjectURL(capturedVideoUrl);
  }

  capturedVideoUrl=null;

  await loadSnaps();

 }catch(error){
  console.error("post:",error);

  $("uploadText").textContent="Upload failed";

  showStatus(
   "Upload failed. Supabase storage/table policy check karo.",
   4500
  );

  setTimeout(()=>{
   $("uploadBox").style.display="none";
  },1200);

 }finally{
  isPostingSnap=false;
  $("postBtn").disabled=false;
 }
}

$("postBtn").onclick=postSnap;

     user_id:currentUser.id

    .from("profiles")

async function loadComments(snapId){

   (data||[])

 ];

  await supabaseClient
   .from("profiles")
   .select("id,display_name")

  {data:[]};

  (profiles.data||[])
   .map(item=>[

   ])
 );

 function renderComment(comment,depth=0){

   .filter(child=>

  <div class="commentRow" style="margin-left:${Math.min(depth,4)*14}px">

    ${escapeHtml(names[comment.user_id]||"User")}
   </div>

    `<button class="btn replyBtn"
     data-id="${escapeHtml(comment.id)}"
     data-name="${escapeHtml(names[comment.user_id]||"User")}">
     ↩ Reply
    </button>`:""}
   ${children.map(child=>renderComment(child,depth+1)).join("")}
  </div>`;
 }

 $("commentsList").innerHTML=

   .filter(item=>!item.parent_comment_id)
   .map(item=>renderComment(item))

async function ensureRoom(user){
 if(!user)return null;

 const result=await supabaseClient
  .from("profiles")
  .select("call_room_id")
  .eq("id",user.id)
  .maybeSingle();

 let room=result.data?.call_room_id;

 if(!room){
  for(let attempt=0;attempt<5;attempt++){
   const candidate=randomRoom();

   const update=await supabaseClient
    .from("profiles")
    .update({call_room_id:candidate})
    .eq("id",user.id)
    .is("call_room_id",null);

   if(!update.error){
    room=candidate;
    break;
   }
  }
 }

 myRoom=room||null;

 if(myRoom){
  $("myCallId").value=myRoom;
  joinOwnCallRoom();
 }

 return myRoom;
}

  .eq("recipient_id",currentUser.id)
  .order("created_at",{ascending:false})
  .limit(30);

 if(error){
  console.error(error);
  return;
 }

 const list=$("notificationList");
 list.innerHTML="";

 (data||[]).forEach(notification=>{
  const item=document.createElement("div");

  item.className="notificationItem";
  item.textContent=
   notification.message||"New notification";

  item.onclick=async()=>{
   if(notification.snap_id){
    const snap=await supabaseClient
     .from("snaps")
     .select("*")
     .eq("id",notification.snap_id)
     .maybeSingle();

    if(snap.data){
     openGallery([snap.data]);
    }
   }

   if(notification.id){
    await supabaseClient
     .from("notifications")
     .update({is_read:true})
     .eq("id",notification.id);
   }
  };

  list.appendChild(item);
 });

 const unread=(data||[])
  .filter(item=>!item.is_read).length;

 $("notificationCount").textContent=
  unread?" "+Math.min(unread,99):"";
}

$("notificationBtn").onclick=()=>{
 $("notificationPanel").style.display=
  $("notificationPanel").style.display==="block"?
  "none":"block";
};

/* =========================
   CALL SOCKET EVENTS
========================= */
socket.on("connect",()=>{
 if(currentUser){
  joinOwnCallRoom();
 }
});

socket.on("room-full",()=>{
 showStatus("Call room full hai.");
});

socket.on("call-ringing",data=>{
 showStatus(
  "📞 Calling "+(data?.roomId||"")+"...",
  4000
 );
});

socket.on("call-unavailable",data=>{
 showStatus(
  "Room "+(data?.roomId||"")+" online nahi hai.",
  4000
 );
});

socket.on("incoming-call",data=>{
 incomingCallerId=data?.callerId;
 incomingCallerRoom=data?.callerRoom||"";

 $("callerText").textContent=
  "📞 Room "+
  (incomingCallerRoom||"")+" is calling you";

 $("callOverlay").style.display="flex";
});

$("acceptCallBtn").onclick=async()=>{
 if(!incomingCallerId)return;

 const callerId=incomingCallerId;

 $("callOverlay").style.display="none";

 socket.emit(
  "accept-call",
  {callerId}
 );

 await openActiveCall(true,callerId);

 incomingCallerId=null;
};

$("rejectCallBtn").onclick=()=>{
 if(incomingCallerId){
  socket.emit(
   "reject-call",
   {callerId:incomingCallerId}
  );
 }

 $("callOverlay").style.display="none";
 incomingCallerId=null;
};

socket.on("call-accepted",async data=>{
 if(data?.accepterId){
  await openActiveCall(false,data.accepterId);
 }
});

socket.on("call-rejected",()=>{
 showStatus("Call rejected.");
 cleanupCall();
});

socket.on("call-ended",()=>{
 showStatus("Call ended.");
 cleanupCall();
});

/* =========================
   WEBRTC
========================= */
async function openActiveCall(receiver,peerId){
 try{
  currentCallPeerId=peerId;

  localCallStream=
   await navigator.mediaDevices.getUserMedia({
    video:true,
    audio:true
   });

  $("localVideo").srcObject=localCallStream;

  remoteCallStream=new MediaStream();
  $("remoteVideo").srcObject=remoteCallStream;

  $("activeCall").style.display="block";
  $("callStatus").textContent="Connecting...";

  peerConnection=new RTCPeerConnection({
   iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:stun1.l.google.com:19302"}
   ]
  });

  localCallStream
   .getTracks()
   .forEach(track=>{
    peerConnection.addTrack(
     track,
     localCallStream
    );
   });

  peerConnection.ontrack=event=>{
   if(event.streams?.[0]){
    event.streams[0]
     .getTracks()
     .forEach(track=>{
      if(
       !remoteCallStream
        .getTracks()
        .some(existing=>existing.id===track.id)
      ){
       remoteCallStream.addTrack(track);
      }
     });
   }

   $("callStatus").textContent="Connected";
  };

  peerConnection.onicecandidate=event=>{
   if(event.candidate){
    socket.emit(
     "webrtc-signal",
     {
      targetId:peerId,
      signal:{
       type:"ice-candidate",
       candidate:event.candidate
      }
     }
    );
   }
  };

  peerConnection.onconnectionstatechange=()=>{
   if(
    ["failed","disconnected","closed"]
    .includes(peerConnection?.connectionState)
   ){
    cleanupCall();
   }
  };

  if(!receiver){
   const offer=
    await peerConnection.createOffer();

   await peerConnection.setLocalDescription(offer);

   socket.emit(
    "webrtc-signal",
    {
     targetId:peerId,
     signal:{
      type:"offer",
      sdp:offer
     }
    }
   );
  }

 }catch(error){
  console.error(error);
  showStatus(
   "Call camera/mic permission required.",
   4000
  );
  cleanupCall();
 }
}

socket.on("webrtc-signal",async data=>{
 try{
  const signal=data?.signal;
  const senderId=data?.senderId;

  if(!signal||!senderId)return;

  if(!peerConnection){
   await openActiveCall(true,senderId);
  }

  if(signal.type==="offer"){
   await peerConnection.setRemoteDescription(
    new RTCSessionDescription(signal.sdp)
   );

   const answer=
    await peerConnection.createAnswer();

   await peerConnection.setLocalDescription(answer);

   socket.emit(
    "webrtc-signal",
    {
     targetId:senderId,
     signal:{
      type:"answer",
      sdp:answer
     }
    }
   );

  }else if(signal.type==="answer"){
   await peerConnection.setRemoteDescription(
    new RTCSessionDescription(signal.sdp)
   );

  }else if(
   signal.type==="ice-candidate"&&
   signal.candidate
  ){
   await peerConnection.addIceCandidate(
    new RTCIceCandidate(signal.candidate)
   );
  }

 }catch(error){
  console.error("WebRTC signal:",error);
 }
});

$("muteCallBtn").onclick=()=>{
 const track=
  localCallStream?.getAudioTracks?.()[0];

 if(!track)return;

 track.enabled=!track.enabled;
 callMuted=!track.enabled;

 $("muteCallBtn").textContent=
  callMuted?"🔇":"🎙️";
};

$("cameraCallBtn").onclick=()=>{
 const track=
  localCallStream?.getVideoTracks?.()[0];

 if(!track)return;

 track.enabled=!track.enabled;
 callCameraOff=!track.enabled;

 $("cameraCallBtn").textContent=
  callCameraOff?"🚫":"📹";
};

$("endCallBtn").onclick=()=>{
 if(currentCallPeerId){
  socket.emit(
   "end-call",
   {targetId:currentCallPeerId}
  );
 }

 cleanupCall();
};

function cleanupCall(){
 try{
  peerConnection?.close();
 }catch(error){}

 peerConnection=null;

 localCallStream
  ?.getTracks()
  .forEach(track=>track.stop());

 localCallStream=null;
 remoteCallStream=null;

 $("localVideo").srcObject=null;
 $("remoteVideo").srcObject=null;

 $("activeCall").style.display="none";
 $("callOverlay").style.display="none";

 currentCallPeerId=null;
 incomingCallerId=null;
 incomingCallerRoom=null;

 callMuted=false;
 callCameraOff=false;

 $("muteCallBtn").textContent="🎙️";
 $("cameraCallBtn").textContent="📹";
}

  $("previewModal").style.display="none";

 if($("galleryModal").style.display==="flex"){
  $("galleryModal").style.display="none";
 }

 cleanupCall();
});
