<html lang="en">

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
}

#app{
  width:100%;
  height:100%;

}


/* =========================
   SEARCH
========================= */

#topbar{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;

  display:flex;
  gap:8px;

  padding:8px;

}

#searchInput{

}

#searchBtn{

  padding:0 13px;

  border:0;

  background:#111;

}


/* =========================

========================= */

#map{

  z-index:1;

}


/* =========================
   LOCATION
========================= */

#locationBtn{

  border:none;

/* =========================

.snap-marker{

.leaflet-control-attribution{
  font-size:9px;

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

let supabaseClient = null;


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map = null;

let cameraStream = null;

let currentFacingMode = "user";

let currentFilter = "none";

let currentLocation = null;

let allSnaps = [];

let snapGroups = [];

let gallerySnaps = [];

let galleryIndex = 0;

let searchMarker = null;

let mirrorEnabled = false;


/*
 * Prevent duplicate upload.
 */
let isPostingSnap = false;


/*
 * Stores captured image.
 */
let capturedImageData = null;


/*
 * Back button state.
 */
let cameraHistoryActive = false;


/*
 * Current location marker.
 */
let userLocationMarker = null;


/* =====================================================
   SUPABASE INIT
===================================================== */

function initSupabase(){

  if(supabaseClient){
    return supabaseClient;
  }

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      throw new Error(
        "Supabase library not loaded"
      );

    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return supabaseClient;

  }catch(error){

    console.error(error);

    showStatus(
      "Supabase load nahi hua."
    );

    return null;

  }

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(message){

  const el =
    document.getElementById("status");

  el.textContent = message;

  el.style.display = "block";

  clearTimeout(showStatus.timer);

  showStatus.timer =
    setTimeout(
      function(){

        el.style.display = "none";

      },
      3500
    );

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  map =
    L.map("map", {
      zoomControl:true
    }).setView(
      [20.5937,78.9629],
      5
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap contributors"
    }
  ).addTo(map);


  let moveTimer = null;


  map.on(
    "moveend",
    function(){

      clearTimeout(moveTimer);

      moveTimer =
        setTimeout(
          function(){

            loadSnapsForVisibleArea();

          },
          250
        );

    }
  );

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const dLat =
    (lat2-lat1) *
    Math.PI /
    180;

  const dLon =
    (lon2-lon1) *
    Math.PI /
    180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* =====================================================
   GROUP SNAPS
===================================================== */

function makeGroups(snaps){

  const groups = [];

  const GROUP_DISTANCE = 30;


  snaps.forEach(
    function(snap){

      let found = null;


      for(
        let i=0;
        i<groups.length;
        i++
      ){

        const group = groups[i];


        const distance =
          distanceMeters(
            Number(snap.latitude),
            Number(snap.longitude),
            group.latitude,
            group.longitude
          );


        if(
          distance <= GROUP_DISTANCE
        ){

          found = group;

          break;

        }

      }


      if(!found){

        groups.push({

          latitude:
            Number(snap.latitude),

          longitude:
            Number(snap.longitude),

          snaps:[
            snap
          ]

        });

      }else{

        found.snaps.push(snap);


        let latSum = 0;

        let lonSum = 0;


        found.snaps.forEach(
          function(item){

            latSum +=
              Number(item.latitude);

            lonSum +=
              Number(item.longitude);

          }
        );


        found.latitude =
          latSum /
          found.snaps.length;

        found.longitude =
          lonSum /
          found.snaps.length;

      }

    }
  );


  return groups;

}


/* =====================================================
   CLEAR SNAP MARKERS
===================================================== */

function clearSnapMarkers(){

  if(!map){
    return;
  }


  map.eachLayer(
    function(layer){

      if(
        layer.options &&
        layer.options.isSnapMarker
      ){

        map.removeLayer(layer);

      }

    }
  );

}


/* =====================================================
   DRAW SNAP MARKERS
===================================================== */

function drawSnapMarkers(){

  if(!map){
    return;
  }


  clearSnapMarkers();


  snapGroups =
    makeGroups(allSnaps);


  snapGroups.forEach(
    function(group){

      const count =
        group.snaps.length;


      let html =
        '<div class="snap-marker">👻';


      if(count > 1){

        html +=
          '<span class="snap-count">' +
          count +
          "</span>";

      }


      html += "</div>";


      const icon =
        L.divIcon({

          html:html,

          className:"",

          iconSize:[
            count > 1 ? 65 : 40,
            40
          ],

          iconAnchor:[
            count > 1 ? 32 : 20,
            20
          ]

        });


      const marker =
        L.marker(
          [
            group.latitude,
            group.longitude
          ],
          {
            icon:icon,
            isSnapMarker:true
          }
        )
        .addTo(map);


      marker.on(
        "click",
        function(){

          openGallery(group.snaps);

        }
      );

    }
  );

}


/* =====================================================
   LOAD SNAPS
===================================================== */

async function loadSnapsForVisibleArea(){

  const client =
    initSupabase();


  if(
    !client ||
    !map
  ){

    return;

  }


  const bounds =
    map.getBounds();


  const north =
    bounds.getNorth();

  const south =
    bounds.getSouth();

  const east =
    bounds.getEast();

  const west =
    bounds.getWest();


  try{

    const result =
      await client
        .from("snaps")
        .select(
          "id,latitude,longitude,image_url,created_at"
        )
        .gte(
          "latitude",
          south
        )
        .lte(
          "latitude",
          north
        )
        .gte(
          "longitude",
          west
        )
        .lte(
          "longitude",
          east
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(1000);


    if(result.error){
      throw result.error;
    }


    allSnaps =
      Array.isArray(result.data)
        ? result.data
        : [];


    drawSnapMarkers();


  }catch(error){

    console.error(
      "VISIBLE SNAP LOAD ERROR:",
      error
    );

  }

}


/* =====================================================
   GET USER LOCATION
===================================================== */

function getUserLocation(){

  if(
    !navigator.geolocation
  ){

    showStatus(
      "Location supported nahi hai."
    );

    return;

  }


  showStatus(
    "📍 Location detect ho rahi hai..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      currentLocation = {

        latitude:lat,

        longitude:lng

      };


      map.setView(
        [lat,lng],
        17
      );


      if(userLocationMarker){

        map.removeLayer(
          userLocationMarker
        );

      }


      userLocationMarker =
        L.circleMarker(
          [lat,lng],
          {
            radius:8
          }
        )
        .addTo(map)
        .bindPopup(
          "📍 You are here"
        );


      showStatus(
        "📍 Location mil gayi."
      );


      openCamera();

    },


    function(error){

      console.error(error);

      showStatus(
        "Location permission allow karo."
      );

    },


    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =====================================================
   MIRROR PREVIEW
===================================================== */

function updateMirrorPreview(){

  const video =
    document.getElementById(
      "cameraVideo"
    );


  const button =
    document.getElementById(
      "mirrorBtn"
    );


  if(mirrorEnabled){

    video.classList.add(
      "mirror-preview"
    );

    button.classList.add(
      "active"
    );

    button.textContent =
      "🪞 Mirror ON";

  }else{

    video.classList.remove(
      "mirror-preview"
    );

    button.classList.remove(
      "active"
    );

    button.textContent =
      "🪞 Mirror";

  }

}


/* =====================================================
   MIRROR BUTTON
===================================================== */

document
  .getElementById("mirrorBtn")
  .addEventListener(
    "click",
    function(){

      mirrorEnabled =
        !mirrorEnabled;

      updateMirrorPreview();

    }
  );


/* =====================================================
   CAMERA HISTORY
===================================================== */

function addCameraHistory(){

  if(cameraHistoryActive){
    return;
  }

  cameraHistoryActive = true;

  history.pushState(
    {
      pastSnapCamera:true
    },
    "",
    window.location.href
  );

}


/* =====================================================
   REMOVE CAMERA HISTORY
===================================================== */

function removeCameraHistory(){

  if(!cameraHistoryActive){
    return;
  }

  cameraHistoryActive = false;

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera(){

  const modal =
    document.getElementById(
      "cameraModal"
    );


  if(
    modal.style.display === "none" ||
    modal.style.display === ""
  ){

    return;

  }


  modal.style.display =
    "none";


  stopCameraStream();


  /*
   * If close button was used,
   * remove the extra history entry
   * without leaving the website.
   */
  if(cameraHistoryActive){

    cameraHistoryActive = false;

    if(
      history.state &&
      history.state.pastSnapCamera
    ){

      history.back();

    }

  }

}


/* =====================================================
   STOP CAMERA STREAM
===================================================== */

function stopCameraStream(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    cameraStream = null;

  }


  const video =
    document.getElementById(
      "cameraVideo"
    );


  if(video){

    video.srcObject = null;

  }

}


/* =====================================================
   OPEN CAMERA
===================================================== */

async function openCamera(){

  const modal =
    document.getElementById(
      "cameraModal"
    );

  const video =
    document.getElementById(
      "cameraVideo"
    );


  try{

    stopCameraStream();


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Camera API unavailable"
      );

    }


    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:
              currentFacingMode,

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    video.srcObject =
      cameraStream;


    modal.style.display =
      "flex";


    updateMirrorPreview();


    addCameraHistory();


  }catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );

    showStatus(
      "Camera permission allow karo."
    );

  }

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

async function switchCamera(){

  if(!cameraStream){

  currentFacingMode =
    currentFacingMode === "user"

      : "user";


  try{

    await openCamera();

  }catch(error){

  }

}


/* =====================================================
   FILTER CSS
===================================================== */

function filterToCss(filter){

  switch(filter){

    case "vintage":
      return "sepia(.7) contrast(1.1) saturate(.8)";

    case "bw":
      return "grayscale(1)";

    case "warm":
      return "sepia(.25) saturate(1.35)";

    case "cool":
      return "saturate(.9) hue-rotate(15deg)";

    case "glow":
      return "brightness(1.1) saturate(1.2)";

    case "night":
      return "brightness(.65) contrast(1.25) saturate(1.2)";

    case "pop":
      return "saturate(1.8) contrast(1.15)";

    case "dream":
      return "brightness(1.08) contrast(.9) saturate(1.2)";

    case "sunset":
      return "sepia(.25) saturate(1.5) hue-rotate(-10deg)";

    case "none":
    default:
      return "none";

  }

}

/* =====================================================
   CAPTURE PHOTO
===================================================== */

function capturePhoto(){

  const video =
    document.getElementById(
      "cameraVideo"
    );


  if(
    !cameraStream ||
    !video.videoWidth
  ){

    showStatus(
      "Camera ready nahi hai."
    );

    return;

  }


  const canvas =
    document.getElementById(
      "cameraCanvas"
    );


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.filter =
    filterToCss(
      currentFilter
    );


  if(mirrorEnabled){

    ctx.save();

    ctx.translate(
      width,
      0
    );

    ctx.scale(
      -1,
      1
    );

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

    ctx.restore();

  }else{

    ctx.setTransform(
      1,
      0,
      0,
      1,
      0,
      0
    );

    ctx.drawImage(
      video,
      0,
      0,
      width,
      height
    );

  }


  capturedImageData =
    canvas.toDataURL(
      "image/jpeg",
      .88
    );


  const previewImage =
    document.getElementById(
      "previewImage"
    );


  previewImage.style.transform =
    "none";

  previewImage.style.filter =
    "none";

  previewImage.src =
    capturedImageData;


  document.getElementById(
    "cameraModal"
  ).style.display =
    "none";


  stopCameraStream();


  /*
   * Camera history remains active.
   * We replace the current history state
   * so Android Back can close preview
   * instead of leaving the website.
   */

  history.replaceState(
    {
      pastSnapPreview:true
    },
    "",
    window.location.href
  );


  document.getElementById(
    "previewModal"
  ).style.display =
    "flex";

}

/* =====================================================

function setUploadProgress(
  percent,
  textMessage
){

  const bar =
    document.getElementById(
      "uploadBar"
    );

  const percentText =
    document.getElementById(
      "uploadPercent"
    );

  const uploadText =
    document.getElementById(
      "uploadText"
    );


  const safePercent =
    Math.max(
      0,
      Math.min(
        100,
        Math.round(percent)
      )
    );

    safePercent + "%";

  }

}

/* =====================================================
   XHR STORAGE UPLOAD
===================================================== */

function uploadImageWithProgress(
  filePath,
  blob
){

  return new Promise(
    function(resolve,reject){

      const xhr =
        new XMLHttpRequest();


      const uploadUrl =
        SUPABASE_URL +
        "/storage/v1/object/past-snaps/" +
        encodeURIComponent(
          filePath
        );


      xhr.open(
        "POST",
        uploadUrl,
        true
      );


      xhr.setRequestHeader(
        "apikey",
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "Authorization",
        "Bearer " +
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "Content-Type",
        "image/jpeg"
      );


      xhr.setRequestHeader(
        "x-upsert",
        "false"
      );


      xhr.upload.onprogress =
        function(event){

          if(event.lengthComputable){

            const percent =
              (event.loaded /
               event.total) *
              100;


            setUploadProgress(
              percent,
              "📤 Photo upload ho rahi hai..."
            );

          }

        };


      xhr.onload =
        function(){

          if(
            xhr.status >= 200 &&
            xhr.status < 300
          ){

            setUploadProgress(
              100,
              "✅ Photo upload complete"
            );

            resolve(
              xhr.responseText
            );

          }else{

            let message =
              "Storage upload failed";

            try{

              const data =
                JSON.parse(
                  xhr.responseText
                );

              if(data.message){
                message =
                  data.message;
              }

            }catch(e){}


            reject(
              new Error(
                message +
                " (" +
                xhr.status +
                ")"
              )
            );

          }

        };


      xhr.onerror =
        function(){

          reject(
            new Error(
              "Network error during upload"
            )
          );

        };


      xhr.onabort =
        function(){

          reject(
            new Error(
              "Upload cancelled"
            )
          );

        };


      xhr.send(blob);

    }
  );

}


/* =====================================================
   POST SNAP
===================================================== */

async function postSnap(){

  /*
   * MAIN DUPLICATE PROTECTION
   */
  if(isPostingSnap){

    return;

  }


  if(!currentLocation){

    showStatus(
      "Location available nahi hai."
    );

    return;

  }


  if(!capturedImageData){

    showStatus(
      "Photo capture nahi hui."
    );

    return;

  }


  const client =
    initSupabase();


  if(!client){

    return;

  }


  const postButton =
    document.getElementById(
      "postBtn"
    );


  /*
   * Lock immediately.
   */
  isPostingSnap = true;

  postButton.disabled = true;

  postButton.textContent =
    "Uploading...";


  showUploadOverlay();


  try{

    setUploadProgress(
      5,
      "Photo prepare ho rahi hai..."
    );


    /*
     * Convert data URL to Blob.
     */
    const response =
      await fetch(
        capturedImageData
      );


    const blob =
      await response.blob();


    if(!blob || !blob.size){

      throw new Error(
        "Image blob empty hai."
      );

    }


    setUploadProgress(
      10,
      "📤 Upload start ho raha hai..."
    );


    /*
     * Unique file name.
     *
     * Random name ensures
     * same photo path overwrite
     * nahi karega.
     */
    const fileName =
      "snap_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2,10) +
      ".jpg";


    /*
     * Upload directly with XHR
     * so real progress percentage
     * mil sake.
     */
    await uploadImageWithProgress(
      fileName,
      blob
    );


    const publicUrl =
      SUPABASE_URL +
      "/storage/v1/object/public/past-snaps/" +
      fileName;


    setUploadProgress(
      100,
      "📍 Snap save ho raha hai..."
    );


    /*
     * Insert database row
     */
    const insertResult =
      await client
        .from("snaps")
        .insert({

          latitude:
            Number(
              currentLocation.latitude
            ),

          longitude:
            Number(
              currentLocation.longitude
            ),

          image_url:
            publicUrl

        });


    if(insertResult.error){

      /*
       * Database insert failed after
       * storage upload.
       *
       * We report the error instead
       * of pretending it succeeded.
       */
      throw insertResult.error;

    }


    setUploadProgress(
      100,
      "🎉 Snap successfully posted!"
    );


    await new Promise(
      function(resolve){

        setTimeout(
          resolve,
          600
        );

      }
    );


    hideUploadOverlay();


    document.getElementById(
      "previewModal"
    ).style.display =
      "none";


    capturedImageData =
      null;


    /*
     * Refresh nearby snaps.
     */
    await loadSnapsForVisibleArea();


    showStatus(
      "📍 Snap successfully posted!"
    );


  }catch(error){

    console.error(
      "POST SNAP ERROR:",
      error
    );


    hideUploadOverlay();


    showStatus(
      "Snap upload nahi hua. Dobara try karo."
    );


  }finally{

    /*
     * Unlock only AFTER complete
     * success/failure.
     */
    isPostingSnap = false;

    postButton.disabled = false;

    postButton.textContent =
      "📍 Post Snap";

  }

}


/* =====================================================
   SEARCH LOCATION
===================================================== */

async function searchLocation(){

  const input =
    document.getElementById(
      "searchInput"
    );


  const query =
    input.value.trim();


  if(!query){

    showStatus(
      "Location search karo."
    );

    return;

  }


  showStatus(
    "🔍 Location search ho rahi hai..."
  );


  try{

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=1" +
      "&q=" +
      encodeURIComponent(query);


    const response =
      await fetch(url);


    const data =
      await response.json();


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      showStatus(
        "Location nahi mili."
      );

      return;

    }


    const result =
      data[0];


    const lat =
      Number(result.lat);

    const lon =
      Number(result.lon);


    map.setView(
      [lat,lon],
      16
    );


    if(searchMarker){

      map.removeLayer(
        searchMarker
      );

    }


    searchMarker =
      L.marker(
        [lat,lon]
      )
      .addTo(map)
      .bindPopup(
        result.display_name
      )
      .openPopup();


    showStatus(
      "📍 Location mil gayi."
    );


  }catch(error){

    console.error(
      "SEARCH ERROR:",
      error
    );

    showStatus(
      "Search mein problem hui."
    );

  }

}


/* =====================================================
   GALLERY
===================================================== */

function openGallery(snaps){

  if(
    !Array.isArray(snaps) ||
    !snaps.length
  ){

    return;

  }


  gallerySnaps =
    snaps;

  galleryIndex =
    0;


  updateGallery();


  document.getElementById(
    "galleryModal"
  ).style.display =
    "flex";

}


/* =====================================================
   UPDATE GALLERY
===================================================== */

function updateGallery(){

  if(!gallerySnaps.length){
    return;
  }


  const snap =
    gallerySnaps[
      galleryIndex
    ];


  document.getElementById(
    "galleryImage"
  ).src =
    snap.image_url;


  document.getElementById(
    "galleryCounter"
  ).textContent =
    (
      galleryIndex + 1
    ) +
    " / " +
    gallerySnaps.length;

}


/* =====================================================
   CLOSE GALLERY
===================================================== */

function closeGallery(){

  document.getElementById(
    "galleryModal"
  ).style.display =
    "none";

}


/* =====================================================
   PREVIOUS IMAGE
===================================================== */

function previousGallery(){

  if(!gallerySnaps.length){
    return;
  }


  galleryIndex =
    (
      galleryIndex -
      1 +
      gallerySnaps.length
    ) %
    gallerySnaps.length;


  updateGallery();

}


/* =====================================================
   NEXT IMAGE
===================================================== */

function nextGallery(){

  if(!gallerySnaps.length){
    return;
  }


  galleryIndex =
    (
      galleryIndex +
      1
    ) %
    gallerySnaps.length;


  updateGallery();

}

/* =====================================================
   SWIPE GALLERY
===================================================== */

let galleryTouchStartX = 0;

let galleryTouchEndX = 0;


const galleryImageBox =
  document.getElementById(
    "galleryImageBox"
  );


galleryImageBox.addEventListener(
  "touchstart",
  function(event){

    if(
      event.touches &&
      event.touches.length
    ){

      galleryTouchStartX =
        event.touches[0].clientX;

    }

  },
  {
    passive:true
  }
);


galleryImageBox.addEventListener(
  "touchend",
  function(event){

    if(
      event.changedTouches &&
      event.changedTouches.length
    ){

      galleryTouchEndX =
        event.changedTouches[0].clientX;

    }


    const difference =
      galleryTouchEndX -
      galleryTouchStartX;


    if(
      Math.abs(difference) < 50
    ){

      return;

    }


    if(difference > 0){

      previousGallery();

    }else{

      nextGallery();

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Escape"
    ){

      return;

    }


    const gallery =
      document.getElementById(
        "galleryModal"
      );

    const preview =
      document.getElementById(
        "previewModal"
      );

    const camera =
      document.getElementById(
        "cameraModal"
      );


    if(
      gallery.style.display === "flex"
    ){

      closeGallery();

      return;

    }


    if(
      preview.style.display === "flex" &&
      !isPostingSnap
    ){

      preview.style.display =
        "none";

      capturedImageData =
        null;

      return;

    }


    if(
      camera.style.display === "flex"
    ){

      closeCamera();

    }

  }
);
