<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;

/* =====================================================
   TOP SEARCH
===================================================== */

}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

let supabaseClient = null;


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let map = null;

let cameraStream = null;

let currentFacingMode =
  "user";

let currentFilter =
  "none";

let currentLocation =
  null;

let allSnaps =
  [];

let snapGroups =
  [];

let gallerySnaps =
  [];

let galleryIndex =
  0;

let searchMarker =
  null;


/* =====================================================
   SUPABASE INIT
===================================================== */

function initSupabase(){

  if(supabaseClient){
    return supabaseClient;
  }

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      throw new Error(
        "Supabase library not loaded"
      );

    }

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return supabaseClient;

  }catch(error){

    console.error(error);

    showStatus(
      "Supabase load nahi hua."
    );

    return null;

  }

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(message){

  const el =
    document.getElementById(
      "status"
    );

  el.textContent =
    message;

  el.style.display =
    "block";

  clearTimeout(
    showStatus.timer
  );

  showStatus.timer =
    setTimeout(
      function(){

        el.style.display =
          "none";

      },
      3500
    );

}


/* =====================================================
   MAP
===================================================== */

function initMap(){

  map =
    L.map(
      "map",
      {
        zoomControl:true
      }
    ).setView(
      [20.5937,78.9629],
      5
    );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:20,

      attribution:
        "&copy; OpenStreetMap contributors"

    }
  ).addTo(map);


  let moveTimer =
    null;


  map.on(
    "moveend",
    function(){

      clearTimeout(
        moveTimer
      );

      moveTimer =
        setTimeout(
          function(){

            loadSnapsForVisibleArea();

          },
          250
        );

    }
  );

}


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;

  const dLat =
    (lat2-lat1) *
    Math.PI /
    180;

  const dLon =
    (lon2-lon1) *
    Math.PI /
    180;

  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(
      lat1 *
      Math.PI /
      180
    ) *

    Math.cos(
      lat2 *
      Math.PI /
      180
    ) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* =====================================================
   GROUP SNAPS
===================================================== */

function makeGroups(snaps){

  const groups = [];

  const GROUP_DISTANCE =
    30;


  snaps.forEach(
    function(snap){

      let found =
        null;


      for(
        let i=0;
        i<groups.length;
        i++
      ){

        const group =
          groups[i];


        const distance =
          distanceMeters(
            Number(
              snap.latitude
            ),

            Number(
              snap.longitude
            ),

            group.latitude,

            group.longitude
          );


        if(
          distance <=
          GROUP_DISTANCE
        ){

          found =
            group;

          break;

        }

      }


      if(!found){

        groups.push({

          latitude:
            Number(
              snap.latitude
            ),

          longitude:
            Number(
              snap.longitude
            ),

          snaps:[
            snap
          ]

        });

      }else{

        found.snaps.push(
          snap
        );


        let latSum =
          0;

        let lonSum =
          0;


        found.snaps.forEach(
          function(item){

            latSum +=
              Number(
                item.latitude
              );

            lonSum +=
              Number(
                item.longitude
              );

          }
        );


        found.latitude =
          latSum /
          found.snaps.length;

        found.longitude =
          lonSum /
          found.snaps.length;

      }

    }
  );


  return groups;

}


/* =====================================================
   CLEAR SNAP MARKERS
===================================================== */

function clearSnapMarkers(){

  if(!map){
    return;
  }


  map.eachLayer(
    function(layer){

      if(
        layer.options &&
        layer.options.isSnapMarker
      ){

        map.removeLayer(
          layer
        );

      }

    }
  );

}


/* =====================================================
   DRAW SNAP MARKERS
===================================================== */

function drawSnapMarkers(){

  if(!map){
    return;
  }


  clearSnapMarkers();


  snapGroups =
    makeGroups(
      allSnaps
    );


  snapGroups.forEach(
    function(group){

      const count =
        group.snaps.length;


      let html =
        '<div class="snap-marker">👻';


      if(count > 1){

        html +=
          '<span class="snap-count">' +
          count +
          "</span>";

      }


      html +=
        "</div>";


      const icon =
        L.divIcon({

          html:
            html,

          className:
            "",

          iconSize:[
            count > 1
              ? 65
              : 40,

            40
          ],

          iconAnchor:[
            count > 1
              ? 32
              : 20,

            20
          ]

        });


      const marker =
        L.marker(
          [
            group.latitude,
            group.longitude
          ],
          {
            icon:icon,

            isSnapMarker:true
          }
        )
        .addTo(map);


      marker.on(
        "click",
        function(){

          openGallery(
            group.snaps
          );

        }
      );

    }
  );

}


/* =====================================================
   LOAD SNAPS
===================================================== */

async function loadSnapsForVisibleArea(){

  const client =
    initSupabase();


  if(
    !client ||
    !map
  ){

    return;

  }


  const bounds =
    map.getBounds();


  const north =
    bounds.getNorth();

  const south =
    bounds.getSouth();

  const east =
    bounds.getEast();

  const west =
    bounds.getWest();


  try{

    const result =
      await client
        .from("snaps")
        .select(
          "id,latitude,longitude,image_url,created_at"
        )
        .gte(
          "latitude",
          south
        )
        .lte(
          "latitude",
          north
        )
        .gte(
          "longitude",
          west
        )
        .lte(
          "longitude",
          east
        )
        .order(
          "created_at",
          {
            ascending:false
          }
        )
        .limit(1000);


    if(result.error){

      throw result.error;

    }


    allSnaps =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    drawSnapMarkers();


  }catch(error){

    console.error(
      "VISIBLE SNAP LOAD ERROR:",
      error
    );

  }

}


/* =====================================================
   LOCATION
===================================================== */

function getUserLocation(){

  if(
    !navigator.geolocation
  ){

    showStatus(
      "Location supported nahi hai."
    );

    return;

  }


  showStatus(
    "📍 Location detect ho rahi hai..."
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      currentLocation = {

        latitude:
          lat,

        longitude:
          lng

      };


      map.setView(
        [
          lat,
          lng
        ],
        17
      );


      L.circleMarker(
        [
          lat,
          lng
        ],
        {
          radius:8
        }
      )
      .addTo(map)
      .bindPopup(
        "📍 You are here"
      )
      .openPopup();


      showStatus(
        "📍 Location mil gayi."
      );


      /*
       * Location ke baad
       * camera open.
       */

      openCamera();

    },


    function(error){

      console.error(
        error
      );


      showStatus(
        "Location permission allow karo."
      );

    },


    {
      enableHighAccuracy:true,

      timeout:15000,

      maximumAge:0

    }

  );

}


/* =====================================================
   CAMERA OPEN
===================================================== */

async function openCamera(){

  const modal =
    document.getElementById(
      "cameraModal"
    );

  const video =
    document.getElementById(
      "cameraVideo"
    );


  try{

    /*
     * Previous camera stop.
     */

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          function(track){

            track.stop();

          }
        );

      cameraStream =
        null;

    }


    /*
     * Camera open.
     */

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            /*
             * Exact current camera.
             */

            facingMode:
              currentFacingMode,

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            }

          },

          audio:false

        });


    video.srcObject =
      cameraStream;


    /*
     * IMPORTANT:
     *
     * Yaha koi scaleX(-1)
     * nahi hai.
     *
     * Isliye left = left
     * right = right.
     */


    await new Promise(
      function(resolve){

        if(
          video.readyState >= 2
        ){

          resolve();

        }else{

          video.onloadedmetadata =
            function(){

              resolve();

            };

        }

      }
    );


    await video.play();


    /*
     * Current selected filter
     * front/back dono par.
     */

    applyCameraFilter();


    modal.style.display =
      "flex";


  }catch(error){

    console.error(
      "CAMERA ERROR:",
      error
    );


    showStatus(
      "Camera open nahi hua: " +
      error.message
    );

  }

}


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        function(track){

          track.stop();

        }
      );

    cameraStream =
      null;

  }


  const video =
    document.getElementById(
      "cameraVideo"
    );


  video.srcObject =
    null;


  document
    .getElementById(
      "cameraModal"
    )
    .style.display =
      "none";

}


document
  .getElementById(
    "closeCameraBtn"
  )
  .addEventListener(
    "click",
    closeCamera
  );


/* =====================================================
   SWITCH CAMERA
===================================================== */

document
  .getElementById(
    "switchCameraBtn"
  )
  .addEventListener(
    "click",
    async function(){

      currentFacingMode =
        currentFacingMode ===
        "user"

          ? "environment"

          : "user";


      /*
       * Selected filter remains
       * same after camera switch.
       */

      await openCamera();

    }
  );


/* =====================================================
   FILTER CSS
===================================================== */

function filterToCss(
  filter
){

  switch(filter){

    case "vintage":

      return (
        "sepia(.7) " +
        "contrast(1.1) " +
        "saturate(.8)"
      );


    case "bw":

      return (
        "grayscale(1)"
      );


    case "warm":

      return (
        "sepia(.25) " +
        "saturate(1.35)"
      );


    case "cool":

      return (
        "saturate(.9) " +
        "hue-rotate(15deg)"
      );


    case "glow":

      return (
        "brightness(1.1) " +
        "saturate(1.2)"
      );


    case "night":

      return (
        "brightness(.65) " +
        "contrast(1.25) " +
        "saturate(1.2)"
      );


    case "pop":

      return (
        "saturate(1.8) " +
        "contrast(1.15)"
      );


    case "dream":

      return (
        "brightness(1.08) " +
        "contrast(.9) " +
        "saturate(1.2)"
      );


    case "sunset":

      return (
        "sepia(.25) " +
        "saturate(1.5) " +
        "hue-rotate(-10deg)"
      );


    case "none":

    default:

      return "none";

  }

}


/* =====================================================
   APPLY FILTER TO LIVE CAMERA
===================================================== */

function applyCameraFilter(){

  const video =
    document.getElementById(
      "cameraVideo"
    );


  if(!video){
    return;
  }


  const filter =
    filterToCss(
      currentFilter
    );


  /*
   * Important:
   * !important CSS ko override
   * karne ke liye setProperty.
   */

  video.style.setProperty(
    "--camera-filter",
    filter
  );


  video.style.filter =
    filter;

}

/* =====================================================
   CAPTURE PHOTO
===================================================== */

document

    "captureBtn"
  )
  .addEventListener(
    "click",
    capturePhoto
  );


function capturePhoto(){

  const video =
    document.getElementById(
      "cameraVideo"
    );


  if(
    !cameraStream ||
    !video.videoWidth
  ){

    showStatus(
      "Camera ready nahi hai."
    );

    return;

  }


  const canvas =
    document.getElementById(
      "cameraCanvas"
    );


  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
   * Same selected filter
   * captured photo par.
   */

  ctx.filter =
    filterToCss(
      currentFilter
    );


  /*
   * IMPORTANT:
   *
   * Video par CSS mirror nahi hai,
   * isliye saved photo bhi
   * correct direction me rahegi.
   */

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );


  document
    .getElementById(
      "previewImage"
    )
    .src =
      imageData;


  /*
   * Preview open.
   */

  document
    .getElementById(
      "cameraModal"
    )
    .style.display =
      "none";


  document
    .getElementById(
      "previewModal"
    )
    .style.display =
      "flex";

}

/* =====================================================
   IMAGE DATA TO BLOB
===================================================== */

function dataURLtoBlob(
  dataURL
){

  const parts =
    dataURL.split(",");


  const mime =
    parts[0]
      .match(
        /:(.*?);/
      )[1];


  const binary =
    atob(
      parts[1]
    );


  const array =
    new Uint8Array(
      binary.length
    );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    array[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [
      array
    ],
    {
      type:mime
    }
  );

}


/* =====================================================
   POST SNAP
===================================================== */

document
  .getElementById(
    "postBtn"
  )
  .addEventListener(
    "click",
    postSnap
  );


async function postSnap(){

  if(
    !currentLocation
  ){

    showStatus(
      "Pehle location allow karo."
    );

    return;

  }


  const image =
    document
      .getElementById(
        "previewImage"
      );


  if(
    !image.src ||
    image.src.length < 50
  ){

    showStatus(
      "Photo nahi mili."
    );

    return;

  }


  const client =
    initSupabase();


  if(!client){
    return;
  }


  showStatus(
    "📤 Snap upload ho raha hai..."
  );


  try{

    const blob =
      dataURLtoBlob(
        image.src
      );


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      ".jpg";


    const upload =
      await client
        .storage
        .from(
          "past-snaps"
        )
        .upload(
          fileName,
          blob,
          {
            contentType:
              "image/jpeg",

            upsert:false
          }
        );


    if(upload.error){

      throw upload.error;

    }


    const publicData =
      client
        .storage
        .from(
          "past-snaps"
        )
        .getPublicUrl(
          fileName
        );


    const imageUrl =
      publicData
        .data
        .publicUrl;


    const insert =
      await client
        .from(
          "snaps"
        )
        .insert({

          latitude:
            currentLocation.latitude,

          longitude:
            currentLocation.longitude,

          image_url:
            imageUrl

        });


    if(insert.error){

      throw insert.error;

    }


    document
      .getElementById(
        "previewModal"
      )
      .style.display =
        "none";


    showStatus(
      "✅ Snap posted successfully!"
    );


    await loadSnapsForVisibleArea();


  }catch(error){

    console.error(
      "POST ERROR:",
      error
    );


    showStatus(
      "Upload failed: " +
      error.message
    );

  }

}


/* =====================================================
   SEARCH
===================================================== */

async function searchLocation(){

  const query =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  if(!query){

    showStatus(
      "Location ka naam likho."
    );

    return;

  }


  showStatus(
    "🔍 Location search ho rahi hai..."
  );


  try{

    const url =
      "https://nominatim.openstreetmap.org/search?" +

      new URLSearchParams({

        q:query,

        format:"json",

        limit:"5"

      });


    const response =
      await fetch(
        url,
        {
          headers:{
            "Accept":
              "application/json"
          }
        }
      );


    const results =
      await response.json();


    if(
      !results ||
      !results.length
    ){

      showStatus(
        "Location nahi mili."
      );

      return;

    }


    const first =
      results[0];


    const lat =
      Number(
        first.lat
      );


    const lon =
      Number(
        first.lon
      );


    map.setView(
      [
        lat,
        lon
      ],
      16
    );


    if(searchMarker){

      map.removeLayer(
        searchMarker
      );

    }


    searchMarker =
      L.marker(
        [
          lat,
          lon
        ]
      )
      .addTo(map)
      .bindPopup(
        first.display_name
      )
      .openPopup();


    showStatus(
      "📍 Location found."
    );


    /*
     * Visible area snaps
     * automatically load honge.
     */

    setTimeout(
      loadSnapsForVisibleArea,
      500
    );


  }catch(error){

    console.error(
      error
    );


    showStatus(
      "Search failed."
    );

  }

}


document
  .getElementById(
    "searchBtn"
  )
  .addEventListener(
    "click",
    searchLocation
  );


document
  .getElementById(

  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"

      }

    }
  );

/* =====================================================
   GALLERY
===================================================== */

function openGallery(
  snaps
){

  if(
    !snaps ||
    !snaps.length
  ){

    return;

  }


  gallerySnaps =
    snaps;


  galleryIndex =
    0;


  document
    .getElementById(
      "galleryModal"
    )
    .style.display =
      "flex";


  updateGallery();

}


/* =====================================================
   UPDATE GALLERY
===================================================== */

function updateGallery(){

  if(
    !gallerySnaps.length
  ){

    return;

  }


  const snap =
    gallerySnaps[
      galleryIndex
    ];


  document
    .getElementById(
      "galleryImage"
    )
    .src =
      snap.image_url;


  document
    .getElementById(
      "galleryCounter"
    )
    .textContent =

      (
        galleryIndex + 1
      ) +

      " / " +

      gallerySnaps.length;

}


/* =====================================================
   PREVIOUS
===================================================== */

document
  .getElementById(
    "prevBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(
        !gallerySnaps.length
      ){

        return;

      }


      galleryIndex--;

      if(
        galleryIndex < 0
      ){

        galleryIndex =
          gallerySnaps.length - 1;

      }


      updateGallery();

    }
  );


/* =====================================================
   NEXT
===================================================== */

document
  .getElementById(
    "nextBtn"
  )
  .addEventListener(
    "click",
    function(){

      if(
        !gallerySnaps.length
      ){

        return;

      }


      galleryIndex++;

      if(
        galleryIndex >=
        gallerySnaps.length
      ){

        galleryIndex =
          0;

      }


      updateGallery();

    }
  );


/* =====================================================
   CLOSE GALLERY
===================================================== */

document
  .getElementById(
    "closeGalleryBtn"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "galleryModal"
        )
        .style.display =
          "none";

    }
  );


/* =====================================================
   SWIPE GALLERY
===================================================== */

let touchStartX =
  0;


let touchEndX =
  0;


const galleryBox =
  document.getElementById(
    "galleryImageBox"
  );


galleryBox.addEventListener(
  "touchstart",
  function(event){

    touchStartX =
      event.changedTouches[0].screenX;

  },
  {
    passive:true
  }
);


galleryBox.addEventListener(
  "touchend",
  function(event){

    touchEndX =
      event.changedTouches[0].screenX;


    const diff =
      touchEndX -
      touchStartX;


    if(
      Math.abs(diff) <
      50
    ){

      return;

    }


    if(diff > 0){

      document
        .getElementById(
          "prevBtn"
        )
        .click();

    }else{

      document
        .getElementById(
          "nextBtn"
        )
        .click();

    }

  },
  {
    passive:true
  }
);
