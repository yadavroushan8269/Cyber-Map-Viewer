<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Past Snap</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  overflow:hidden;
}

button,input,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* TOP */

#topBar{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  gap:6px;
  background:rgba(0,0,0,.78);
  padding:7px;
  border-radius:15px;
}

#searchInput{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  border-radius:10px;
  padding:11px;
  font-size:15px;
}

#searchBtn,#locBtn{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  background:#fff;
  color:#111;
  font-weight:700;
}

#locBtn{
  position:absolute;
  z-index:2000;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  box-shadow:0 4px 20px #000;
}

/* STATUS */

#status{
  position:absolute;
  z-index:9000;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.88);
  padding:8px 14px;
  border-radius:20px;
  font-size:13px;
  display:none;
  max-width:92%;
  text-align:center;
}

/* AUTH */

#authModal{
  position:absolute;
  inset:0;
  z-index:10000;
  background:#111;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:min(100%,380px);
  background:#1b1b1b;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 60px #000;
}

.authBox h2{
  margin:0 0 5px;
  text-align:center;
}

.authSub{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:18px;
}

.authInput{
  width:100%;
  padding:13px;
  border:0;
  outline:0;
  border-radius:10px;
  margin-bottom:10px;
  font-size:15px;
}

.authBtn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  font-weight:700;
  font-size:15px;
  background:#fff;
  color:#111;
  margin-top:5px;
}

.authSwitch{
  text-align:center;
  margin-top:14px;
  color:#aaa;
  font-size:13px;
}

.authSwitch button{
  background:none;
  border:0;
  color:#fff;
  text-decoration:underline;
}

#logoutBtn,
#notificationBtn{
  position:absolute;
  z-index:2000;
  top:65px;
  border:0;
  background:rgba(0,0,0,.75);
  color:#fff;
  padding:8px 11px;
  border-radius:10px;
}

#logoutBtn{
  right:10px;
}

#notificationBtn{
  left:10px;
  display:none;
}

/* MODALS */

.modal{
  display:none;
  position:absolute;
  inset:0;
  z-index:5000;
  background:#000;
  flex-direction:column;
}

/* CAMERA */

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  display:block;
}

#cameraVideo.mirror-preview{
  transform:scaleX(-1);
}

#cameraTop{
  position:absolute;
  top:10px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  padding:10px;
}

#cameraTop button,
.roundBtn{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:20px;
}

#cameraCanvas{
  display:none;
}

#songCameraBtn{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:20px;
}

/* ZOOM */

#zoomBox{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  z-index:10;
  background:rgba(0,0,0,.65);
  border-radius:18px;
  padding:8px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

#zoomRange{
  writing-mode:vertical-lr;
  direction:rtl;
  width:30px;
  height:170px;
}

#zoomValue{
  font-size:12px;
  font-weight:700;
}

/* MODE */

#modeBar{
  position:absolute;
  bottom:154px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  background:rgba(0,0,0,.65);
  border-radius:20px;
  padding:4px;
}

#modeBar button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:8px 14px;
  border-radius:17px;
  font-weight:700;
}

#modeBar button.active{
  background:#fff;
  color:#111;
}

/* FILTER */

#filterBar{
  position:absolute;
  bottom:92px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:7px 10px;
  scrollbar-width:none;
}

#filterBar::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:0 0 auto;
  border:0;
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:8px 12px;
  border-radius:17px;
  font-size:12px;
}

.filterBtn.active{
  background:#fff;
  color:#111;
}

/* CAMERA BOTTOM */

#cameraBottom{
  position:absolute;
  bottom:14px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

#mirrorBtn{
  border:0;
  background:rgba(0,0,0,.65);
  color:#fff;
  border-radius:20px;
  padding:10px 14px;
}

#mirrorBtn.active{
  background:#fff;
  color:#111;
}

#captureBtn{
  width:70px;
  height:70px;
  border-radius:50%;
  border:6px solid #fff;
  background:#fff;
}

#captureBtn.recording{
  background:#e33;
  border-radius:18px;
}

#recordTimer{
  position:absolute;
  bottom:82px;
  left:50%;
  transform:translateX(-50%);
  z-index:11;
  background:rgba(0,0,0,.75);
  padding:6px 12px;
  border-radius:16px;
  display:none;
  font-weight:700;
}

/* SONG PICKER */

#songModal{
  background:rgba(0,0,0,.75);
  justify-content:flex-end;
}

.songSheet{
  background:#151515;
  border-radius:22px 22px 0 0;
  max-height:82%;
  overflow:auto;
  padding:16px;
}

.songHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.songHeader h3{
  margin:0;
}

.songClose{
  border:0;
  background:#333;
  color:#fff;
  border-radius:50%;
  width:38px;
  height:38px;
}

.songCategories{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:12px;
}

.songCategory{
  border:0;
  background:#333;
  color:#fff;
  border-radius:18px;
  padding:8px 13px;
  white-space:nowrap;
}

.songCategory.active{
  background:#fff;
  color:#111;
}

.songItem{
  background:#222;
  border-radius:13px;
  padding:11px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:10px;
}

.songPlay{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#fff;
  color:#111;
}

.songInfo{
  flex:1;
}

.songTitle{
  font-weight:700;
}

.songArtist{
  color:#aaa;
  font-size:12px;
  margin-top:3px;
}

.songUse{
  border:0;
  background:#fff;
  color:#111;
  border-radius:10px;
  padding:8px 10px;
  font-weight:700;
}

#songEditor{
  display:none;
  background:#222;
  padding:12px;
  border-radius:13px;
  margin-top:10px;
}

#songRange{
  width:100%;
}

.songTime{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#bbb;
}

/* DETAILS */

#detailsModal{
  background:#111;
  padding:15px;
  overflow:auto;
}

.detailsBox{
  width:min(100%,500px);
  margin:auto;
  padding-top:20px;
}

.detailsTitle{
  font-size:21px;
  font-weight:700;
  margin-bottom:15px;
}

.detailsInput,
.detailsTextarea{
  width:100%;
  border:0;
  outline:0;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  font-size:15px;
}

.detailsTextarea{
  height:110px;
  resize:none;
}

.locationCard{
  background:#1c1c1c;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  color:#ddd;
  font-size:13px;
}

.locationCard b{
  color:#fff;
}

.detailsButtons{
  display:flex;
  gap:10px;
}

.detailsButtons button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:700;
}

#detailsBackBtn{
  background:#333;
  color:#fff;
}

#detailsNextBtn{
  background:#fff;
  color:#111;
}

/* PREVIEW */

#previewModal{
  background:#111;
}

#previewMediaBox{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
}

#previewImage,#previewVideo{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

#previewInfo{
  padding:10px;
  text-align:center;
  font-size:13px;
  background:#181818;
}

#qualityBox{
  display:flex;
  gap:6px;
  justify-content:center;
  padding:8px;
  background:#181818;
}

.qualityBtn{
  border:0;
  background:#333;
  color:#fff;
  border-radius:9px;
  padding:7px 12px;
}

.qualityBtn.active{
  background:#fff;
  color:#111;
}

#previewBottom{
  display:flex;
  gap:10px;
  padding:12px;
}

#previewBottom button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  font-weight:700;
}

#cancelPreviewBtn{
  background:#333;
  color:#fff;
}

#
