<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Past Snap</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand {
      background: rgba(0, 0, 0, 0.82);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .searchBox {
      flex: 1;
      display: flex;
      gap: 6px;
      min-width: 0;
    }

    .searchBox input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .smallBtn {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      background: #111;
      color: #fff;
      font-weight: 700;
    }

    /* =========================
       MAP BUTTONS
    ========================= */

    .mapControls {
      position: fixed;
      right: 12px;
      bottom: 18px;
      z-index: 1000;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mapBtn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* =========================
       USER MENU
    ========================= */

    .userPanel {
      position: fixed;
      top: 66px;
      right: 12px;
      z-index: 1100;

      width: 250px;
      max-width: calc(100vw - 24px);

      background: rgba(0, 0, 0, 0.93);
      border-radius: 18px;
      padding: 16px;

      display: none;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .userPanel.show {
      display: block;
    }

    .userPanel h3 {
      margin: 0 0 6px;
    }

    .userPanel p {
      color: #aaa;
      font-size: 13px;
      margin: 0 0 14px;
      word-break: break-all;
    }

    .panelBtn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 11px;
      margin-top: 7px;
      background: #fff;
      color: #111;
      font-weight: 700;
    }

    .panelBtn.danger {
      background: #e53935;
      color: white;
    }

    /* =========================
       AUTH MODAL
    ========================= */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;

      background: rgba(0, 0, 0, 0.72);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 18px;
      backdrop-filter: blur(8px);
    }

    .overlay.show {
      display: flex;
    }

    .authCard {
      width: 100%;
      max-width: 420px;
      background: #111;
      border-radius: 22px;
      padding: 22px;
    }

    .authCard h2 {
      margin-top: 0;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #bbb;
      font-size: 13px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #333;
      outline: none;
      background: #1c1c1c;
      color: #fff;
      border-radius: 12px;
      padding: 12px;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .primaryBtn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 13px;
      background: #fff;
      color: #000;
      font-weight: 800;
      margin-top: 5px;
    }

    .secondaryBtn {
      width: 100%;
      border: 1px solid #444;
      border-radius: 13px;
      padding: 12px;
      background: transparent;
      color: #fff;
      font-weight: 700;
      margin-top: 8px;
    }

    .closeBtn {
      float: right;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 25px;
    }

    .authSwitch {
      margin-top: 14px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .authSwitch button {
      border: 0;
      background: transparent;
      color: #fff;
      text-decoration: underline;
    }

    /* =========================
       CAMERA MODAL
    ========================= */

    .cameraOverlay {
      position: fixed;
      inset: 0;
      z-index: 4000;

      display: none;
      background: #000;
    }

    .cameraOverlay.show {
      display: block;
    }

    .cameraVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;
      object-fit: cover;

      background: #000;
    }

    .cameraVideo.mirror {
      transform: scaleX(-1);
    }

    .cameraTop {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      z-index: 5;
    }

    .cameraTop button,
    .cameraAction {
      border: 0;
      background: rgba(0, 0, 0, 0.55);
      color: white;
      border-radius: 50%;
      width: 46px;
      height: 46px;
    }

    .cameraTools {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 13px;

      z-index: 5;
    }

    .cameraAction {
      font-size: 18px;
    }

    .captureBtn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 5px solid white;
      background: rgba(255, 255, 255, 0.25);
    }

    .captureBtn.recording {
      background: #e53935;
    }

    .cameraBottomInfo {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 100px;
      z-index: 5;

      display: flex;
      gap: 8px;
      justify-content: center;
      overflow-x: auto;
    }

    .filterBtn {
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border-radius: 20px;
      padding: 7px 11px;
      font-size: 12px;
    }

    .filterBtn.active {
      background: white;
      color: black;
    }

    .zoomInfo {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);

      padding: 7px 12px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 20px;
      font-size: 13px;
    }

    /* =========================
       PREVIEW MODAL
    ========================= */

    .previewCard {
      width: 100%;
      max-width: 520px;
      max-height: 94vh;
      overflow-y: auto;

      background: #111;
      border-radius: 22px;
      padding: 16px;
    }

    .previewMedia {
      width: 100%;
      max-height: 52vh;
      object-fit: contain;
      background: #000;
      border-radius: 15px;
    }

    .previewInfo {
      margin-top: 14px;
    }

    .qualityRow {
      display: flex;
      gap: 7px;
      margin: 10px 0;
    }

    .qualityBtn {
      flex: 1;
      padding: 9px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      border-radius: 10px;
    }

    .qualityBtn.active {
      background: #fff;
      color: #000;
    }

    /* =========================
       CLUSTER POST VIEWER
    ========================= */

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 6000;

      background: #000;

      display: none;
      flex-direction: column;

      touch-action: pan-y;
    }

    .viewer.show {
      display: flex;
    }

    .viewerTop {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;

      padding: 12px 14px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        transparent
      );
    }

    .viewerClose {
      width: 44px;
      height: 44px;

      border: 0;
      border-radius: 50%;

      background: rgba(0,0,0,.55);
      color: white;

      font-size: 27px;
    }

    .viewerCounter {
      background: rgba(0,0,0,.55);
      padding: 8px 12px;
      border-radius: 18px;
      font-size: 13px;
    }

    .viewerTrack {
      width: 100%;
      height: 100%;

      display: flex;

      overflow-x: auto;
      overflow-y: hidden;

      scroll-snap-type: x mandatory;
      scrollbar-width: none;

      overscroll-behavior-x: contain;
    }

    .viewerTrack::-webkit-scrollbar {
      display: none;
    }

    .viewerSlide {
      position: relative;

      min-width: 100%;
      width: 100%;
      height: 100%;

      scroll-snap-align: start;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .viewerMedia {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .viewerInfo {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 10;

      padding: 55px 18px 20px;

      background: linear-gradient(
        transparent,
        rgba(0,0,0,.88)
      );
    }

    .viewerName {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .viewerLocation {
      color: #ddd;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .viewerDate {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .viewerDescription {
      font-size: 14px;
      line-height: 1.45;
      color: #eee;
      margin-bottom: 10px;
    }

    .viewerActions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .viewerActionBtn {
      border: 0;
      background: rgba(255,255,255,.12);
      color: white;
      border-radius: 20px;
      padding: 8px 12px;
    }

    /* =========================
       COMMENTS
    ========================= */

    .commentsPanel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;

      max-height: 75vh;
      background: #111;

      border-radius: 22px 22px 0 0;

      transform: translateY(100%);
      transition: transform .25s ease;

      display: flex;
      flex-direction: column;
    }

    .commentsPanel.show {
      transform: translateY(0);
    }

    .commentsHeader {
      padding: 14px;
      border-bottom: 1px solid #292929;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .commentsList {
      overflow-y: auto;
      padding: 12px;
      flex: 1;
    }

    .comment {
      padding: 10px 0;
      border-bottom: 1px solid #222;
    }

    .commentName {
      font-weight: 800;
      font-size: 13px;
    }

    .commentText {
      margin-top: 4px;
      color: #ddd;
      font-size: 14px;
      line-height: 1.4;
    }

    .commentForm {
      display: flex;
      gap: 7px;
      padding: 10px;
      border-top: 1px solid #292929;
    }

    .commentForm input {
      flex: 1;
      min-width: 0;

      border: 1px solid #333;
      border-radius: 12px;
      background: #1b1b1b;
      color: white;
      padding: 11px;
    }

    .commentForm button {
      border: 0;
      border-radius: 12px;
      padding: 0 14px;
      background: #fff;
      color: #000;
      font-weight: 700;
    }

    /* =========================
       EXIT CONFIRM
    ========================= */

    .exitCard {
      width: 100%;
      max-width: 370px;

      background: #111;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .exitCard h3 {
      margin-top: 0;
    }

    .exitBtns {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }

    .exitBtns button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 0;
      font-weight: 800;
    }

    .editExit {
      background: #fff;
      color: #000;
    }

    .cancelExit {
      background: #292929;
      color: #fff;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10000;

      transform: translateX(-50%) translateY(20px);

      background: rgba(0,0,0,.9);
      color: white;

      padding: 11px 15px;
      border-radius: 12px;

      font-size: 13px;

      opacity: 0;
      pointer-events: none;

      transition: .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      position: fixed;
      inset: 0;
      z-index: 12000;

      background: rgba(0,0,0,.7);

      display: none;
      align-items: center;
      justify-content: center;
    }

    .loading.show {
      display: flex;
    }

    .loaderBox {
      background: #111;
      border-radius: 18px;
      padding: 20px 25px;
      text-align: center;
    }

    .spinner {
      width: 35px;
      height: 35px;
      border: 4px solid #333;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .brand {
        display: none;
      }

      .topbar {
        left: 8px;
        right: 8px;
      }

      .searchBox {
        width: 100%;
      }

      .viewerInfo {
        padding-bottom: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- MAP -->
  <div id="map"></div>

  <!-- TOP BAR -->
  <div class="topbar">

    <div class="brand">
      👻 Past Snap
    </div>

    <div class="searchBox">
      <input
        id="searchInput"
        type="text"
        placeholder="Search location..."
      />

      <button
        class="smallBtn"
        id="searchBtn"
      >
        🔍
      </button>
    </div>

    <button
      class="smallBtn"
      id="userBtn"
    >
      👤
    </button>

  </div>

  <!-- MAP CONTROLS -->
  <div class="mapControls">

    <button
      class="mapBtn"
      id="locationBtn"
      title="My location"
    >
      📍
    </button>

    <button
      class="mapBtn"
      id="cameraOpenBtn"
      title="Create snap"
    >
      📷
    </button>

  </div>

  <!-- USER PANEL -->
  <div
    class="userPanel"
    id="userPanel"
  >

    <div id="loggedOutPanel">

      <h3>Past Snap</h3>

      <p>
        Login karke snap post karo.
      </p>

      <button
        class="panelBtn"
        id="loginOpenBtn"
      >
        Login
      </button>

      <button
        class="panelBtn"
        id="registerOpenBtn"
      >
        Register
      </button>

    </div>

    <div
      id="loggedInPanel"
      style="display:none;"
    >

      <h3 id="profileName">
        User
      </h3>

      <p id="profileEmail"></p>

      <button
        class="panelBtn danger"
        id="logoutBtn"
      >
        Logout
      </button>

    </div>

  </div>


  <!-- AUTH MODAL -->

  <div
    class="overlay"
    id="authOverlay"
  >

    <div class="authCard">

      <button
        class="closeBtn"
        id="authCloseBtn"
      >
        ×
      </button>

      <!-- LOGIN -->

      <div id="loginForm">

        <h2>Login</h2>

        <div class="field">
          <label>Email</label>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
          />
        </div>

        <button
          class="primaryBtn"
          id="loginBtn"
        >
          Login
        </button>

        <div class="authSwitch">
          Account nahi hai?
          <button id="showRegisterBtn">
            Register
          </button>
        </div>

      </div>


      <!-- REGISTER -->

      <div
        id="registerForm"
        style="display:none;"
      >

        <h2>Register</h2>

        <div class="field">
          <label>Display Name</label>

          <input
            id="registerName"
            type="text"
            maxlength="40"
          />
        </div>

        <div class="field">
          <label>Email</label>

          <input
            id="registerEmail"
            type="email"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label>Password</label>

          <input
            id="registerPassword"
            type="password"
            autocomplete="new-password"
          />
        </div>

        <button
          class="primaryBtn"
          id="registerBtn"
        >
          Create Account
        </button>

        <div class="authSwitch">
          Already account hai?
          <button id="showLoginBtn">
            Login
          </button>
        </div>

      </div>

    </div>

  </div>


  <!-- CAMERA -->

  <div
    class="cameraOverlay"
    id="cameraOverlay"
  >

    <video
      id="cameraVideo"
      class="cameraVideo mirror"
      autoplay
      playsinline
      muted
    ></video>

    <div class="cameraTop">

      <button id="cameraCloseBtn">
        ×
      </button>

      <div class="zoomInfo">
        <span id="zoomText">1.0x</span>
      </div>

      <button id="cameraSwitchBtn">
        🔄
      </button>

    </div>


    <div class="cameraBottomInfo">

      <button
        class="filterBtn active"
        data-filter="normal"
      >
        Normal
      </button>

      <button
        class="filterBtn"
        data-filter="vintage"
      >
        Vintage
      </button>

      <button
        class="filterBtn"
        data-filter="bw"
      >
        B&W
      </button>

      <button
        class="filterBtn"
        data-filter="warm"
      >
        Warm
      </button>

      <button
        class="filterBtn"
        data-filter="cool"
      >
        Cool
      </button>

      <button
        class="filterBtn"
        data-filter="glow"
      >
        Glow
      </button>

      <button
        class="filterBtn"
        data-filter="night"
      >
        Night
      </button>

      <button
        class="filterBtn"
        data-filter="colorpop"
      >
        Color Pop
      </button>

      <button
        class="filterBtn"
        data-filter="dream"
      >
        Dream
      </button>

      <button
        class="filterBtn"
        data-filter="sunset"
      >
        Sunset
      </button>

    </div>


    <div class="cameraTools">

      <button
        class="cameraAction"
        id="cameraMirrorBtn"
      >
        ↔
      </button>

      <button
        class="cameraAction"
        id="cameraModeBtn"
      >
        🎥
      </button>

      <button
        class="captureBtn"
        id="captureBtn"
      ></button>

      <button
        class="cameraAction"
        id="zoomOutBtn"
      >
        −
      </button>

      <button
        class="cameraAction"
        id="zoomInBtn"
      >
        +
      </button>

    </div>

  </div>


  <!-- PREVIEW -->

  <div
    class="overlay"
    id="previewOverlay"
  >

    <div class="previewCard">

      <button
        class="closeBtn"
        id="previewCloseBtn"
      >
        ×
      </button>

      <h2 id="previewTitle">
        New Snap
      </h2>

      <div id="previewMediaContainer"></div>

      <div class="previewInfo">

        <div class="field">

          <label>Description</label>

          <textarea
            id="descriptionInput"
            maxlength="2000"
            placeholder="Write something about this snap..."
          ></textarea>

        </div>


        <div class="field">

          <label>Location</label>

          <input
            id="locationNameInput"
            type="text"
            maxlength="200"
            placeholder="Location name"
          />

        </div>


        <div id="videoQualityArea">

          <label style="color:#bbb;font-size:13px;">
            Video quality
          </label>

          <div class="qualityRow">

            <button
              class="qualityBtn"
              data-quality="480"
            >
              480p
            </button>

            <button
              class="qualityBtn active"
              data-quality="720"
            >
              720p
            </button>

            <button
              class="qualityBtn"
              data-quality="1080"
            >
              1080p
            </button>

          </div>

        </div>


        <button
          class="primaryBtn"
          id="postSnapBtn"
        >
          👻 Post Snap
        </button>

      </div>

    </div>

  </div>


  <!-- FULL SCREEN CLUSTER VIEWER -->

  <div
    class="viewer"
    id="viewer"
  >

    <div class="viewerTop">

      <button
        class="viewerClose"
        id="viewerCloseBtn"
      >
        ×
      </button>

      <div
        class="viewerCounter"
        id="viewerCounter"
      >
        1 / 1
      </div>

      <div style="width:44px;"></div>

    </div>


    <div
      class="viewerTrack"
      id="viewerTrack"
    ></div>


    <!-- COMMENTS PANEL -->

    <div
      class="commentsPanel"
      id="commentsPanel"
    >

      <div class="commentsHeader">

        <strong>
          Comments
        </strong>

        <button
          class="closeBtn"
          id="commentsCloseBtn"
        >
          ×
        </button>

      </div>

      <div
        class="commentsList"
        id="commentsList"
      ></div>

      <div class="commentForm">

        navigator.geolocation.getCurrentPosition(
          position => {

            const lat =
              position.coords.latitude;

            const lng =
              position.coords.longitude;

            map.setView(
              [lat, lng],
              17

            L.circleMarker(

    async function searchLocation() {

      const query =
        $("searchInput").value.trim();

      if (!query) return;

      try {

        const url =
          "https://nominatim.openstreetmap.org/search?" +
          new URLSearchParams({
            q: query,
            format: "json",
            limit: "1"
          });

        const response =
          await fetch(url, {
            headers: {
              "Accept":
                "application/json"
            }
          });

        const data =
          await response.json();

        if (!data.length) {

          toast("Location nahi mili.");

          return;
        }

        const lat =
          parseFloat(data[0].lat);

        const lon =
          parseFloat(data[0].lon);

        map.setView(
          [lat, lon],
          16
        );

      } catch (error) {

        console.error(error);

        toast("Search failed.");

      }

    }


    /* ============================================================

    /* ============================================================
       REGISTER
    ============================================================ */

    $("registerBtn").addEventListener(
      "click",
      registerUser
    );


    async function registerUser() {

      const name =
        $("registerName")
          .value
          .trim();

      const email =
        $("registerEmail")
          .value
          .trim();

      const password =
        $("registerPassword")
          .value;

      if (!name || !email || !password) {

        toast("Sabhi fields fill karo.");

        return;
      }

      if (password.length < 6) {

        toast(
          "Password kam se kam 6 characters ka ho."
        );

        return;
      }

      showLoading("Account create ho raha hai...");

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({
            email,
            password
          });

        if (error) throw error;

        if (!data.user) {

          throw new Error(
            "User create nahi hua."
          );

        }

        const {
          error: profileError
        } =
          await supabaseClient
            .from("profiles")
            .upsert({
              id: data.user.id,
              display_name: name
            });

        if (profileError) {

          console.warn(
            profileError
          );

        }

        toast(
          "Account successfully create ho gaya."
        );

        closeAuth();

        await refreshAuth();

      } catch (error) {

        console.error(error);

        toast(
          error.message ||
          "Registration failed."
        );

      } finally {

        hideLoading();

      }

    }


    /* ============================================================
       LOGIN
    ============================================================ */

    $("loginBtn").addEventListener(
      "click",
      loginUser
    );


    async function loginUser() {

      const email =
        $("loginEmail")
          .value
          .trim();

      const password =
        $("loginPassword")
          .value;

      if (!email || !password) {

        toast("Email aur password enter karo.");

        return;
      }

      showLoading("Login ho raha hai...");

      try {

        const {
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email,
              password
            });

        if (error) throw error;

        toast("Login successful.");

        closeAuth();

        await refreshAuth();

      } catch (error) {

        console.error(error);

        toast(
          error.message ||
          "Login failed."
        );

      } finally {

        hideLoading();

      }

    }


    /* ============================================================
       LOGOUT
    ============================================================ */

    $("logoutBtn").addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        currentUser = null;

        currentProfile = null;

        updateAuthUI();

        $("userPanel")
          .classList.remove("show");

        toast("Logout ho gaya.");

      }
    );


    /* ============================================================
       AUTH STATE
    ============================================================ */

    async function refreshAuth() {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();

      currentUser =
        data.session
          ? data.session.user
          : null;

      if (currentUser) {

        await loadProfile();

      } else {

        currentProfile = null;

      }

      updateAuthUI();

    }


    async function loadProfile() {

      if (!currentUser) return;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("id,display_name")
          .eq("id", currentUser.id)
          .maybeSingle();

      if (!error && data) {

        currentProfile = data;

      } else {

        currentProfile = {
          id: currentUser.id,
          display_name:
            currentUser.email
              ? currentUser.email.split("@")[0]
              : "User"
        };

      }

    }


    function updateAuthUI() {

      if (currentUser) {

        $("loggedOutPanel").style.display =
          "none";

        $("loggedInPanel").style.display =
          "block";

        $("profileName").textContent =
          currentProfile?.display_name ||
          "User";

        $("profileEmail").textContent =
          currentUser.email || "";

        $("userBtn").textContent =
          "👤";

      } else {

        $("loggedOutPanel").style.display =
          "block";

        $("loggedInPanel").style.display =
          "none";

      }

    }


    /* ============================================================
       CAMERA OPEN
    ============================================================ */

    $("cameraOpenBtn").addEventListener(
      "click",
      openCamera
    );


    async function openCamera() {

      if (!currentUser) {

        toast("Pehle login karo.");

        openAuth("login");

        return;
      }

      try {

        await startCamera();

        $("cameraOverlay")
          .classList.add("show");

      } catch (error) {

        console.error(error);

        toast(
          "Camera permission allow karo."
        );

      }

    }


    async function startCamera() {

      stopCamera();

      cameraStream =
        await navigator.mediaDevices
          .getUserMedia({
            video: {
              facingMode: cameraFacing,
              width: {
                ideal: 1920
              },
              height: {
                ideal: 1080
              }
            },
            audio: true
          });

      $("cameraVideo").srcObject =
        cameraStream;

      applyCameraPreview();

    }


    function stopCamera() {

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(
            track => track.stop()
          );

        cameraStream = null;

      }

      if ($("cameraVideo").srcObject) {

        $("cameraVideo").srcObject = null;

      }

    }


    $("cameraCloseBtn").addEventListener(
      "click",
      () => {

        stopCamera();

        $("cameraOverlay")
          .classList.remove("show");

      }
    );


    /* ============================================================
       CAMERA SWITCH
    ============================================================ */

    $("cameraSwitchBtn").addEventListener(
      "click",
      async () => {

        cameraFacing =
          cameraFacing === "user"
            ? "environment"
            : "user";

        try {

          await startCamera();

        } catch (error) {

          console.error(error);

          toast("Camera switch failed.");

        }

      }
    );


    /* ============================================================
       CAMERA MODE
    ============================================================ */

    $("cameraModeBtn").addEventListener(
      "click",
      () => {

        cameraMode =
          cameraMode === "photo"
            ? "video"
            : "photo";

        $("cameraModeBtn").textContent =
          cameraMode === "photo"
            ? "🎥"
            : "📸";

        $("previewTitle").textContent =
          cameraMode === "photo"
            ? "New Photo"
            : "New Video";

      }
    );


    /* ============================================================
       MIRROR
    ============================================================ */

    $("cameraMirrorBtn").addEventListener(
      "click",
      () => {

        mirrorEnabled =
          !mirrorEnabled;

        applyCameraPreview();

      }
    );


    function applyCameraPreview() {

      $("cameraVideo")
        .classList.toggle(
          "mirror",
          mirrorEnabled &&
          cameraFacing === "user"
        );

      applyFilter();

    }


    /* ============================================================
       FILTERS
    ============================================================ */

    document
      .querySelectorAll(".filterBtn")
      .forEach(btn => {

        btn.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filterBtn")
              .forEach(
                b =>
                  b.classList.remove("active")
              );

            btn.classList.add("active");

            selectedFilter =
              btn.dataset.filter;

            applyFilter();

          }
        );

      });


    function applyFilter() {

      const video =
        $("cameraVideo");

      const filters = {

        normal: "none",

        vintage:
          "sepia(.55) contrast(1.05) saturate(.85)",

        bw:
          "grayscale(1) contrast(1.08)",

        warm:
          "sepia(.2) saturate(1.4) contrast(1.04)",

        cool:
          "saturate(.85) hue-rotate(12deg) contrast(1.05)",

        glow:
          "brightness(1.12) saturate(1.15)",

        night:
          "brightness(.72) contrast(1.2) saturate(.85)",

        colorpop:
          "saturate(1.8) contrast(1.12)",

        dream:
          "brightness(1.08) contrast(.9) saturate(1.1)",

        sunset:
          "sepia(.3) saturate(1.55) hue-rotate(-8deg)"

      };

      video.style.filter =
        filters[selectedFilter] ||
        "none";

    }


    /* ============================================================
       ZOOM
    ============================================================ */

    $("zoomInBtn").addEventListener(
      "click",
      () => {

        zoomLevel =
          Math.min(
            20,
            +(zoomLevel + .5).toFixed(1)
          );

        updateZoom();

      }
    );


    $("zoomOutBtn").addEventListener(
      "click",
      () => {

        zoomLevel =
          Math.max(
            .5,
            +(zoomLevel - .5).toFixed(1)
          );

        updateZoom();

      }
    );


    function updateZoom() {

      $("zoomText").textContent =
        zoomLevel.toFixed(1) + "x";

      $("cameraVideo").style.transform =
        (
          mirrorEnabled &&
          cameraFacing === "user"
            ? "scaleX(-1) "
            : ""
        ) +
        "scale(" +
        zoomLevel +
        ")";

    }


    /* ============================================================
       CAPTURE
    ============================================================ */

    $("captureBtn").addEventListener(
      "click",
      () => {

        if (cameraMode === "photo") {

          capturePhoto();

        } else {

          if (
            mediaRecorder &&
            mediaRecorder.state === "recording"
          ) {

            stopRecording();

          } else {

            startRecording();

          }

        }

      }
    );


    /* ============================================================
       PHOTO
    ============================================================ */

    function capturePhoto() {

      if (!cameraStream) return;

      const video =
        $("cameraVideo");

      const canvas =
        document.createElement("canvas");

      const width =
        video.videoWidth || 1280;

      const height =
        video.videoHeight || 720;

      canvas.width = width;

      canvas.height = height;

      const ctx =
        canvas.getContext("2d");

      if (
        mirrorEnabled &&
        cameraFacing === "user"
      ) {

        ctx.translate(width, 0);

        ctx.scale(-1, 1);

      }

      applyCanvasFilter(
        ctx,
        width,
        height
      );

      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );

      canvas.toBlob(
        blob => {

          if (!blob) {

            toast("Photo capture failed.");

            return;
          }

          currentPreviewBlob = blob;

          currentPreviewType = "image";

          currentPreviewWidth =
            width;

          currentPreviewHeight =
            height;

          showPreview();

        },
        "image/jpeg",
        .90
      );

    }


    function applyCanvasFilter(
      ctx,
      width,
      height
    ) {

      const filters = {

        normal: "none",

        vintage:
          "sepia(.55) contrast(1.05) saturate(.85)",

        bw:
          "grayscale(1) contrast(1.08)",

        warm:
          "sepia(.2) saturate(1.4) contrast(1.04)",

        cool:
          "saturate(.85) hue-rotate(12deg) contrast(1.05)",

        glow:
          "brightness(1.12) saturate(1.15)",

        night:
          "brightness(.72) contrast(1.2) saturate(.85)",

        colorpop:
          "saturate(1.8) contrast(1.12)",

        dream:
          "brightness(1.08) contrast(.9) saturate(1.1)",

        sunset:
          "sepia(.3) saturate(1.55) hue-rotate(-8deg)"

      };

      ctx.filter =
        filters[selectedFilter] ||
        "none";

    }


    /* ============================================================
       VIDEO RECORD
    ============================================================ */

    function startRecording() {

      if (!cameraStream) return;

      recordedChunks = [];

      recordedStartTime =
        Date.now();

      let mimeType =
        "video/webm;codecs=vp9";

      if (
        !MediaRecorder.isTypeSupported(
          mimeType
        )
      ) {

        mimeType =
          "video/webm";

      }

      try {

        mediaRecorder =
          new MediaRecorder(
            cameraStream,
            {
              mimeType
            }
          );

      } catch (error) {

        console.error(error);

        toast("Video recording supported nahi hai.");

        return;

      }

      mediaRecorder.ondataavailable =
        event => {

          if (event.data.size > 0) {

            recordedChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        () => {

          recordedDuration =
            Math.round(
              (Date.now() -
                recordedStartTime) /
              1000
            );

          const blob =
            new Blob(
              recordedChunks,
              {
                type: mimeType
              }
            );

          currentPreviewBlob =
            blob;

          currentPreviewType =
            "video";

          currentPreviewWidth =
            $("cameraVideo").videoWidth;

          currentPreviewHeight =
            $("cameraVideo").videoHeight;

          showPreview();

        };


      mediaRecorder.start();

      $("captureBtn")
        .classList.add("recording");

      toast("Recording...");

    }


    function stopRecording() {

      if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
      ) {

        mediaRecorder.stop();

      }

      $("captureBtn")
        .classList.remove("recording");

    }


    /* ============================================================
       PREVIEW
    ============================================================ */

    function showPreview() {

      const container =
        $("previewMediaContainer");

      container.innerHTML = "";

      const url =
        URL.createObjectURL(
          currentPreviewBlob
        );

      if (currentPreviewType === "image") {

        const img =
          document.createElement("img");

        img.src = url;

        img.className =
          "previewMedia";

        container.appendChild(img);

        $("videoQualityArea")
          .style.display =
          "none";

      } else {

        const video =
          document.createElement("video");

        video.src = url;

        video.className =
          "previewMedia";

        video.controls = true;

        video.playsInline = true;

        container.appendChild(video);

        $("videoQualityArea")
          .style.display =
          "block";

      }

      $("previewOverlay")
        .classList.add("show");

      stopCamera();

      $("cameraOverlay")
        .classList.remove("show");

    }


    $("previewCloseBtn").addEventListener(
      "click",
      () => {

        closePreview();

      }
    );


    function closePreview() {

      $("previewOverlay")
        .classList.remove("show");

      currentPreviewBlob = null;

    }


    document
      .querySelectorAll(".qualityBtn")
      .forEach(btn => {

        btn.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".qualityBtn")
              .forEach(
                b =>
                  b.classList.remove("active")
              );

            btn.classList.add("active");

            selectedQuality =
              Number(
                btn.dataset.quality
              );

          }
        );

      });


    /* ============================================================
       POST SNAP
    ============================================================ */

    $("postSnapBtn").addEventListener(
      "click",
      postSnap
    );


    async function postSnap() {

      if (!currentUser) {

        toast("Login required.");

        return;
      }

      if (!currentPreviewBlob) {

        toast("Media select karo.");

        return;
      }

      const description =
        $("descriptionInput")
          .value
          .trim();

      const locationName =
        $("locationNameInput")
          .value
          .trim();

      showLoading("Snap upload ho raha hai...");

      try {

        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth
            .getSession();

        if (sessionError)
          throw sessionError;

        const session =
          sessionData.session;

        if (!session) {

          throw new Error(
            "Login session expire ho gaya."
          );

        }


        /* GET USER LOCATION */

        const position =
          await getCurrentPosition();

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        /* FILE */

        const extension =
          currentPreviewType === "image"
            ? "jpg"
            : "webm";

        const fileName =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .slice(2) +
          "." +
          extension;


        /* UPLOAD */

        const uploadResponse =
          await fetch(
            SUPABASE_URL +
            "/storage/v1/object/past-snaps/" +
            fileName,
            {
              method: "POST",

              headers: {
                "Authorization":
                  "Bearer " +
                  session.access_token,

                "apikey":
                  SUPABASE_KEY,

                "Content-Type":
                  currentPreviewBlob.type ||
                  (
                    currentPreviewType ===
                    "image"
                      ? "image/jpeg"
                      : "video/webm"
                  ),

                "x-upsert":
                  "false"
              },

              body:
                currentPreviewBlob
            }
          );


        if (!uploadResponse.ok) {

          const uploadText =
            await uploadResponse.text();

          throw new Error(
            "Storage upload failed: " +
            uploadText
          );

        }


        /* PUBLIC URL */

        const imageUrl =
          SUPABASE_URL +
          "/storage/v1/object/public/past-snaps/" +
          fileName;


        /* INSERT DATABASE */

        const insertData = {

          latitude,

          longitude,

          image_url:
            imageUrl,

          media_type:
            currentPreviewType,

          duration_seconds:
            currentPreviewType === "video"
              ? recordedDuration
              : null,

          width:
            currentPreviewWidth,

          height:
            currentPreviewHeight,

          user_id:
            currentUser.id,

          description:
            description || null,

          location_name:
            locationName || null

        };


        const {
          error: insertError
        } =
          await supabaseClient
            .from("snaps")
            .insert(insertData);

        if (insertError)
          throw insertError;


        toast(
          "👻 Snap successfully posted!"
        );

        closePreview();

        $("descriptionInput").value =
          "";

        $("locationNameInput").value =
          "";

        await loadSnaps();

        map.setView(
          [latitude, longitude],
          17
        );

      } catch (error) {

        console.error(error);

        toast(
          error.message ||
          "Snap upload failed."
        );

      } finally {

        hideLoading();

      }

    }


    function getCurrentPosition() {

      return new Promise(
        (resolve, reject) => {

          if (!navigator.geolocation) {

            reject(
              new Error(
                "Location supported nahi hai."
              )
            );

            return;
          }

          navigator.geolocation
            .getCurrentPosition(
              resolve,
              error => {

                reject(
                  new Error(
                    "Location permission required."
                  )
                );

              },
              {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 30000
              }
            );

        }
      );

    }


    /* ============================================================
       LOAD SNAPS
    ============================================================ */

    async function loadSnaps() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("snaps")
            .select(`
              id,
              latitude,
              longitude,
              image_url,
              created_at,
              media_type,
              duration_seconds,
              width,
              height,
              user_id,
              description,
              location_name
            `)
            .order(
              "created_at",
              {
                ascending: false
              }
            );

        if (error)
          throw error;

        allSnaps =
          data || [];

        await attachProfiles();

        renderClusters();

      } catch (error) {

        console.error(error);

        toast(
          "Snaps load nahi ho paaye."
        );

      }

    }


    async function attachProfiles() {

      const ids =
        [
          ...new Set(
            allSnaps
              .map(
                snap => snap.user_id
              )
              .filter(Boolean)
          )
        ];

      if (!ids.length)
        return;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,display_name"
          )
          .in(
            "id",
            ids
          );

      if (error) {

        console.warn(error);

        return;

      }

      const mapProfiles =
        {};

      (data || [])
        .forEach(profile => {

          mapProfiles[
            profile.id
          ] = profile;

        });


      allSnaps =
        allSnaps.map(
          snap => ({

            ...snap,

            profile:
              mapProfiles[
                snap.user_id
              ] || {
                display_name:
                  "Unknown user"
              }

          })
        );

    }


    /* ============================================================
       50M CLUSTERING
    ============================================================ */

    function distanceMeters(
      lat1,
      lon1,
      lat2,
      lon2
    ) {

      const R = 6371000;

      const p1 =
        lat1 * Math.PI / 180;

      const p2 =
        lat2 * Math.PI / 180;

      const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

      const dLon =
        (lon2 - lon1) *
        Math.PI / 180;

      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(p1) *
        Math.cos(p2) *
        Math.sin(dLon / 2) ** 2;

      const c =
        2 *
        Math.atan2(
          Math.sqrt(a),
          Math.sqrt(1 - a)
        );

      return R * c;

    }


    function makeClusters(
      snaps
    ) {

      const clusters = [];

      snaps.forEach(snap => {

        let found = null;

        for (
          const cluster of clusters
        ) {

          const distance =
            distanceMeters(
              snap.latitude,
              snap.longitude,
              cluster.centerLat,
              cluster.centerLng
            );

          if (distance <= 50) {

            found = cluster;

            break;

          }

        }


        if (!found) {

          clusters.push({

            centerLat:
              snap.latitude,

            centerLng:
              snap.longitude,

            snaps: [snap]

          });

        } else {

          found.snaps.push(
            snap
          );

          /* recalculate center */

          found.centerLat =
            found.snaps.reduce(
              (sum, item) =>
                sum + item.latitude,
              0
            ) /
            found.snaps.length;

          found.centerLng =
            found.snaps.reduce(
              (sum, item) =>
                sum + item.longitude,
              0
            ) /
            found.snaps.length;

        }

      });

      return clusters;

    }


    function renderClusters() {

      if (!markerLayer)
        return;

      markerLayer.clearLayers();

      const clusters =
        makeClusters(allSnaps);

      clusters.forEach(
        cluster => {

          const count =
            cluster.snaps.length;

          const icon =
            L.divIcon({

              className:
                "ghost-marker",

              html: `
                <div style="
                  width:62px;
                  height:62px;
                  border-radius:50%;
                  background:rgba(0,0,0,.86);
                  border:3px solid white;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  flex-direction:column;
                  color:white;
                  font-size:13px;
                  font-weight:800;
                  box-shadow:0 5px 18px rgba(0,0,0,.4);
                ">
                  <div style="font-size:25px;line-height:24px;">
                    👻
                  </div>
                  <div>
                    ${count}
                  </div>
                </div>
              `,

              iconSize:
                [62,62],

              iconAnchor:
                [31,31]

            });


          const marker =
            L.marker(
              [
                cluster.centerLat,
                cluster.centerLng
              ],
              {
                icon
              }
            );


          marker.on(
            "click",
            () => {

              openClusterViewer(
                cluster.snaps
              );

            }
          );


          markerLayer.addLayer(
            marker
          );

        }
      );

    }


    /* ============================================================
       FULL SCREEN CLUSTER VIEWER
    ============================================================ */

    function openClusterViewer(
      snaps
    ) {

      if (!snaps || !snaps.length)
        return;

      currentViewerSnaps =
        snaps;

      currentViewerIndex = 0;

      buildViewer();

      $("viewer")
        .classList.add("show");

      document.body.style.overflow =
        "hidden";

      history.pushState(
        {
          pastSnapViewer: true
        },
        ""
      );

    }


    function buildViewer() {

      const track =
        $("viewerTrack");

      track.innerHTML = "";

      currentViewerSnaps
        .forEach(
          (snap, index) => {

            const slide =
              document.createElement(
                "div"
              );

            slide.className =
              "viewerSlide";

            const media =
              document.createElement(
                snap.media_type === "video"
                  ? "video"
                  : "img"
              );

            media.className =
              "viewerMedia";

            media.src =
              snap.image_url;

            if (
              snap.media_type === "video"
            ) {

              media.controls = true;

              media.playsInline = true;

            }

            slide.appendChild(
              media
            );


            const info =
              document.createElement(
                "div"
              );

            info.className =
              "viewerInfo";


            const displayName =
              snap.profile?.display_name ||
              "Unknown user";

            const date =
              new Date(
                snap.created_at
              );


            info.innerHTML = `

              <div class="viewerName">
                👤 ${escapeHtml(displayName)}
              </div>

              <div class="viewerLocation">
                📍 ${escapeHtml(
                  snap.location_name ||
                  `${Number(snap.latitude).toFixed(5)}, ${Number(snap.longitude).toFixed(5)}`
                )}
              </div>

              <div class="viewerDate">
                🕒 ${formatDate(date)}
              </div>

              ${
                snap.description
                  ? `
                    <div class="viewerDescription">
                      ${escapeHtml(
                        snap.description
                      )}
                    </div>
                  `
                  : ""
              }

              <div class="viewerActions">

                <button
                  class="viewerActionBtn likeBtn"
                  data-id="${snap.id}"
                >
                  ❤️ <span class="likeCount">0</span>
                </button>

                <button
                  class="viewerActionBtn commentBtn"
                  data-id="${snap.id}"
                >
                  💬 <span class="commentCount">0</span>
                </button>

                <span
                  style="
                    color:#bbb;
                    font-size:12px;
                  "
                  class="viewCount"
                >
                  👁️ 0
                </span>

              </div>

            `;


            slide.appendChild(
              info
            );

            track.appendChild(
              slide
            );

          }
        );


      document
        .querySelectorAll(
          ".likeBtn"
        )
        .forEach(btn => {

          btn.addEventListener(
            "click",
            () => {

              likeSnap(
                Number(
                  btn.dataset.id
                )
              );

            }
          );

        });


      document
        .querySelectorAll(
          ".commentBtn"
        )
        .forEach(btn => {

          btn.addEventListener(
            "click",
            () => {

              openComments(
                Number(
                  btn.dataset.id
                )
              );

            }
          );

        });


      updateViewerCounter();

      loadViewerStats();

      setTimeout(() => {

        const first =
          track.children[0];

        if (first) {

          first.scrollIntoView({
            behavior: "instant",
            block: "nearest",
            inline: "start"
          });

        }

      }, 30);

    }


    /* ============================================================
       VIEWER SWIPE
    ============================================================ */

    $("viewerTrack")
      .addEventListener(
        "scroll",
        () => {

          const width =
            $("viewerTrack").clientWidth;

          if (!width) return;

          const index =
            Math.round(
              $("viewerTrack")
                .scrollLeft /
              width
            );

          if (
            index !==
            currentViewerIndex
          ) {

            currentViewerIndex =
              Math.max(
                0,
                Math.min(
                  index,
                  currentViewerSnaps.length - 1
                )
              );

            updateViewerCounter();

          }

        }
      );


    function updateViewerCounter() {

      $("viewerCounter").textContent =
        `${currentViewerIndex + 1} / ${currentViewerSnaps.length}`;

    }


    /* ============================================================
       CLOSE VIEWER
    ============================================================ */

    $("viewerCloseBtn").addEventListener(
      "click",
      closeViewer
    );


    function closeViewer(
      skipHistory = false
    ) {

      $("viewer")
        .classList.remove("show");

      $("commentsPanel")
        .classList.remove("show");

      document.body.style.overflow =
        "";

      currentViewerSnaps = [];

      currentViewerIndex = 0;

      if (
        !skipHistory &&
        history.state?.pastSnapViewer
      ) {

        history.back();

      }

    }


    /* ============================================================
       BROWSER BACK
    ============================================================ */

    window.addEventListener(
      "popstate",
      () => {

        if (
          $("viewer")
            .classList.contains("show")
        ) {

          closeViewer(true);

          return;

        }

        if (
          $("previewOverlay")
            .classList.contains("show")
        ) {

          $("exitOverlay")
            .classList.add("show");

        }

      }
    );


    /* ============================================================
       EXIT BUTTONS
    ============================================================ */

    $("editExitBtn").addEventListener(
      "click",
      () => {

        $("exitOverlay")
          .classList.remove("show");

      }
    );


    $("cancelExitBtn").addEventListener(
      "click",
      () => {

        $("exitOverlay")
          .classList.remove("show");

      }
    );


    /* ============================================================
       STATS
    ============================================================ */

    async function loadViewerStats() {

      for (
        const snap of currentViewerSnaps
      ) {

        try {

          const [
            likesResult,
            commentsResult,
            viewsResult
          ] =
            await Promise.all([

              supabaseClient
                .from("snap_likes")
                .select(
                  "id",
                  {
                    count:
                      "exact",
                    head: true
                  }
                )
                .eq(
                  "snap_id",
                  snap.id
                ),

              supabaseClient
                .from("snap_comments")
                .select(
                  "id",
                  {
                    count:
                      "exact",
                    head: true
                  }
                )
                .eq(
                  "snap_id",
                  snap.id
                ),

              supabaseClient
                .from("snap_views")
                .select(
                  "id",
                  {
                    count:
                      "exact",
                    head: true
                  }
                )
                .eq(
                  "snap_id",
                  snap.id
                )

            ]);


          const slide =
            [
              ...document
                .querySelectorAll(
                  ".viewerSlide"
                )
            ]
            [
              currentViewerSnaps
                .indexOf(snap)
            ];


          if (!slide)
            continue;


          const likeCount =
            slide.querySelector(
              ".likeCount"
            );

          const commentCount =
            slide.querySelector(
              ".commentCount"
            );

          const viewCount =
            slide.querySelector(
              ".viewCount"
            );


          if (likeCount) {

            likeCount.textContent =
              likesResult.count || 0;

          }

          if (commentCount) {

            commentCount.textContent =
              commentsResult.count || 0;

          }

          if (viewCount) {

            viewCount.textContent =
              "👁️ " +
              (viewsResult.count || 0);

          }


          if (
            currentUser
          ) {

            await recordView(
              snap.id
            );

          }

        } catch (error) {

          console.warn(error);

        }

      }

    }


    /* ============================================================
       RECORD VIEW
    ============================================================ */

    async function recordView(
      snapId
    ) {

      if (!currentUser)
        return;

      try {

        await supabaseClient
          .from("snap_views")
          .upsert(
            {
              snap_id:
                snapId,

              user_id:
                currentUser.id

            },
            {
              onConflict:
                "snap_id,user_id",
              ignoreDuplicates:
                true
            }
          );

      } catch (error) {

        console.warn(error);

      }

    }


    /* ============================================================
       LIKE
    ============================================================ */

    async function likeSnap(
      snapId
    ) {

      if (!currentUser) {

        toast("Like karne ke liye login karo.");

        openAuth("login");

        return;
      }

      try {

        const {
          data
        } =
          await supabaseClient
            .from("snap_likes")
            .select("id")
            .eq(
              "snap_id",
              snapId
            )
            .eq(
              "user_id",
              currentUser.id
            )
            .maybeSingle();


        if (data) {

          await supabaseClient
            .from("snap_likes")
            .delete()
            .eq(
              "id",
              data.id
            );

          toast("Like removed.");

        } else {

          const {
            error
          } =
            await supabaseClient
              .from("snap_likes")
              .insert({

                snap_id:
                  snapId,

                user_id:
                  currentUser.id

              });

          if (error)
            throw error;

          toast("❤️ Liked!");

        }


        refreshCurrentSnapStats(
          snapId
        );

      } catch (error) {

        console.error(error);

        toast(
          "Like update failed."
        );

      }

    }


    async function refreshCurrentSnapStats(
      snapId
    ) {

      const {
        count
      } =
        await supabaseClient
          .from("snap_likes")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "snap_id",
            snapId
          );


      document
        .querySelectorAll(
          `.likeBtn[data-id="${snapId}"] .likeCount`
        )
        .forEach(
          el =>
            el.textContent =
              count || 0
        );

    }


    /* ============================================================
       COMMENTS
    ============================================================ */

    async function openComments(
      snapId
    ) {

      if (!currentUser) {

        toast(
          "Comment karne ke liye login karo."
        );

        openAuth("login");

        return;

      }

      currentCommentSnapId =
        snapId;

      $("commentsPanel")
        .classList.add("show");

      await loadComments(
        snapId
      );

    }


    $("commentsCloseBtn")
      .addEventListener(
        "click",
        () => {

          $("commentsPanel")
            .classList.remove("show");

        }
      );


    async function loadComments(
      snapId
    ) {

      const list =
        $("commentsList");

      list.innerHTML =
        "<div style='color:#aaa'>Loading...</div>";


      const {
        data,
        error
      } =
        await supabaseClient
          .from("snap_comments")
          .select(`
            id,
            comment_text,
            created_at,
            user_id
          `)
          .eq(
            "snap_id",
            snapId
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(error);

        list.innerHTML =
          "<div style='color:#aaa'>Comments load failed.</div>";

        return;

      }


      if (!data?.length) {

        list.innerHTML =
          "<div style='color:#aaa'>No comments yet.</div>";

        return;

      }


      const userIds =
        [
          ...new Set(
            data.map(
              c => c.user_id
            )
          )
        ];


      const {
        data: profiles
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id,display_name"
          )
          .in(
            "id",
            userIds
          );


      const profileMap =
        {};

      (profiles || [])
        .forEach(
          p =>
            profileMap[p.id] =
              p.display_name
        );


      list.innerHTML =
        data
          .map(
            comment => `

              <div class="comment">

                <div class="commentName">
                  ${escapeHtml(
                    profileMap[
                      comment.user_id
                    ] ||
                    "User"
                  )}
                </div>

                <div class="commentText">
                  ${escapeHtml(
                    comment.comment_text
                  )}
                </div>

              </div>

            `
          )
          .join("");

    }


    $("commentSendBtn")
      .addEventListener(
        "click",
        sendComment
      );


    $("commentInput")
      .addEventListener(
        "keydown",
        e => {

          if (
            e.key === "Enter" &&
            !e.shiftKey
          ) {

            e.preventDefault();

            sendComment();

          }

        }
      );


    async function sendComment() {

      if (!currentUser) {

        toast("Login required.");

        return;
      }

      if (!currentCommentSnapId)
        return;

      const input =
        $("commentInput");

      const text =
        input.value.trim();

      if (!text) return;

      const words =
        text
          .split(/\s+/)
          .filter(Boolean);

      if (words.length > 250) {

        toast(
          "Comment max 250 words ka hai."
        );

        return;

      }

      if (text.length > 2000) {

        toast(
          "Comment bahut long hai."
        );

        return;

      }


      try {

        const {
          error
        } =
          await supabaseClient
            .from("snap_comments")
            .insert({

              snap_id:
                currentCommentSnapId,

              user_id:
                currentUser.id,

              comment_text:
                text

            });

        if (error)
          throw error;

        input.value = "";

        await loadComments(
          currentCommentSnapId
        );

        refreshCommentCount(
          currentCommentSnapId
        );

      } catch (error) {

        console.error(error);

        toast(
          "Comment send failed."
        );

      }

    }


    async function refreshCommentCount(
      snapId
    ) {

      const {
        count
      } =
        await supabaseClient
          .from("snap_comments")
          .select(
            "id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "snap_id",
            snapId
          );


      document
        .querySelectorAll(
          `.commentBtn[data-id="${snapId}"] .commentCount`
        )
        .forEach(
          el =>
            el.textContent =
              count || 0
        );

    }


    /* ============================================================
       NOTIFICATIONS
    ============================================================ */

    async function checkNotifications() {

      if (!currentUser)
        return;

      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("notifications")
            .select(
              "id,message,created_at"
            )
            .eq(
              "recipient_id",
              currentUser.id
            )
            .eq(
              "is_read",
              false
            )
            .order(
              "created_at",
              {
                ascending: false
              }
            )
            .limit(5);

        if (error)
          throw error;

        if (data?.length) {

          toast(
            "🔔 " +
            data[0].message
          );

          const ids =
            data.map(
              n => n.id
            );

          await supabaseClient
            .from("notifications")
            .update({
              is_read: true
            })
            .in(
              "id",
              ids
            );

        }

      } catch (error) {

        console.warn(error);

      }

    }


    /* ============================================================
       ESCAPE HTML
    ============================================================ */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* ============================================================
       DATE FORMAT
    ============================================================ */

    function formatDate(
      date
    ) {

      return date.toLocaleString(
        "en-IN",
        {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* ============================================================
       SUPABASE AUTH LISTENER
    ============================================================ */

    supabaseClient.auth
      .onAuthStateChange(
        async (
          event,
          session
        ) => {

          currentUser =
            session
              ? session.user
              : null;

          if (currentUser) {

            setTimeout(
              async () => {

                await loadProfile();

                updateAuthUI();

              },
              0
            );

          } else {

            currentProfile = null;

            updateAuthUI();

          }

        }
      );


    /* ============================================================
       CLOSE USER PANEL WHEN MAP CLICKED
    ============================================================ */

    map?.on(
      "click",
      () => {

        $("userPanel")
          .classList.remove("show");

      }
    );


    /* ============================================================
       INITIALIZATION
    ============================================================ */

    async function init() {

      initMap();

      await refreshAuth();

      await loadSnaps();

      if (currentUser) {

        await checkNotifications();

      }

    }


    init();


    /* ============================================================
       PERIODIC REFRESH
    ============================================================ */

    setInterval(
      async () => {

        await loadSnaps();

        if (currentUser) {

          await checkNotifications();

        }

      },
      30000
    );

  </script>

</body>
