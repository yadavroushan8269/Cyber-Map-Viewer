#cameraModal{

/*
  IMPORTANT:

  Filter is applied directly to the VIDEO

  This works for BOTH:
  front camera
  AND
  back camera.
*/

#cameraVideo{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  Front camera preview mirror only.

#lensBar::-webkit-scrollbar{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   MAP
===================================================== */

const map =
  L.map("map").setView(
    [20.5937,78.9629],
    5
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


/* =====================================================
   VARIABLES
===================================================== */

let userLat = null;
let userLng = null;

let locationMarker = null;

let cameraStream = null;

let currentFacingMode = "user";

/*
  Existing 10-filter selection
*/
let currentFilter = "none";

/*
  New 6-lens selection
*/
let currentLens = "normal";

let capturedBlob = null;

let capturedDataUrl = null;

let allSnapMarkers = [];


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent = text;

  box.style.display = "block";

  setTimeout(
    () => {
      box.style.display = "none";
    },
    3000
  );

}


/* =====================================================
   LOCATION
===================================================== */

function getMyLocation(
  centerMap = true
){

  if(
    !navigator.geolocation
  ){

    showMessage(
      "Location supported nahi hai."
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      userLat =
        position.coords.latitude;

      userLng =
        position.coords.longitude;


      if(locationMarker){

        map.removeLayer(
          locationMarker
        );

      }


      locationMarker =
        L.circleMarker(
          [
            userLat,
            userLng
          ],
          {
            radius:9,
            color:"#fff",
            weight:3,
            fillColor:"#2196f3",
            fillOpacity:1
          }
        ).addTo(map);


      locationMarker.bindPopup(
        "📍 You are here"
      );


      if(centerMap){

        map.setView(
          [
            userLat,
            userLng
          ],
          17
        );

      }

    },

    error => {

      console.log(error);

      showMessage(
        "Location permission allow karo."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:10000
    }

  );

}


document
  .getElementById("locationBtn")
  .addEventListener(
    "click",
    () => getMyLocation(true)
  );


/* =====================================================
   LOAD SNAPS
===================================================== */

async function loadSnaps(){

  try{

    const bounds =
      map.getBounds();


    const south =
      bounds.getSouth();

    const north =
      bounds.getNorth();

    const west =
      bounds.getWest();

    const east =
      bounds.getEast();


    const {
      data,
      error
    } =
      await supabaseClient
        .from("snaps")
        .select("*")
        .gte("latitude",south)
        .lte("latitude",north)
        .gte("longitude",west)
        .lte("longitude",east)
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      console.error(error);

      return;

    }


    allSnapMarkers.forEach(
      marker => {

        map.removeLayer(
          marker
        );

      }
    );


    allSnapMarkers = [];


    const groups = [];


    data.forEach(
      snap => {

        let group =
          groups.find(
            g =>
              distanceMeters(
                g.latitude,
                g.longitude,
                snap.latitude,
                snap.longitude
              ) < 15
          );


        if(!group){

          group = {

            latitude:
              snap.latitude,

            longitude:
              snap.longitude,

            snaps:[]

          };


          groups.push(group);

        }


        group.snaps.push(
          snap
        );

      }
    );


    groups.forEach(
      group => {

        const count =
          group.snaps.length;


        const icon =
          L.divIcon({

            className:"",

            html:`
              <div style="
                width:58px;
                height:58px;
                border-radius:50%;
                background:#111;
                border:3px solid white;
                box-shadow:0 4px 15px rgba(0,0,0,.45);
                display:flex;
                align-items:center;
                justify-content:center;
                color:white;
                font-size:13px;
                font-weight:800;
              ">
                ${count} 👻
              </div>
            `,

            iconSize:[
              58,
              58
            ],

            iconAnchor:[
              29,
              29
            ]

          });


        const marker =
          L.marker(
            [
              group.latitude,
              group.longitude
            ],
            {
              icon
            }
          ).addTo(map);


        marker.on(
          "click",
          () => {

            openGallery(
              group.snaps,
              count
            );

          }
        );


        allSnapMarkers.push(
          marker
        );

      }
    );

  }catch(error){

    console.error(error);

  }

}


map.on(
  "moveend",
  loadSnaps
);

loadSnaps();


/* =====================================================
   SEARCH
===================================================== */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const searchResults =
  document.getElementById(
    "searchResults"
  );


async function searchPlace(){

  const query =
    searchInput.value.trim();


  if(!query){

    return;

  }


  searchResults.innerHTML =
    "Searching...";

  searchResults.style.display =
    "block";


  try{

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search?" +
        new URLSearchParams({

          q:query,

          format:"json",

          limit:"5"

        })
      );


    const results =
      await response.json();


    searchResults.innerHTML =
      "";


    if(!results.length){

      searchResults.innerHTML =
        "<div class='searchItem'>No place found.</div>";

      return;

    }


    results.forEach(
      result => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "searchItem";


        item.textContent =
          result.display_name;


        item.addEventListener(
          "click",
          () => {

            map.setView(
              [
                Number(result.lat),
                Number(result.lon)
              ],
              15
            );


            searchInput.value =
              result.display_name;


            searchResults.style.display =
              "none";

          }
        );


        searchResults.appendChild(
          item
        );

      }
    );

  }catch(error){

    console.error(error);

    searchResults.innerHTML =
      "<div class='searchItem'>Search failed.</div>";

  }

}


document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    searchPlace
  );


searchInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      searchPlace();

    }

  }
);


/* =====================================================
   DISTANCE
===================================================== */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const dLat =
    (lat2-lat1) *
    Math.PI / 180;

  const dLon =
    (lon2-lon1) *
    Math.PI / 180;


  const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(
      lat1 * Math.PI / 180
    ) *

    Math.cos(
      lat2 * Math.PI / 180
    ) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* =====================================================
   CAMERA
===================================================== */

async function openCamera(){

  try{

    /*
      Stop previous camera.
    */

    if(cameraStream){

      cameraStream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

      cameraStream = null;

    }


    /*
      Open selected camera.
    */

    cameraStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video:{
            facingMode:
              currentFacingMode,

            width:{
              ideal:1280
            },

            height:{
              ideal:1920
            }
          },

          audio:false

        });


    cameraVideo.srcObject =
      cameraStream;


    /*
      Front camera:
      mirror only the preview.
    */

    if(
      currentFacingMode === "user"
    ){

      cameraVideo.classList.add(
        "selfie-preview"
      );

    }else{

      cameraVideo.classList.remove(
        "selfie-preview"
      );

    }


    await cameraVideo.play();


    /*
      VERY IMPORTANT:

      Every time camera opens,
      apply BOTH selected filter
      and selected lens.

      Therefore front + back both work.
    */

    applyCameraEffects();


    cameraModal.style.display =
      "block";

  }catch(error){

    console.error(error);

    showMessage(
      "Camera permission allow karo."
    );

  }

}


/* =====================================================
   CAMERA ELEMENTS
===================================================== */

const cameraModal =
  document.getElementById(
    "cameraModal"
  );

const cameraVideo =
  document.getElementById(
    "cameraVideo"
  );


/* =====================================================
   ADD SNAP
===================================================== */

document
  .getElementById(
    "addSnapBtn"
  )
  .addEventListener(
    "click",
    () => {

      getMyLocation(false);

      openCamera();

    }
  );


/* =====================================================
   CLOSE CAMERA
===================================================== */

function closeCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    cameraStream = null;

  }


  cameraVideo.srcObject =
    null;


  cameraModal.style.display =
    "none";

}


document
  .getElementById(
    "closeCameraBtn"
  )
  .addEventListener(
    "click",
    closeCamera
  );


/* =====================================================
   SWITCH CAMERA
===================================================== */

document
  .getElementById(
    "switchCameraBtn"
  )
  .addEventListener(
    "click",
    async () => {

      currentFacingMode =
        currentFacingMode === "user"
          ? "environment"
          : "user";


      /*
        openCamera() automatically
        reapplies current effects.
      */

      await openCamera();

    }
  );


/* =====================================================
   EXISTING 10 FILTER CSS
===================================================== */

/*
  IMPORTANT:

  return and string are on SAME LINE.
  This fixes the previous filter bug.
*/

function filterToCss(
  filter
){

  switch(filter){

    case "vintage":
      return "sepia(.7) contrast(1.1) saturate(.8)";

    case "bw":
      return "grayscale(1)";

    case "warm":
      return "sepia(.25) saturate(1.35)";

    case "cool":
      return "saturate(.9) hue-rotate(15deg)";

    case "glow":
      return "brightness(1.1) saturate(1.2)";

    case "night":
      return "brightness(.65) contrast(1.25) saturate(1.2)";

    case "pop":
      return "saturate(1.8) contrast(1.15)";

    case "dream":
      return "brightness(1.08) contrast(.9) saturate(1.2)";

    case "sunset":
      return "sepia(.25) saturate(1.5) hue-rotate(-10deg)";

    case "none":
    default:
      return "none";

  }

}


/* =====================================================
   NEW 6 LENS CSS
===================================================== */

function lensToCss(
  lens
){

  switch(lens){

    case "warm":
      return "sepia(.2) saturate(1.55) brightness(1.06) contrast(1.03)";

    case "vintage":
      return "sepia(.55) contrast(1.12) saturate(.82)";

    case "glow":
      return "brightness(1.15) contrast(.9) saturate(1.3)";

    case "cool":
      return "saturate(1.05) hue-rotate(18deg) brightness(1.04)";

    case "bw":
      return "grayscale(1) contrast(1.12)";

    case "normal":
    default:
      return "none";

  }

}


/* =====================================================
   COMBINE ALL EFFECTS
===================================================== */

function getCombinedFilter(){

  const filter =
    filterToCss(
      currentFilter
    );

  const lens =
    lensToCss(
      currentLens
    );


  if(
    filter !== "none" &&
    lens !== "none"
  ){

    return (
      filter +
      " " +
      lens
    );

  }


  if(
    filter !== "none"
  ){

    return filter;

  }


  if(
    lens !== "none"
  ){

    return lens;

  }


  return "none";

}


/* =====================================================
   APPLY TO LIVE CAMERA
===================================================== */

function applyCameraEffects(){

  if(!cameraVideo){

    return;

  }


  const combined =
    getCombinedFilter();


  /*
    CSS filter applies directly
    to the actual video element.

    Works on:
    FRONT CAMERA
    BACK CAMERA
  */

  cameraVideo.style.setProperty(
    "--camera-filter",
    combined
  );

}


/* =====================================================
   OLD 10 FILTER BUTTONS
===================================================== */

document
  .querySelectorAll(
    ".oldFilterBtn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".oldFilterBtn"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter;


          /*
            Apply immediately.
          */

          applyCameraEffects();

        }
      );

    }
  );


/* =====================================================
   NEW 6 LENSES
===================================================== */

document
  .querySelectorAll(
    ".lensBtn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".lensBtn"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentLens =
            button.dataset.lens;


          /*
            Apply immediately to
            currently active camera.
          */

          applyCameraEffects();


          /*
            Bring selected lens
            into center.
          */

          button.scrollIntoView({
            behavior:"smooth",
            block:"nearest",
            inline:"center"
          });

        }
      );

    }
  );


/* =====================================================
   CAPTURE
===================================================== */

document
  .getElementById(
    "captureBtn"
  )
  .addEventListener(
    "click",
    capturePhoto
  );


function capturePhoto(){

  if(
    !cameraStream ||
    !cameraVideo.videoWidth
  ){

    showMessage(
      "Camera ready nahi hai."
    );

    return;

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  const width =
    cameraVideo.videoWidth;

  const height =
    cameraVideo.videoHeight;


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
    IMPORTANT:

    CSS filter on video is NOT automatically
    included when drawImage() is used.

    So we explicitly put the SAME combined
    filter on the canvas.
  */

  ctx.filter =
    getCombinedFilter();


  /*
    Draw actual camera pixels.

    Do NOT mirror here.

    Therefore:
    front preview = mirrored
    saved photo = normal
  */

  ctx.drawImage(
    cameraVideo,
    0,
    0,
    width,
    height
  );


  capturedDataUrl =
    canvas.toDataURL(
      "image/jpeg",
      .88
    );


  capturedBlob =
    dataUrlToBlob(
      capturedDataUrl
    );


  document
    .getElementById(
      "previewImage"
    )
    .src =
      capturedDataUrl;


  cameraModal.style.display =
    "none";


  document
    .getElementById(
      "previewModal"
    )
    .style.display =
      "block";

}


/* =====================================================
   DATA URL TO BLOB
===================================================== */

function dataUrlToBlob(
  dataUrl
){

  const parts =
    dataUrl.split(",");


  const mime =
    parts[0].match(
      /:(.*?);/
    )[1];


  const binary =
    atob(parts[1]);


  const array =
    new Uint8Array(
      binary.length
    );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    array[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [array],
    {
      type:mime
    }
  );

}

/* =====================================================
   UPLOAD SNAP
===================================================== */

document
  .getElementById(
    "postBtn"
  )
  .addEventListener(
    "click",
    uploadSnap
  );


async function uploadSnap(){

  if(
    userLat === null ||
    userLng === null
  ){

    showMessage(
      "Pehle My Location allow karo."
    );

    getMyLocation(true);

    return;

  }


  if(!capturedBlob){

    showMessage(
      "Photo nahi mili."
    );

    return;

  }


  const loading =
    document.getElementById(
      "loading"
    );


  loading.style.display =
    "flex";


  try{

    const fileName =
      Date.now() +
      "-" +
      crypto.randomUUID() +
      ".jpg";


    const {
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from("past-snaps")
        .upload(
          fileName,
          capturedBlob,
          {
            contentType:"image/jpeg",
            upsert:false
          }
        );


    if(uploadError){

      throw uploadError;

    }


    const {
      data:urlData
    } =
      supabaseClient
        .storage
        .from("past-snaps")
        .getPublicUrl(
          fileName
        );


    const imageUrl =
      urlData.publicUrl;


    const {
      error:insertError
    } =
      await supabaseClient
        .from("snaps")
        .insert({

          latitude:userLat,

          longitude:userLng,

          image_url:imageUrl

        });


    if(insertError){

      throw insertError;

    }


    loading.style.display =
      "none";


    document
      .getElementById(
        "previewModal"
      )
      .style.display =
        "none";


    capturedBlob = null;
    capturedDataUrl = null;


    showMessage(
      "📍 Snap posted successfully!"
    );


    await loadSnaps();


  }catch(error){

    console.error(error);


    loading.style.display =
      "none";


    showMessage(
      "Upload failed: " +
      error.message
    );

  }

}


/* =====================================================
   GALLERY
===================================================== */

function openGallery(
  snaps,
  count
){

  const modal =
    document.getElementById(
      "galleryModal"
    );


  const grid =
    document.getElementById(
      "galleryGrid"
    );


  const title =
    document.getElementById(
      "galleryTitle"
    );


  title.textContent =
    `${count} 👻 Snaps`;


  grid.innerHTML =
    "";


  snaps.forEach(
    snap => {

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "galleryImg";


      img.loading =
        "lazy";


      img.src =
        snap.image_url;


      img.onclick =
        () => {

          window.open(
            snap.image_url,
            "_blank"
          );

        };


      grid.appendChild(
        img
      );

    }
  );


  modal.style.display =
    "block";

}


document
  .getElementById(
    "closeGalleryBtn"
  )
  .addEventListener(
    "click",
    () => {

      document
        .getElementById(
          "galleryModal"
        )
        .style.display =
          "none";

    }
  );


/* =====================================================

getMyLocation(false);
