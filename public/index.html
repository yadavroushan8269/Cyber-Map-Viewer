<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Past Snap</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 font-family:Arial,sans-serif;
 background:#111;color:#fff;overflow:hidden
}
button,input,textarea{font:inherit}
button{cursor:pointer}

#app,#map{width:100%;height:100%}
#app{position:relative}
#map{position:absolute;inset:0;z-index:1}

#topBar{
 position:absolute;z-index:1000;
 top:10px;left:10px;right:10px;
 display:flex;gap:6px;
 background:rgba(0,0,0,.75);
 padding:7px;border-radius:14px
}
#searchInput{
 flex:1;min-width:0;border:0;border-radius:9px;
 padding:10px;outline:none
}
#searchBtn,#accountBtn,#notificationBtn{
 border:0;border-radius:9px;
 background:#fff;color:#111;
 padding:9px 11px;font-weight:bold
}
#notificationBtn{position:relative}
#notificationCount{
 position:absolute;top:-6px;right:-5px;
 background:#e33;color:#fff;border-radius:10px;
 min-width:17px;font-size:10px;padding:2px 4px;
 display:none
}

#locBtn{
 position:absolute;z-index:1000;
 bottom:20px;left:50%;
 transform:translateX(-50%);
 border:0;border-radius:12px;
 background:#fff;color:#111;
 padding:12px 17px;font-weight:bold
}

#status{
 position:absolute;z-index:12000;
 top:70px;left:50%;
 transform:translateX(-50%);
 background:rgba(0,0,0,.92);
 padding:8px 13px;border-radius:20px;
 font-size:13px;display:none;
 max-width:90%;text-align:center
}

/* ================= AUTH ================= */

#authModal{
 display:none;position:absolute;inset:0;z-index:7000;
 background:rgba(0,0,0,.82);
 align-items:center;justify-content:center;padding:20px
}
#authBox{
 width:min(94%,390px);background:#181818;
 border-radius:20px;padding:22px;
 box-shadow:0 20px 70px #000
}
#authBox h2{margin:0 0 6px}
#authBox p{color:#aaa;font-size:13px}
.authInput{
 width:100%;margin:7px 0;border:1px solid #444;
 background:#222;color:#fff;border-radius:10px;
 padding:12px;outline:none
}
.authMainBtn{
 width:100%;border:0;background:#fff;color:#111;
 padding:12px;border-radius:10px;font-weight:bold;margin-top:8px
}
.authSwitch{
 border:0;background:transparent;color:#fff;
 margin-top:12px;width:100%;padding:7px
}
#authClose{
 float:right;border:0;background:#333;color:#fff;
 width:35px;height:35px;border-radius:50%
}

/* ================= CALL PANEL ================= */

#callPanel{
 display:none;
 position:absolute;
 z-index:2000;
 top:68px;
 right:10px;
 width:min(90%,300px);
 background:rgba(15,15,15,.96);
 border:1px solid #333;
 border-radius:15px;
 padding:11px;
 box-shadow:0 12px 40px #000
}
.callPanelTitle{
 font-size:12px;
 color:#aaa;
 margin-bottom:6px
}
.myCallIdRow{
 display:flex;
 gap:6px;
 align-items:center
}
#myCallId{
 flex:1;
 background:#222;
 border:1px solid #444;
 border-radius:9px;
 padding:9px;
 font-weight:bold;
 letter-spacing:2px;
 text-align:center
}
#copyCallIdBtn{
 border:0;
 border-radius:9px;
 padding:9px 11px;
 background:#fff;
 color:#111;
 font-weight:bold
}
#targetCallId{
 width:100%;
 margin-top:7px;
 border:1px solid #444;
 background:#222;
 color:#fff;
 border-radius:9px;
 padding:10px;
 outline:none;
 text-transform:uppercase
}
#callUserBtn{
 width:100%;
 margin-top:7px;
 border:0;
 border-radius:9px;
 padding:10px;
 background:#fff;
 color:#111;
 font-weight:bold
}
#callHint{
 color:#777;
 font-size:10px;
 margin-top:6px;
 line-height:1.4
}

/* ================= NOTIFICATIONS ================= */

#notificationPanel{
 display:none;position:absolute;z-index:6500;
 top:65px;right:10px;width:min(94%,360px);
 max-height:70vh;overflow:auto;background:#181818;
 border-radius:15px;box-shadow:0 15px 50px #000
}
#notificationHeader{
 padding:13px;font-weight:bold;border-bottom:1px solid #333
}
.notificationItem{
 padding:12px;border-bottom:1px solid #333;font-size:13px
}
.notificationItem.unread{background:#222}
.notificationItem.clickable{cursor:pointer}
.notificationItem.clickable:active{background:#333}
.notificationTime{color:#888;font-size:11px;margin-top:4px}

/* ================= MODALS ================= */

.modal{
 display:none;position:absolute;inset:0;z-index:3000;
 background:#000;flex-direction:column
}

/* ================= CAMERA ================= */

#cameraVideo{
 width:100%;height:100%;object-fit:cover;background:#000
}
#cameraVideo.mirror-preview{transform:scaleX(-1)}
#cameraTop{
 position:absolute;top:10px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:10px;z-index:10
}
#cameraTop button{
 border:0;background:rgba(0,0,0,.65);color:#fff;
 border-radius:50%;width:46px;height:46px;font-size:20px
}
#cameraCanvas{display:none}
#modeBar{
 position:absolute;bottom:152px;left:50%;
 transform:translateX(-50%);z-index:10;
 display:flex;background:rgba(0,0,0,.65);
 border-radius:20px;padding:4px
}
#modeBar button{
 border:0;background:transparent;color:#aaa;
 padding:8px 14px;border-radius:17px;font-weight:bold
}
#modeBar button.active{background:#fff;color:#111}
#zoomBox{
 position:absolute;right:8px;top:50%;
 transform:translateY(-50%);z-index:10;
 background:rgba(0,0,0,.6);border-radius:18px;
 padding:8px 5px;display:flex;flex-direction:column;
 align-items:center;gap:5px
}
#zoomRange{
 writing-mode:vertical-lr;direction:rtl;
 width:30px;height:170px
}
#zoomValue{font-size:12px;font-weight:bold}
#filterBar{
 position:absolute;bottom:91px;left:0;right:0;z-index:10;
 display:flex;gap:7px;overflow-x:auto;
 padding:7px 10px;scrollbar-width:none
}
#filterBar::-webkit-scrollbar{display:none}
.filterBtn{
 flex:0 0 auto;border:0;background:rgba(0,0,0,.62);
 color:#fff;padding:8px 12px;border-radius:17px;font-size:12px
}
.filterBtn.active{background:#fff;color:#111}
#cameraBottom{
 position:absolute;bottom:15px;left:0;right:0;z-index:10;
 display:flex;justify-content:center;align-items:center;gap:28px
}
#mirrorBtn{
 border:0;background:rgba(0,0,0,.65);color:#fff;
 border-radius:20px;padding:10px 14px
}
#mirrorBtn.active{background:#fff;color:#111}
#captureBtn{
 width:70px;height:70px;border-radius:50%;
 border:6px solid #fff;background:#fff
}
#captureBtn.recording{background:#e33;border-radius:18px}
#recordTimer{
 position:absolute;bottom:83px;left:50%;
 transform:translateX(-50%);z-index:11;
 background:rgba(0,0,0,.7);padding:6px 12px;
 border-radius:16px;display:none;font-weight:bold
}

/* ================= PREVIEW ================= */

#previewModal{background:#111}
#previewMediaBox{
 flex:1;display:flex;align-items:center;
 justify-content:center;min-height:0
}
#previewImage,#previewVideo{
 max-width:100%;max-height:100%;object-fit:contain
}
#previewInfo{
 padding:10px;text-align:center;font-size:13px;background:#181818
}
#descriptionInput{
 width:calc(100% - 20px);
 margin:8px 10px;
 min-height:55px;
 resize:none;
 border:1px solid #444;
 background:#222;color:#fff;
 border-radius:9px;
 padding:9px;
 outline:none
}
#previewBottom{display:flex;gap:10px;padding:12px}
#previewBottom button{
 flex:1;border:0;border-radius:12px;
 padding:13px;font-weight:bold
}
#cancelPreviewBtn{background:#333;color:#fff}
#postBtn{background:#fff;color:#111}
#postBtn:disabled{opacity:.5}
#qualityBox{
 display:flex;gap:6px;justify-content:center;
 padding:8px;background:#181818
}
.qualityBtn{
 border:0;background:#333;color:#fff;
 border-radius:9px;padding:7px 12px
}
.qualityBtn.active{background:#fff;color:#111}

/* ================= UPLOAD ================= */

#uploadBox{
 display:none;position:absolute;z-index:8000;
 left:50%;top:50%;transform:translate(-50%,-50%);
 width:min(90%,360px);background:#181818;
 border-radius:16px;padding:20px;box-shadow:0 10px 50px #000
}
#uploadTitle{font-weight:bold;font-size:18px}
#uploadText{margin-top:8px;color:#aaa;font-size:13px}
#uploadTrack{
 height:10px;background:#333;border-radius:10px;
 overflow:hidden;margin-top:18px
}
#uploadBar{height:100%;width:0;background:#fff}
#uploadPercent{text-align:center;margin-top:8px;font-weight:bold}

/* ================= VIEWER ================= */

#galleryTop{
 display:flex;justify-content:space-between;
 align-items:center;padding:12px
}
#galleryImageBox{
 flex:1;position:relative;display:flex;
 align-items:center;justify-content:center;
 min-height:0;touch-action:pan-y
}
#galleryImage,#galleryVideo{
 max-width:100%;max-height:100%;object-fit:contain
}
#galleryDetails{
 position:absolute;z-index:5;left:10px;right:10px;bottom:10px;
 background:rgba(0,0,0,.82);padding:11px;
 border-radius:13px;font-size:12px;line-height:1.55;
 max-height:34%;overflow:auto;
 padding-bottom:15px
}
#likeUsers{
 margin-top:7px;
 color:#bbb;
 font-size:11px;
 line-height:1.4
}
#closeGalleryBtn{
 border:0;background:#333;color:#fff;border-radius:50%;
 width:42px;height:42px;font-size:20px
}
#socialBox{
 position:absolute;z-index:8;right:12px;bottom:95px;
 display:flex;flex-direction:column;gap:9px
}
.socialBtn{
 border:0;background:rgba(0,0,0,.72);color:#fff;
 border-radius:20px;padding:8px 10px;font-size:13px
}
.socialBtn.liked{background:#e53935}

#commentBox{
 display:none;position:absolute;z-index:20;
 left:10px;right:10px;bottom:10px;
 background:#181818;border-radius:15px;padding:10px
}
#commentInput{
 width:100%;min-height:55px;resize:none;
 border:1px solid #444;background:#222;color:#fff;
 border-radius:9px;padding:9px;outline:none
}
#commentActions{display:flex;gap:7px;margin-top:7px}
#commentActions button{
 flex:1;border:0;padding:9px;border-radius:9px
}
#sendCommentBtn{background:#fff;color:#111}
#cancelCommentBtn{background:#333;color:#fff}

#commentsList{
 position:absolute;z-index:15;left:10px;right:10px;bottom:72px;
 max-height:45%;overflow:auto;display:none;
 background:rgba(20,20,20,.96);border-radius:13px;padding:10px
}
.commentRow{
 padding:8px 2px;border-bottom:1px solid #333;
 font-size:12px
}
.commentUser{font-weight:bold;color:#fff}
.commentText{
 margin-top:3px;
 line-height:1.4;
 word-break:break-word
}
.commentTime{font-size:10px;color:#888;margin-top:3px}
.commentActions{
 margin-top:5px;
 display:flex;
 gap:8px
}
.replyBtn{
 border:0;
 background:transparent;
 color:#aaa;
 padding:2px 0;
 font-size:11px
}
.replyBtn:hover{color:#fff}
.replyLabel{
 color:#888;
 font-size:10px;
 margin-bottom:3px
}

/* ================= CALL ================= */

#callOverlay{
 display:none;
 position:absolute;inset:0;
 z-index:10000;
 background:rgba(0,0,0,.94);
 align-items:center;
 justify-content:center;
 text-align:center;
 padding:25px
}
#callBox{
 width:min(92%,380px);
 background:#181818;
 border-radius:22px;
 padding:25px;
 box-shadow:0 20px 80px #000
}
#callAvatar{
 width:75px;height:75px;
 margin:auto;
 border-radius:50%;
 background:#333;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:35px
}
#callerText{
 margin:15px 0 20px;
 font-size:18px;
 font-weight:bold
}
.callActions{
 display:flex;
 gap:10px
}
.callActions button{
 flex:1;
 border:0;
 border-radius:12px;
 padding:13px;
 font-weight:bold
}
#acceptCallBtn{background:#2eaf5d;color:#fff}
#rejectCallBtn{background:#d83a3a;color:#fff}

#activeCall{
 display:none;
 position:absolute;
 inset:0;
 z-index:9500;
 background:#000
}
#remoteVideo{
 width:100%;height:100%;
 object-fit:cover;
 background:#111
}
#localVideo{
 position:absolute;
 z-index:3;
 right:12px;
 top:65px;
 width:105px;
 height:145px;
 object-fit:cover;
 border-radius:12px;
 border:2px solid #fff;
 background:#222
}
#callTopBar{
 position:absolute;
 top:10px;left:10px;right:10px;
 z-index:5;
 display:flex;
 justify-content:space-between
}
#callStatus{
 background:rgba(0,0,0,.7);
 padding:9px 13px;
 border-radius:18px;
 font-size:13px
}
#callControls{
 position:absolute;
 bottom:25px;
 left:0;right:0;
 z-index:5;
 display:flex;
 justify-content:center;
 gap:12px
}
.callControl{
 width:52px;height:52px;
 border:0;
 border-radius:50%;
 background:rgba(255,255,255,.18);
 color:#fff;
 font-size:20px
}
#endCallBtn{background:#d83a3a}

/* ================= GHOST ================= */

.markerGhost{
 width:40px;height:40px;border-radius:50%;
 background:#fff;color:#111;display:flex;
 align-items:center;justify-content:center;font-size:20px;
 border:3px solid #111;position:relative
}
.markerGhost span{
 position:absolute;right:-8px;top:-8px;
 background:#111;color:#fff;border-radius:10px;
 min-width:18px;text-align:center;font-size:10px;padding:2px
}
.leaflet-control-attribution{font-size:9px}
</style>
</head>

<body>

<div id="app">

<div id="map"></div>

<div id="topBar">
 <input id="searchInput" placeholder="🔍 Search any location">
 <button id="searchBtn">Search</button>
 <button id="notificationBtn">
  🔔
  <span id="notificationCount"></span>
 </button>
 <button id="accountBtn">Login</button>
</div>

<!-- PERMANENT CALL ID PANEL -->
<div id="callPanel">
 <div class="callPanelTitle">📞 My Permanent Call ID</div>

 <div class="myCallIdRow">
  <span id="myCallId">------</span>
  <button id="copyCallIdBtn">Copy</button>
 </div>

 <input
  id="targetCallId"
  placeholder="Dusre user ka Call ID"
  autocomplete="off"
  maxlength="6"
 >

 <button id="callUserBtn">📞 Call User</button>

 <div id="callHint">
  Apna Call ID share karke doosra user tumhe call kar sakta hai.
 </div>
</div>

<button id="locBtn">📍 My Location</button>

<div id="status"></div>

<!-- AUTH -->
<div id="authModal">
 <div id="authBox">

  <button id="authClose">✕</button>

  <h2 id="authTitle">Register</h2>

  <p id="authSubtitle">
   Register to post and interact with snaps.
  </p>

  <input
   id="authName"
   class="authInput"
   placeholder="Display Name"
  >

  <input
   id="authEmail"
   class="authInput"
   type="email"
   placeholder="Email"
  >

  <input
   id="authPassword"
   class="authInput"
   type="password"
   placeholder="Password"
  >

  <button id="authMainBtn" class="authMainBtn">
   Register
  </button>

  <button id="authSwitch" class="authSwitch">
   Already have an account? Login
  </button>

 </div>
</div>

<!-- NOTIFICATIONS -->
<div id="notificationPanel">

 <div id="notificationHeader">
  Notifications
 </div>

 <div id="notificationList"></div>

</div>

<!-- CAMERA -->
<div id="cameraModal" class="modal">

 <video
  id="cameraVideo"
  autoplay
  playsinline
  muted
 ></video>

 <canvas id="cameraCanvas"></canvas>

 <div id="cameraTop">
  <button id="closeCameraBtn">✕</button>
  <button id="switchCameraBtn">🔄</button>
 </div>

 <div id="zoomBox">
  <div id="zoomValue">1×</div>
  <input
   id="zoomRange"
   type="range"
   min="0.5"
   max="20"
   step="0.1"
   value="1"
  >
 </div>

 <div id="modeBar">
  <button id="photoModeBtn" class="active">
   📷 Photo
  </button>

  <button id="videoModeBtn">
   🎥 Video
  </button>
 </div>

 <div id="filterBar">

  <button class="filterBtn active" data-filter="none">
   Normal
  </button>

  <button class="filterBtn" data-filter="vintage">
   Vintage
  </button>

  <button class="filterBtn" data-filter="bw">
   B&W
  </button>

  <button class="filterBtn" data-filter="warm">
   Warm
  </button>

  <button class="filterBtn" data-filter="cool">
   Cool
  </button>

  <button class="filterBtn" data-filter="glow">
   Glow
  </button>

  <button class="filterBtn" data-filter="night">
   Night
  </button>

  <button class="filterBtn" data-filter="pop">
   Color Pop
  </button>

  <button class="filterBtn" data-filter="dream">
   Dream
  </button>

  <button class="filterBtn" data-filter="sunset">
   Sunset
  </button>

 </div>

 <div id="recordTimer">00:00</div>

 <div id="cameraBottom">

  <button id="mirrorBtn">
   🪞 Mirror
  </button>

  <button id="captureBtn"></button>

 </div>

</div>

<!-- PREVIEW -->
<div id="previewModal" class="modal">

 <div id="previewMediaBox">

  <img
   id="previewImage"
   style="display:none"
  >

  <video
   id="previewVideo"
   style="display:none"
   controls
   playsinline
  ></video>

 </div>

 <div id="qualityBox">

  <button class="qualityBtn active" data-quality="480">
   480p
  </button>

  <button class="qualityBtn" data-quality="720">
   720p
  </button>

  <button class="qualityBtn" data-quality="1080">
   1080p
  </button>

 </div>

 <textarea
  id="descriptionInput"
  maxlength="2000"
  placeholder="Description likho (optional)..."
 ></textarea>

 <div id="previewInfo">
  Ready
 </div>

 <div id="previewBottom">

  <button id="cancelPreviewBtn">
   Retake
  </button>

  <button id="postBtn">
   📍 Post Snap
  </button>

 </div>

</div>

<!-- UPLOAD -->
<div id="uploadBox">

 <div id="uploadTitle">
  📤 Uploading Snap
 </div>

 <div id="uploadText">
  Please wait...
 </div>

 <div id="uploadTrack">
  <div id="uploadBar"></div>
 </div>

 <div id="uploadPercent">
  0%
 </div>

</div>

<!-- VIEWER -->
<div id="galleryModal" class="modal">

 <div id="galleryTop">

  <span id="galleryCounter">
   1 / 1
  </span>

  <button id="closeGalleryBtn">
   ✕
  </button>

 </div>

 <div id="galleryImageBox">

  <img
   id="galleryImage"
   style="display:none"
  >

  <video
   id="galleryVideo"
   style="display:none"
   controls
   playsinline
  ></video>

  <div id="galleryDetails">

   <div id="likeUsers"></div>

  </div>

  <div id="socialBox">

   <button id="likeBtn" class="socialBtn">
    ❤️ <span id="likeCount">0</span>
   </button>

   <button id="commentBtn" class="socialBtn">
    💬 <span id="commentCount">0</span>
   </button>

   <button id="viewBtn" class="socialBtn">
    👁️ <span id="viewCount">0</span>
   </button>

  </div>

  <div id="commentsList"></div>

  <div id="commentBox">

   <textarea
    id="commentInput"
    maxlength="2000"
    placeholder="Write a comment..."
   ></textarea>

   <div id="commentActions">

    <button id="cancelCommentBtn">
     Cancel
    </button>

    <button id="sendCommentBtn">
     Send
    </button>

   </div>

  </div>

 </div>

</div>

<!-- INCOMING CALL -->
<div id="callOverlay">

 <div id="callBox">

  <div id="callAvatar">
   📞
  </div>

  <div id="callerText">
   Incoming call...
  </div>

  <div class="callActions">

   <button id="rejectCallBtn">
    Reject
   </button>

   <button id="acceptCallBtn">
    Accept
   </button>

  </div>

 </div>

</div>

<!-- ACTIVE CALL -->
<div id="activeCall">

 <video
  id="remoteVideo"
  autoplay
  playsinline
 ></video>

 <video
  id="localVideo"
  autoplay
  playsinline
  muted
 ></video>

 <div id="callTopBar">
  <div id="callStatus">
   Connecting...
  </div>
 </div>

 <div id="callControls">

  <button id="muteCallBtn" class="callControl">
   🎙️
  </button>

  <button id="cameraCallBtn" class="callControl">
   📹
  </button>

  <button id="endCallBtn" class="callControl">
   📞
  </button>

 </div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(a,b){

 const R=6371000;

 const p1=a.lat*Math.PI/180;
 const p2=b.lat*Math.PI/180;

 const dp=(b.lat-a.lat)*Math.PI/180;
 const dl=(b.lng-a.lng)*Math.PI/180;

 const x=
  Math.sin(dp/2)**2+
  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(dl/2)**2;

 return 2*R*Math.atan2(
  Math.sqrt(x),
  Math.sqrt(1-x)
 );
}

function makeGhostIcon(count){

 return L.divIcon({

  className:"",

  html:
   `<div class="markerGhost">
      👻
      <span>${count}</span>
    </div>`,

  iconSize:[40,40],
  iconAnchor:[20,20]
 });
}

function renderSnaps(rows){

 Object.values(markerGroups).forEach(marker=>{
  try{
   map.removeLayer(marker);
  }catch(e){}
 });

 markerGroups={};

 const groups=[];

 (rows||[]).forEach(row=>{

  const lat=Number(row.latitude);
  const lng=Number(row.longitude);

  if(
   !Number.isFinite(lat)||
   !Number.isFinite(lng)
  )return;

  let group=groups.find(g=>
   distanceMeters(
    {
     lat:g.latitude,
     lng:g.longitude
    },
    {
     lat,
     lng
    }
   )<50
  );

  if(!group){

   group={
    latitude:lat,
    longitude:lng,
    items:[]
   };

   groups.push(group);
  }

  group.items.push(row);
 });

 groups.forEach((group,index)=>{

  const marker=L.marker(
   [
    group.latitude,
    group.longitude
   ],
   {
    icon:makeGhostIcon(
     group.items.length
    )
   }
  ).addTo(map);

  marker.on("click",()=>{
   openGallery(group.items);
  });

  markerGroups[index]=marker;
 });
}

function generateRoomId(){

 const chars=
  "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

 let result="";

 for(let i=0;i<6;i++){

  result+=chars[
   Math.floor(
    Math.random()*chars.length
   )
  ];
 }

 return result;
}

async function createMyRoom(){

 if(!currentUser)
  return null;

 if(myRoom){

  document.getElementById(
   "myCallId"
  ).textContent=myRoom;

  document.getElementById(
   "callPanel"
  ).style.display="block";

  return myRoom;
 }

 /* First try existing permanent ID */

 const {data,error}=await supabaseClient
  .from("profiles")
  .select("call_room_id")
  .eq("id",currentUser.id)
  .maybeSingle();

 if(error){

  console.error(
   "CALL ROOM LOAD:",
   error
  );
 }

 if(data?.call_room_id){

  myRoom=data.call_room_id;

  document.getElementById(
   "myCallId"
  ).textContent=myRoom;

  document.getElementById(
   "callPanel"
  ).style.display="block";

  return myRoom;
 }

 /*
   No ID exists.
   Generate and save permanently.
   Retry if rare unique collision happens.
 */

 for(let attempt=0;attempt<5;attempt++){

  const newRoom=generateRoomId();

  const {data:updateData,error:updateError}=
   await supabaseClient
    .from("profiles")
    .update({
     call_room_id:newRoom
    })
    .eq("id",currentUser.id)
    .select("call_room_id")
    .maybeSingle();

  if(!updateError&&updateData?.call_room_id){

   myRoom=updateData.call_room_id;

   document.getElementById(
    "myCallId"
   ).textContent=myRoom;

   document.getElementById(
    "callPanel"
   ).style.display="block";

   console.log(
    "Permanent Call ID:",
    myRoom
   );

   return myRoom;
  }

  console.error(
   "CALL ROOM CREATE:",
   updateError
  );
 }

 showStatus(
  "Permanent Call ID create nahi hua.",
  5000
 );

 return null;
}

 list.querySelectorAll(
  ".notificationItem"
 ).forEach(item=>{

    "notificationPanel"
   ).style.display="none";

   await openGallery([snap]);

   if(item.dataset.commentId){

    document.getElementById(
     "commentsList"
    ).style.display="block";

    await loadComments(snap.id);
   }

   await loadNotifications();
  };

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function getFreshPosition(){

 return new Promise(
  (resolve,reject)=>{

   navigator.geolocation.getCurrentPosition(
    resolve,
    reject,
    {
     enableHighAccuracy:true,
     timeout:15000,
     maximumAge:0
    }
   );
  }
 );
}

async function openCameraFromLocation(){

 if(!currentUser){

  openAuth("login");

 }

 if(!navigator.geolocation){

  showStatus(
   "Location support nahi hai."
  );

  return;
 }

 showStatus(
  "Live location mil rahi hai..."
 );

 try{

  const pos=
   await getFreshPosition();

  capturedLatitude=
   pos.coords.latitude;

  capturedLongitude=
   pos.coords.longitude;

  if(userLocationMarker){

   map.removeLayer(
    userLocationMarker
   );
  }

  userLocationMarker=
   L.circleMarker(
    [
     capturedLatitude,
     capturedLongitude
    ],
    {
     radius:8
    }
   ).addTo(map);

  map.setView(
   [
    capturedLatitude,
    capturedLongitude
   ],
   17
  );

  await openCamera();

 }catch(error){

  console.error(error);

  showStatus(
   "Location permission allow karo.",
   3500
  );
 }
}

   CAMERA
========================================================= */

function filterToCss(filter){

 switch(filter){

  case "vintage":
   return "sepia(.7) contrast(1.1) saturate(.8)";

  case "bw":
   return "grayscale(1)";

  case "warm":
   return "sepia(.25) saturate(1.35)";

  case "cool":
   return "saturate(.9) hue-rotate(15deg)";

  case "glow":
   return "brightness(1.1) saturate(1.2)";

  case "night":
   return "brightness(.65) contrast(1.25) saturate(1.2)";

  case "pop":
   return "saturate(1.8) contrast(1.15)";

  case "dream":
   return "brightness(1.08) contrast(.9) saturate(1.2)";

  case "sunset":
   return "sepia(.25) saturate(1.5) hue-rotate(-10deg)";

  default:
   return "none";
 }
}

 if(cameraStream){

  cameraStream
   .getTracks()
   .forEach(track=>{
    track.stop();
   });

  cameraStream=null;
 }

 cameraVideo.srcObject=null;
}

   ZOOM
========================================================= */

async function applyHardwareZoom(){

 const track=
  cameraStream
   ?.getVideoTracks?.()[0];

 if(!track)return;

 const caps=
  track.getCapabilities
   ?track.getCapabilities()
   :{};

 if(caps.zoom){

  const z=Math.max(
   caps.zoom.min,
   Math.min(
    caps.zoom.max,
    currentZoom
   )
  );

  try{

   await track.applyConstraints({
    advanced:[
     {
      zoom:z
     }
    ]
   });

  }catch(e){}
 }
}

function drawVideoToCanvas(w,h){

 cameraCanvas.width=w;
 cameraCanvas.height=h;

 const ctx=
  cameraCanvas.getContext("2d");

 ctx.save();

 ctx.filter=
  filterToCss(currentFilter);

 if(mirrorEnabled){

  ctx.translate(w,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(
  cameraVideo,
  0,
  0,
  w,
  h
 );

 ctx.restore();
}

========================================================= */

function chooseMime(){

 const types=[
  "video/webm;codecs=vp9",
  "video/webm;codecs=vp8",
  "video/webm"
 ];

 return types.find(
  t=>MediaRecorder.isTypeSupported(t)
 )||"";
}

async function startRecording(){

 if(!cameraStream)return;

 if(
  !(await lockCaptureLocation())
 )return;

 const mime=chooseMime();

 if(!mime){

  showStatus(
   "Video recording supported nahi hai."
  );

  return;
 }

 recordedChunks=[];

 recorder=
  new MediaRecorder(
   cameraStream,
   {
    mimeType:mime
   }
  );

 recordingStartedAt=
  Date.now();

 recorder.ondataavailable=e=>{

  if(
   e.data&&
   e.data.size
  ){
   recordedChunks.push(
    e.data
   );
  }
 };

 recorder.onstop=()=>{

  capturedBlob=
   new Blob(
    recordedChunks,
    {
     type:mime
    }
   );

  capturedType="video";

  capturedVideoUrl=
   URL.createObjectURL(
    capturedBlob
   );

  document.getElementById(
   "previewImage"
  ).style.display=
   "none";

  const video=
   document.getElementById(
    "previewVideo"
   );

  video.style.display=
   "block";

  video.src=
   capturedVideoUrl;

  document.getElementById(
   "previewInfo"
  ).textContent=
   "Video • "+
   formatMB(
    capturedBlob.size
   );

  document.getElementById(
   "qualityBox"
  ).style.display=
   "flex";

  stopCameraStream();

  cameraModal.style.display=
   "none";

  previewModal.style.display=
   "flex";

  updateRecordUI(false);
 };

 recorder.start(250);

 updateRecordUI(true);

 recordingTimer=
  setInterval(
   updateRecordTimer,
   250
  );
}

function stopRecording(){

 if(
  recorder&&
  recorder.state==="recording"
 ){
  recorder.stop();
 }

 clearInterval(
  recordingTimer
 );

 recordingTimer=null;
}

/* =========================================================
   HELPERS
========================================================= */

function formatMB(bytes){

 return (
  bytes/1024/1024
 ).toFixed(2)+" MB";
}

function formatDuration(sec){

 sec=Math.max(
  0,
  Math.floor(sec)
 );

 return String(
  Math.floor(sec/60)
 ).padStart(2,"0")+
 ":"+
 String(
  sec%60
 ).padStart(2,"0");
}

function dataURLToBlob(dataURL){

 const parts=
  dataURL.split(",");

 const mime=
  parts[0].match(
   /:(.*?);/
  )[1];

 const binary=
  atob(parts[1]);

 const arr=
  new Uint8Array(
   binary.length
  );

 for(
  let i=0;
  i<binary.length;
  i++
 ){
  arr[i]=
   binary.charCodeAt(i);
 }

 return new Blob(
  [arr],
  {
   type:mime
  }
 );
}

function setUploadProgress(

){

async function uploadFile(
 path,
 blob,
 accessToken
){

 const url=
  SUPABASE_URL+
  "/storage/v1/object/past-snaps/"+
  encodeURIComponent(path);

 const xhr=
  new XMLHttpRequest();

 return new Promise(
  (resolve,reject)=>{

   xhr.open(
    "POST",
    url,
    true
   );

   xhr.setRequestHeader(
    "apikey",
    SUPABASE_KEY
   );

   xhr.setRequestHeader(
    "Authorization",
    "Bearer "+
    accessToken
   );

   xhr.setRequestHeader(
    "Content-Type",
    blob.type
   );

   xhr.setRequestHeader(
    "x-upsert",
    "false"
   );

   xhr.upload.onprogress=e=>{

    if(e.lengthComputable){

     setUploadProgress(
      e.loaded/e.total*100,
      "Uploading..."
     );
    }
   };

   xhr.onload=()=>{

    if(
     xhr.status>=200&&
     xhr.status<300
    ){
     resolve();
    }else{
     reject(
      new Error(
       xhr.responseText||
       "Upload failed"
      )
     );
    }
   };

   xhr.onerror=()=>{

    reject(
     new Error(
      "Network error"
     )
    );
   };

   xhr.send(blob);
  }
 );
}

async function postSnap(){

 if(isPostingSnap)return;

 if(!currentUser){

  openAuth("login");
  return;
 }

 if(!capturedBlob){

  showStatus(
   "Pehle capture karo."
  );

  return;
 }

 if(
  capturedLatitude===null||
  capturedLongitude===null
 ){

  showStatus(
   "Capture location nahi mili."
  );

  return;
 }

 let pos;

 try{

  pos=
   await getFreshPosition();

 }catch(e){

  showStatus(
   "Live location required hai.",
   3000
  );

  return;
 }

 const currentLat=
  pos.coords.latitude;

 const currentLng=
  pos.coords.longitude;

 const distance=
  distanceMeters(
   {
    lat:capturedLatitude,
    lng:capturedLongitude
   },
   {
    lat:currentLat,
    lng:currentLng
   }
  );

 if(distance>50){

  showStatus(
   "❌ Post failed: capture location se 50 meter se zyada door ho.",
   4500
  );

  return;
 }

 isPostingSnap=true;

 const btn=
  document.getElementById(
   "postBtn"
  );

 btn.disabled=true;
 btn.textContent=
  "Uploading...";

 const {
  data:sessionData
 }=
  await supabaseClient.auth
   .getSession();

 const accessToken=
  sessionData?.session
   ?.access_token;

 if(!accessToken){

  isPostingSnap=false;

  btn.disabled=false;
  btn.textContent=
   "📍 Post Snap";

  openAuth("login");

  return;
 }

 document.getElementById(
  "uploadBox"
 ).style.display=
  "block";

 setUploadProgress(
  0,
  "Preparing upload..."
 );

 try{

  const extension=
   capturedType==="video"
    ?"webm"
    :"jpg";

  const path=
   currentUser.id+
   "/snap_"+
   Date.now()+
   "_"+
   Math.random()
    .toString(36)
    .slice(2,9)+
   "."+
   extension;

  await uploadFile(
   path,
   capturedBlob,
   accessToken
  );

  const publicUrl=
   SUPABASE_URL+
   "/storage/v1/object/public/past-snaps/"+
   path;

  const description=
   document.getElementById(
    "descriptionInput"
   ).value.trim();

  const {
   data:newSnap,
   error
  }=
   await supabaseClient
    .from("snaps")
    .insert({
     latitude:
      capturedLatitude,
     longitude:
      capturedLongitude,
     image_url:
      publicUrl,
     media_type:
      capturedType,
     user_id:
      currentUser.id,
     description:
      description||null
    })
    .select()
    .single();

  if(error)
   throw error;

  console.log(
   "NEW SNAP:",
   newSnap
  );

  document.getElementById(
   "uploadBox"
  ).style.display=
   "none";

  previewModal.style.display=
   "none";

  showStatus(
   "✅ Snap posted successfully!",
   3000
  );

  capturedBlob=null;
  capturedImageData=null;
  capturedLatitude=null;
  capturedLongitude=null;

  document.getElementById(
   "descriptionInput"
  ).value="";

  if(capturedVideoUrl){

   URL.revokeObjectURL(
    capturedVideoUrl
   );

   capturedVideoUrl=null;
  }

  await loadSnaps();

 }catch(error){

  console.error(
   "POST ERROR:",
   error
  );

  document.getElementById(
   "uploadBox"
  ).style.display=
   "none";

  showStatus(
   "Post failed: "+
   (
    error.message||
    "Unknown error"
   ),
   6000
  );

 }finally{

  isPostingSnap=false;

  btn.disabled=false;

  btn.textContent=
   "📍 Post Snap";
 }
}

async function loadComments(snapId){

 const {
  data,
  error
 }=
  await supabaseClient
   .from("snap_comments")
   .select("*")
   .eq(
    "snap_id",
    snapId
   )
   .order(
    "created_at",
    {
     ascending:true
    }
   );

 if(error){

  console.error(
   "COMMENTS:",
   error
  );

  showStatus(
   "Comments load nahi hue: "+
   (
    error.message||
    "database error"
   ),
   5000
  );

  return;
 }

 const list=
  document.getElementById(
   "commentsList"
  );

 list.style.display=
  "block";

 if(!data?.length){

  list.innerHTML=
   `<div style="color:#aaa;padding:8px">
      No comments yet.
    </div>`;

  return;
 }

 const userIds=[
  ...new Set(
   data
    .map(x=>x.user_id)
    .filter(Boolean)
  )
 ];

 let profiles=[];

 if(userIds.length){

  const result=
   await supabaseClient
    .from("profiles")
    .select(
     "id,display_name"
    )
    .in(
     "id",
     userIds
    );

  if(result.error)
   console.error(
    "COMMENT PROFILES:",
    result.error
   );

  profiles=
   result.data||[];
 }

 const names={};

 profiles.forEach(p=>{
  names[p.id]=
   p.display_name;
 });

 /*
  Recursive nested rendering.
 */

 function renderComment(
  comment,
  depth=0
 ){

  const children=
   data.filter(
    x=>
     String(
      x.parent_comment_id||""
     )===
     String(comment.id)
   );

  const username=
   names[comment.user_id]||
   "User";

  return `

   <div
    class="commentRow"
    style="
     margin-left:
      ${Math.min(depth,4)*15}px
    "
   >

    ${
     depth>0
      ?`
       <div class="replyLabel">
        ↳ Reply
       </div>
      `
      :""
    }

    <div class="commentUser">
     ${escapeHtml(username)}
    </div>

    <div class="commentText">
     ${escapeHtml(
      comment.comment_text
     )}
    </div>

    <div class="commentTime">
     ${
      comment.created_at
       ?new Date(
        comment.created_at
       ).toLocaleString()
       :""
     }
    </div>

    ${
     currentUser
      ?`
       <div class="commentActions">
        <button
         class="replyBtn"
         data-reply-id="${escapeHtml(comment.id)}"
         data-reply-name="${escapeHtml(username)}"
        >
         ↩ Reply
        </button>
       </div>
      `
      :""
    }

    ${
     children.length
      ?children
       .map(child=>
        renderComment(
         child,
         depth+1
        )
       )
       .join("")
      :""
    }

   </div>
  `;
 }

 const roots=
  data.filter(
   c=>!c.parent_comment_id
  );

 /*
  If malformed/orphaned reply exists,
  don't hide it.
 */

 const rootHtml=
  roots
   .map(c=>renderComment(c))
   .join("");

 const rootIds=
  new Set(
   roots.map(
    c=>String(c.id)
   )
  );

 const orphanHtml=
  data
   .filter(
    c=>
     c.parent_comment_id&&
     !rootIds.has(
      String(c.parent_comment_id)
     )
   )
   .map(c=>renderComment(c))
   .join("");

 list.innerHTML=
  rootHtml+
  orphanHtml;

 list.querySelectorAll(
  ".replyBtn"
 ).forEach(btn=>{

  btn.onclick=()=>{

   if(!currentUser){

    openAuth("login");
    return;
   }

   const parentId=
    btn.dataset.replyId;

   const name=
    btn.dataset.replyName;

   const input=
    document.getElementById(
     "commentInput"
    );

   input.value=
    "@"+name+" ";

   input.dataset.parentId=
    parentId;

   document.getElementById(
    "commentBox"
   ).style.display=
    "block";

   input.focus();

/* =========================================================
   WEBRTC
========================================================= */

async function openActiveCall(
 isReceiver,
 peerId
){

 try{

  currentCallPeerId=
   peerId;

  localCallStream=
   await navigator.mediaDevices
    .getUserMedia({
     video:true,
     audio:true
    });

  document.getElementById(
   "localVideo"
  ).srcObject=
   localCallStream;

  remoteCallStream=
   new MediaStream();

  document.getElementById(
   "remoteVideo"
  ).srcObject=
   remoteCallStream;

  document.getElementById(
   "activeCall"
  ).style.display=
   "block";

  document.getElementById(
   "callStatus"
  ).textContent=
   "Connecting...";

  peerConnection=
   new RTCPeerConnection({

    iceServers:[
     {
      urls:
       "stun:stun.l.google.com:19302"
     },
     {
      urls:
       "stun:stun1.l.google.com:19302"
     }
    ]
   });

  localCallStream
   .getTracks()
   .forEach(track=>{

    peerConnection.addTrack(
     track,
     localCallStream
    );
   });

  peerConnection.ontrack=e=>{

   const stream=
    e.streams?.[0];

   if(stream){

    stream
     .getTracks()
     .forEach(track=>{

      if(
       !remoteCallStream
        .getTracks()
        .some(
         t=>t.id===track.id
        )
      ){

       remoteCallStream
        .addTrack(track);
      }
     });
   }

   document.getElementById(
    "callStatus"
   ).textContent=
    "Connected";
  };

  peerConnection.onicecandidate=
   e=>{

    if(e.candidate){

     socket.emit(
      "webrtc-signal",
      {
       targetId:peerId,
       signal:{
        type:
         "ice-candidate",
        candidate:
         e.candidate
       }
      }
     );
    }
   };

  peerConnection.onconnectionstatechange=
   ()=>{

    if(!peerConnection)
     return;

    const state=
     peerConnection
      .connectionState;

    console.log(
     "WebRTC:",
     state
    );

    if(state==="connected"){

     document.getElementById(
      "callStatus"
     ).textContent=
      "Connected";
    }

    if(
     state==="failed"||
     state==="disconnected"||
     state==="closed"
    ){

     cleanupCall();
    }
   };

  /*
   Caller creates offer.
   Receiver waits for offer.
  */

  if(!isReceiver){

   const offer=
    await peerConnection
     .createOffer();

   await peerConnection
    .setLocalDescription(
     offer
    );

   socket.emit(
    "webrtc-signal",
    {
     targetId:peerId,
     signal:{
      type:"offer",
      sdp:offer
     }
    }
   );
  }

 }catch(error){

  console.error(
   "CALL MEDIA:",
   error
  );

  showStatus(
   "Camera/mic permission required hai.",
   4000
  );

  cleanupCall();
 }
}

/* =========================================================
   WEBRTC SIGNAL
========================================================= */

socket.on(
 "webrtc-signal",
 async data=>{

  const signal=
   data?.signal;

  const senderId=
   data?.senderId;

  if(
   !signal||
   !senderId
  )return;

  try{

   /*
    If receiver accepted the call,
    peerConnection already exists.
   */

   if(!peerConnection){

    currentCallPeerId=
     senderId;

    await openActiveCall(
     true,
     senderId
    );
   }

   if(signal.type==="offer"){

    await peerConnection
     .setRemoteDescription(
      new RTCSessionDescription(
       signal.sdp
      )
     );

    const answer=
     await peerConnection
      .createAnswer();

    await peerConnection
     .setLocalDescription(
      answer
     );

    socket.emit(
     "webrtc-signal",
     {
      targetId:senderId,
      signal:{
       type:"answer",
       sdp:answer
      }
     }
    );

   }else if(
    signal.type==="answer"
   ){

    await peerConnection
     .setRemoteDescription(
      new RTCSessionDescription(
       signal.sdp
      )
     );

   }else if(
    signal.type==="ice-candidate"
   ){

    if(signal.candidate){

     await peerConnection
      .addIceCandidate(
       new RTCIceCandidate(
        signal.candidate
       )
      );
    }
   }

  }catch(error){

   console.error(
    "WEBRTC SIGNAL:",
    error
   );
  }
 });

function cleanupCall(){

 if(peerConnection){

  try{
   peerConnection.close();
  }catch(e){}

  peerConnection=null;
 }

 if(localCallStream){

  localCallStream
   .getTracks()
   .forEach(track=>{
    track.stop();
   });

  localCallStream=null;
 }

 remoteCallStream=null;

 document.getElementById(
  "localVideo"
 ).srcObject=null;

 document.getElementById(
  "remoteVideo"
 ).srcObject=null;

 document.getElementById(
  "activeCall"
 ).style.display=
  "none";

 document.getElementById(
  "callOverlay"
 ).style.display=
  "none";

 currentCallPeerId=null;

 callMuted=false;
 callCameraOff=false;

 document.getElementById(
  "muteCallBtn"
 ).textContent=
  "🎙️";

 document.getElementById(
  "cameraCallBtn"
 ).textContent=
  "📹";
}
