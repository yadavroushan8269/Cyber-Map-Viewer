<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cyber Map Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
  --bg:#050805;
  --panel:#0a100a;
  --panel2:#0d160d;
  --green:#39ff14;
  --green2:#8aff6b;
  --line:#1d6b1d;
  --text:#eaffea;
  --muted:#79a879;
  --danger:#ff4545;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:monospace}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{position:relative}
#map{position:absolute;inset:0;z-index:1;background:#101710}
.leaflet-container{background:#101710}
.leaflet-control-attribution{font-size:9px}
.leaflet-control-zoom{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#071007;color:#eaffea;border:1px solid #238c23}
.leaflet-popup-content{font-family:monospace}
.leaflet-popup-content a{color:var(--green)}

#scanlines{pointer-events:none;position:absolute;inset:0;z-index:5000;background:repeating-linear-gradient(to bottom,rgba(57,255,20,.018) 0,rgba(57,255,20,.018) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}

#topBar{
 position:absolute;top:0;left:0;right:0;z-index:1000;
 padding:10px 10px 8px;display:flex;gap:7px;align-items:center;
 background:linear-gradient(180deg,rgba(3,8,3,.96),rgba(3,8,3,.72),transparent);
}
#searchInput{
 flex:1;min-width:0;height:42px;border:1px solid var(--line);border-radius:9px;
 background:#061006e8;color:var(--text);outline:none;padding:0 12px;
 box-shadow:0 0 12px #39ff1420 inset;
}
.topBtn,.iconBtn{
 height:42px;border:1px solid var(--line);border-radius:9px;
 color:var(--green);background:#061006e8;padding:0 11px;font-weight:700;
}
.topBtn:active,.iconBtn:active,.navBtn:active,.actionBtn:active{transform:scale(.96)}
#notificationBtn{font-size:18px;padding:0 10px;position:relative}
#notificationCount{position:absolute;right:3px;top:2px;min-width:15px;height:15px;border-radius:10px;background:#ff3030;color:white;font-size:9px;display:none;align-items:center;justify-content:center}

#status{
 position:absolute;top:62px;left:50%;transform:translateX(-50%);z-index:1000;
 background:#020702e8;border:1px solid var(--line);color:var(--green);
 border-radius:20px;padding:7px 13px;font-size:11px;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

#locBtn{
 position:absolute;z-index:1000;right:15px;bottom:94px;width:54px;height:54px;border-radius:50%;
 border:1px solid var(--green);background:#061006f2;color:var(--green);font-size:23px;
 box-shadow:0 0 18px #39ff1440;
}

#bottomNav{
 position:absolute;left:0;right:0;bottom:0;height:78px;z-index:1100;
 display:flex;align-items:stretch;justify-content:space-around;
 background:rgba(3,8,3,.97);border-top:1px solid var(--line);
 box-shadow:0 -8px 25px #000;
 padding-bottom:env(safe-area-inset-bottom);
}
.navBtn{
 flex:1;border:0;background:transparent;color:#6d966d;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;font-size:10px;max-width:110px;
}
.navBtn .navIcon{font-size:23px;line-height:24px}
.navBtn.active{color:var(--green);text-shadow:0 0 10px #39ff1460}
.navBtn.cameraNav{
 margin:-16px 8px 7px;width:62px;max-width:62px;flex:0 0 62px;height:62px;
 border:1px solid var(--green);border-radius:50%;background:#071207;
 box-shadow:0 0 20px #39ff1440;
}

.markerGhost{
 width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
 color:#001500;background:var(--green);border:2px solid #d8ffd0;
 font-weight:900;font-size:12px;box-shadow:0 0 18px #39ff1490;
}

.panel{
 position:absolute;z-index:3000;left:10px;right:10px;bottom:88px;max-height:75vh;overflow:auto;
 background:#061006f8;border:1px solid var(--line);border-radius:14px;padding:14px;
 box-shadow:0 15px 50px #000;
}
.panel.hidden,.modal.hidden{display:none!important}
.panelHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panelTitle{color:var(--green);font-weight:900;font-size:16px}
.closeX{background:none;border:0;color:#9fc99f;font-size:23px}

.field{
 width:100%;height:43px;border:1px solid var(--line);border-radius:8px;
 background:#020702;color:var(--text);padding:0 11px;outline:none;margin:5px 0 9px;
}
textarea.field{height:80px;padding-top:10px;resize:none}
.primary{
 width:100%;min-height:43px;border:1px solid var(--green);border-radius:8px;
 background:#0a250a;color:var(--green);font-weight:900;margin:4px 0;
}
.secondary{
 border:1px solid var(--line);border-radius:8px;background:#071007;color:#a8dca8;padding:9px 12px;
}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.muted{color:var(--muted);font-size:11px}
.roomCode{font-size:23px;letter-spacing:3px;color:var(--green);text-align:center;border:1px dashed var(--line);padding:13px;border-radius:9px;margin:10px 0}

#authModal,#cameraModal,#previewModal,#viewerModal,#callModal,#incomingModal{
 position:absolute;inset:0;z-index:4000;background:#000b;display:flex;align-items:center;justify-content:center;padding:12px;
}
.modalCard{
 width:min(520px,100%);max-height:94vh;overflow:auto;background:#061006;
 border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 0 50px #000;
}
.modalTitle{font-size:18px;color:var(--green);font-weight:900;margin-bottom:10px}

#cameraModal{align-items:stretch;padding:0;background:#000}
.cameraCard{width:100%;height:100%;background:#000;position:relative}
#cameraVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cameraShade{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px #000}
.cameraTop,.cameraBottom{position:absolute;left:0;right:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:15px}
.cameraTop{top:0}.cameraBottom{bottom:10px;flex-direction:column;gap:10px}
.cameraControls{display:flex;gap:9px;align-items:center;justify-content:center}
.camRound{width:48px;height:48px;border-radius:50%;border:1px solid var(--green);background:#061006d9;color:var(--green)}
#captureBtn{width:76px;height:76px;border-radius:50%;border:5px solid white;background:var(--green);box-shadow:0 0 25px #39ff1480}
#recordTimer{color:#ff5555;font-weight:900}
.cameraModes,.filterRow{display:flex;gap:5px;overflow:auto}
.cameraModes button,.filterRow button{
 border:1px solid var(--line);background:#061006dd;color:#8fd68f;border-radius:7px;padding:6px 9px;font-size:11px
}
.cameraModes button.active,.filterRow button.active{color:var(--green);border-color:var(--green)}

#previewMedia,#viewerMedia{max-width:100%;max-height:52vh;display:block;margin:auto;border-radius:9px}
#viewerModal{background:#000f}
.viewerCard{width:100%;height:100%;position:relative;display:flex;flex-direction:column;justify-content:center}
.viewerTop{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}
.viewerInfo{margin-top:10px;background:#061006e8;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:28vh;overflow:auto}
.viewerActions{display:flex;gap:6px;margin-top:8px}
.viewerActions button{flex:1}
.comments{margin-top:9px}
.commentItem{padding:7px 0;border-bottom:1px solid #173117;font-size:12px}
.commentReply{margin-left:20px;border-left:1px solid var(--line);padding-left:8px}
.commentMeta{color:var(--muted);font-size:10px}
.likeUsers{font-size:10px;color:#9fd99f;margin-top:4px}

#notificationList{display:flex;flex-direction:column;gap:7px}
.notice{padding:10px;border:1px solid #194619;border-radius:9px;background:#071007}
.notice.unread{border-color:var(--green)}
.notice small{color:var(--muted)}

#incomingModal{z-index:5000}
.incomingCard{text-align:center}
.callerBig{font-size:32px;color:var(--green);margin:15px 0}
.accept{background:#0b410b!important}.reject{background:#410b0b!important;border-color:#ff4545!important;color:#ff8b8b!important}

#callModal{z-index:4900;background:#000}
.callCard{width:100%;height:100%;position:relative;background:#000}
#remoteVideo{width:100%;height:100%;object-fit:cover;background:#050805}
#localVideo{position:absolute;right:12px;top:12px;width:115px;height:155px;object-fit:cover;border:1px solid var(--green);border-radius:10px;background:#000;z-index:2}
.callControls{position:absolute;left:0;right:0;bottom:25px;display:flex;justify-content:center;gap:12px;z-index:3}
.callControls button{width:52px;height:52px;border-radius:50%;border:1px solid var(--green);background:#071007e8;color:var(--green)}
.callControls .end{background:#4a0909;color:#ff7777;border-color:#ff4545}

#chatBox{position:absolute;left:10px;right:10px;bottom:90px;z-index:5;background:#061006ed;border:1px solid var(--line);border-radius:12px;padding:9px;display:none}
#chatMessages{height:130px;overflow:auto;margin-bottom:7px}
.chatMsg{padding:5px 7px;margin:3px 0;border-radius:7px;background:#0b170b;font-size:11px}
.chatMine{text-align:right;color:var(--green)}

.hidden{display:none!important}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<body>
<div id="app">
  <div id="map"></div>
  <div id="scanlines"></div>

  <div id="topBar">
    <input id="searchInput" placeholder="🔍 Search location">
    <button class="topBtn" id="searchBtn">SEARCH</button>
    <button class="iconBtn" id="notificationBtn">🔔<span id="notificationCount"></span></button>
  </div>

  <div id="status">SYSTEM ONLINE</div>

  <button id="locBtn" title="My Location">⌖</button>

  <div id="bottomNav">
    <button class="navBtn active" id="mapNav"><span class="navIcon">🗺️</span><span>MAP</span></button>
    <button class="navBtn" id="exploreNav"><span class="navIcon">👻</span><span>EXPLORE</span></button>
    <button class="navBtn cameraNav" id="cameraNav"><span class="navIcon">📸</span><span>SNAP</span></button>
    <button class="navBtn" id="roomNav"><span class="navIcon">📞</span><span>CALL</span></button>
    <button class="navBtn" id="accountNav"><span class="navIcon">👤</span><span>ACCOUNT</span></button>
  </div>

  <div id="roomPanel" class="panel hidden">
    <div class="panelHeader"><div class="panelTitle">📞 MY ROOM ID</div><button class="closeX" data-close="roomPanel">×</button></div>
    <div class="muted">Permanent Call ID — generated once for this account.</div>
    <div id="myRoomCode" class="roomCode">LOGIN REQUIRED</div>
    <div class="row"><button class="secondary" id="copyRoomBtn">COPY ID</button><button class="secondary" id="shareRoomBtn">SHARE</button></div>
    <input class="field" id="targetRoomInput" placeholder="Enter target Call ID">
    <button class="primary" id="callUserBtn">CALL USER</button>
  </div>

  <div id="notificationPanel" class="panel hidden">
    <div class="panelHeader"><div class="panelTitle">🔔 NOTIFICATIONS</div><button class="closeX" data-close="notificationPanel">×</button></div>
    <div id="notificationList"></div>
  </div>

  <div id="authModal" class="hidden">
    <div class="modalCard">
      <div class="panelHeader"><div class="modalTitle" id="authTitle">LOGIN</div><button class="closeX" id="authClose">×</button></div>
      <input class="field" id="authEmail" type="email" placeholder="Email">
      <input class="field" id="authPassword" type="password" placeholder="Password">
      <input class="field" id="authName" placeholder="Display name" style="display:none">
      <button class="primary" id="authSubmit">LOGIN</button>
      <button class="secondary" id="authSwitch">Create account</button>
    </div>
  </div>

  <div id="cameraModal" class="hidden">
    <div class="cameraCard">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <div class="cameraShade"></div>
      <div class="cameraTop">
        <button class="camRound" id="cameraClose">×</button>
        <span id="cameraGpsText" style="color:var(--green);font-size:10px">GPS LOCK</span>
        <button class="camRound" id="switchCamera">↻</button>
      </div>
      <div class="cameraBottom">
        <div class="cameraModes">
          <button class="active" data-mode="photo">PHOTO</button>
          <button data-mode="video">VIDEO</button>
          <button id="mirrorBtn">MIRROR</button>
        </div>
        <div class="filterRow">
          <button class="active" data-filter="none">NORMAL</button>
          <button data-filter="mono">MONO</button>
          <button data-filter="green">CYBER</button>
          <button data-filter="warm">WARM</button>
        </div>
        <div id="recordTimer"></div>
        <div class="cameraControls">
          <button class="camRound" id="zoomOut">−</button>
          <button id="captureBtn"></button>
          <button class="camRound" id="zoomIn">+</button>
        </div>
      </div>
    </div>
  </div>

  <div id="previewModal" class="modal hidden">
    <div class="modalCard">
      <div class="panelHeader"><div class="modalTitle">PREVIEW</div><button class="closeX" id="previewClose">×</button></div>
      <img id="previewImage" class="hidden" alt="">
      <video id="previewVideo" class="hidden" controls playsinline></video>
      <textarea class="field" id="descriptionInput" placeholder="Description"></textarea>
      <div class="row">
        <button class="secondary" id="retakeBtn">RETAKE</button>
        <button class="primary" id="postBtn">POST SNAP</button>
      </div>
    </div>
  </div>

  <div id="viewerModal" class="hidden">
    <div class="viewerCard">
      <div class="viewerTop">
        <button class="secondary" id="prevSnap">‹</button>
        <span id="viewerCounter" style="color:var(--green);padding:10px">1/1</span>
        <button class="secondary" id="closeViewer">×</button>
        <button class="secondary" id="nextSnap">›</button>
      </div>
      <div id="viewerMediaWrap"></div>
      <div class="viewerInfo">
        <div id="viewerAuthor"></div>
        <div id="viewerLocation"></div>
        <div id="viewerTime"></div>
        <div id="viewerDescription"></div>
        <div class="viewerActions">
          <button class="secondary" id="likeBtn">♡ LIKE</button>
          <button class="secondary" id="commentFocusBtn">💬 COMMENT</button>
          <button class="secondary" id="viewCountBtn">👁 VIEW</button>
        </div>
        <div id="likeUsers" class="likeUsers"></div>
        <div class="comments" id="commentsList"></div>
        <div class="row">
          <input class="field" id="commentInput" placeholder="Comment / reply" style="margin-bottom:0">
          <button class="primary" id="sendCommentBtn">SEND</button>
        </div>
      </div>
    </div>
  </div>

  <div id="incomingModal" class="hidden">
    <div class="modalCard incomingCard">
      <div class="modalTitle">📞 INCOMING CALL</div>
      <div id="incomingCaller" class="callerBig">UNKNOWN</div>
      <div class="muted">Someone is calling your permanent room.</div>
      <div class="row" style="margin-top:20px">
        <button class="primary accept" id="acceptCallBtn">ACCEPT</button>
        <button class="primary reject" id="rejectCallBtn">REJECT</button>
      </div>
    </div>
  </div>

  <div id="callModal" class="hidden">
    <div class="callCard">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div style="position:absolute;top:15px;left:15px;color:var(--green);z-index:3">● SECURE CALL</div>
      <div class="callControls">
        <button id="muteCallBtn">🎙</button>
        <button id="cameraCallBtn">📷</button>
        <button id="chatCallBtn">💬</button>
        <button class="end" id="endCallBtn">☎</button>
      </div>
      <div id="chatBox">
        <div id="chatMessages"></div>
        <div class="row"><input class="field" id="chatInput" placeholder="Message" style="margin:0"><button class="primary" id="sendChatBtn">SEND</button></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/socket.io/socket.io.js"></script>

<script>
"use strict";

/* ================= SUPABASE ================= */
const SUPABASE_URL="https://zzxhymydsvwpjbyaslde.supabase.co";
const SUPABASE_KEY="sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

/* ================= SOCKET ================= */
const socket=io({transports:["websocket","polling"]});

/* ================= STATE ================= */
let currentUser=null,currentProfile=null,authMode="login";
let map=null,userMarker=null,userCircle=null;
let markerGroups=[];
let cameraStream=null,currentFacing="environment",mirror=false,currentFilter="none";
let capturedBlob=null,capturedType=null,capturedLatitude=null,capturedLongitude=null;
let mediaRecorder=null,recordedChunks=[],recording=false;
let galleryItems=[],galleryIndex=0,currentGallerySnap=null;
let myRoom=null;
let incomingCallerId=null,incomingCallerRoom=null;
let peerConnection=null,currentCallPeerId=null,localCallStream=null;
let muted=false,cameraOff=false;
let replyingTo=null;
const peers={};

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
function show(el){el.classList.remove("hidden")}
function hide(el){el.classList.add("hidden")}
function status(t){$("status").textContent=t}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function beep(freq=650,dur=.045){
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const a=new C(),o=a.createOscillator(),g=a.createGain();
  o.frequency.value=freq;o.type="square";g.gain.value=.025;o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+dur);
 }catch(e){}
}
document.addEventListener("click",e=>{if(e.target.closest("button"))beep()},true);

function setActiveNav(id){
 document.querySelectorAll(".navBtn").forEach(x=>x.classList.remove("active"));
 $(id)?.classList.add("active");
}

/* ================= MAP ================= */
function initMap(){
 map=L.map("map",{zoomControl:false,attributionControl:true}).setView([20.5937,78.9629],5);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
   maxZoom:20,
   attribution:"© OpenStreetMap contributors"
 }).addTo(map);

 map.on("click",()=>{}); // Map click NEVER opens camera.
 setTimeout(()=>map.invalidateSize(),300);
}

function haversine(a,b,c,d){
 const R=6371000,rad=Math.PI/180;
 const x=(c-a)*rad,y=(d-b)*rad;
 const q=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;
 return 2*R*Math.asin(Math.sqrt(q));
}

function groupSnaps(snaps){
 const groups=[];
 for(const snap of snaps){
  let g=groups.find(x=>haversine(x.lat,x.lng,snap.latitude,snap.longitude)<=50);
  if(!g){g={lat:snap.latitude,lng:snap.longitude,items:[]};groups.push(g)}
  g.items.push(snap);
 }
 return groups;
}

function renderGroups(groups){
 markerGroups.forEach(m=>map.removeLayer(m));
 markerGroups=[];
 groups.forEach(g=>{
   const icon=L.divIcon({className:"",html:`<div class="markerGhost">${g.items.length} 👻</div>`,iconSize:[50,50],iconAnchor:[25,25]});
   const m=L.marker([g.lat,g.lng],{icon}).addTo(map);
   m.on("click",()=>openGallery(g.items));
   markerGroups.push(m);
 });
}

async function loadSnaps(){
 const {data,error}=await supabaseClient.from("snaps").select("*").order("created_at",{ascending:false});
 if(error){console.error(error);status("SNAPS LOAD ERROR");return}
 renderGroups(groupSnaps(data||[]));
 status(`${data?.length||0} SNAP(S) ONLINE`);
}

/* ================= SEARCH ================= */
async function searchLocation(){
 const q=$("searchInput").value.trim();
 if(!q)return;
 status("SEARCHING...");
 try{
  const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&q="+encodeURIComponent(q),{headers:{"Accept":"application/json"}});
  const d=await r.json();
  if(!d.length){status("LOCATION NOT FOUND");return}
  map.setView([+d[0].lat,+d[0].lon],16);
  status("LOCATION FOUND");
 }catch(e){status("SEARCH FAILED")}
}

/* ================= AUTH ================= */
function openAuth(mode="login"){
 authMode=mode;
 $("authTitle").textContent=mode==="login"?"LOGIN":"CREATE ACCOUNT";
 $("authSubmit").textContent=mode==="login"?"LOGIN":"REGISTER";
 $("authName").style.display=mode==="login"?"none":"block";
 show($("authModal"));
}
async function loadProfile(){
 if(!currentUser){currentProfile=null;return}
 const {data}=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
 currentProfile=data||{id:currentUser.id,display_name:currentUser.email?.split("@")[0]||"User"};
 if(!currentProfile.call_room_id)await ensureRoom();
 $("accountNav").querySelector("span:last-child").textContent=(currentProfile.display_name||"ACCOUNT").slice(0,10);
 await loadNotifications();
}
async function ensureRoom(){
 if(!currentUser)return;
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const make=()=>Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join("");
 let room=currentProfile?.call_room_id;
 if(!room){
  room=make();
  const {error}=await supabaseClient.from("profiles").update({call_room_id:room}).eq("id",currentUser.id);
  if(error){console.error(error);return}
  currentProfile.call_room_id=room;
 }
 myRoom=room;
 $("myRoomCode").textContent=room;
 socket.emit("join-room",room);
}
async function authSubmit(){
 const email=$("authEmail").value.trim(),pass=$("authPassword").value,name=$("authName").value.trim();
 if(!email||!pass)return alert("Email aur password required.");
 if(authMode==="login"){
  const {error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
  if(error)return alert(error.message);
 }else{
  const {data,error}=await supabaseClient.auth.signUp({email,password:pass});
  if(error)return alert(error.message);
  if(data.user){

 }

}

/* ================= LOCATION + CAMERA ================= */
function getFreshPosition(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject(new Error("GPS unavailable"));
  navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
 });
}
async function openCameraFromLocation(){
 if(!currentUser){openAuth();return}
 status("LOCKING GPS...");
 try{
  const p=await getFreshPosition();
  capturedLatitude=p.coords.latitude;capturedLongitude=p.coords.longitude;
  if(userMarker)map.removeLayer(userMarker);
  if(userCircle)map.removeLayer(userCircle);
  userMarker=L.marker([capturedLatitude,capturedLongitude]).addTo(map).bindPopup("CAPTURE GPS").openPopup();
  userCircle=L.circle([capturedLatitude,capturedLongitude],{radius:50,color:"#39ff14",fillOpacity:.08}).addTo(map);
  map.setView([capturedLatitude,capturedLongitude],17);
  $("cameraGpsText").textContent=`GPS ${capturedLatitude.toFixed(5)}, ${capturedLongitude.toFixed(5)}`;
  await startCamera();
 }catch(e){status("GPS FAILED: "+e.message)}
}
async function startCamera(){
 try{
  stopCamera();
  cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:currentFacing},width:{ideal:1920},height:{ideal:1080}},
   audio:true
  });
  $("cameraVideo").srcObject=cameraStream;
  show($("cameraModal"));
 }catch(e){alert("Camera permission required: "+e.message)}
}
function stopCamera(){
 if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}
}
$("cameraClose").onclick=()=>{stopCamera();hide($("cameraModal"));status("CAMERA CLOSED")}
$("switchCamera").onclick=async()=>{currentFacing=currentFacing==="environment"?"user":"environment";await startCamera()}
$("mirrorBtn").onclick=()=>{mirror=!mirror;$("cameraVideo").style.transform=mirror?"scaleX(-1)":"none"}
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{
 currentFilter=b.dataset.filter;
 document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 const v=$("cameraVideo");
 v.style.filter=currentFilter==="mono"?"grayscale(1)":currentFilter==="green"?"sepia(1) hue-rotate(65deg) saturate(4)":currentFilter==="warm"?"sepia(.4) saturate(1.4)":"none";
});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("[data-mode]").forEach(x=>x.classList.remove("active"));b.classList.add("active");
 window.cameraMode=b.dataset.mode;
});
window.cameraMode="photo";

$("captureBtn").onclick=async()=>{
 if(window.cameraMode==="video"){
  if(recording){mediaRecorder.stop();recording=false;return}
  try{
   const p=await getFreshPosition();capturedLatitude=p.coords.latitude;capturedLongitude=p.coords.longitude;
   recordedChunks=[];
   mediaRecorder=new MediaRecorder(cameraStream,{mimeType:"video/webm"});
   mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
   mediaRecorder.onstop=()=>{
    capturedBlob=new Blob(recordedChunks,{type:"video/webm"});capturedType="video";
    const u=URL.createObjectURL(capturedBlob);$("previewVideo").src=u;hide($("previewImage"));show($("previewVideo"));show($("previewModal"));
   };
   mediaRecorder.start();recording=true;$("recordTimer").textContent="● REC";
  }catch(e){status("VIDEO GPS FAILED")}
 }else{
  try{
   const p=await getFreshPosition();capturedLatitude=p.coords.latitude;capturedLongitude=p.coords.longitude;
   const v=$("cameraVideo"),c=document.createElement("canvas");
   c.width=v.videoWidth||1280;c.height=v.videoHeight||720;
   const x=c.getContext("2d");
   if(mirror){x.translate(c.width,0);x.scale(-1,1)}
   x.filter=v.style.filter||"none";x.drawImage(v,0,0,c.width,c.height);
   const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
   capturedBlob=blob;capturedType="image";
   $("previewImage").src=URL.createObjectURL(blob);show($("previewImage"));hide($("previewVideo"));show($("previewModal"));stopCamera();hide($("cameraModal"));
  }catch(e){status("PHOTO FAILED")}
 }
};

$("retakeBtn").onclick=()=>{hide($("previewModal"));startCamera()}
$("previewClose").onclick=()=>{hide($("previewModal"));capturedBlob=null}
$("postBtn").onclick=postSnap;

async function postSnap(){
 if(!currentUser||!capturedBlob)return;
 $("postBtn").disabled=true;status("VERIFYING FRESH GPS...");
 try{
  const p=await getFreshPosition();
  const d=haversine(capturedLatitude,capturedLongitude,p.coords.latitude,p.coords.longitude);
  if(d>50){alert(`Posting blocked. Capture se ${Math.round(d)}m door ho.`);return}
  const ext=capturedType==="image"?"jpg":"webm";
  const path=`${currentUser.id}/${Date.now()}.${ext}`;
  const {data:{session}}=await supabaseClient.auth.getSession();
  const token=session?.access_token||SUPABASE_KEY;
  const xhr=await uploadStorage(path,capturedBlob,token);
  const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/past-snaps/${path}`;
  const {error}=await supabaseClient.from("snaps").insert({
   latitude:capturedLatitude,longitude:capturedLongitude,image_url:publicUrl,
   media_type:capturedType,user_id:currentUser.id,description:$("descriptionInput").value.trim()||null
  });
  if(error)throw error;
  hide($("previewModal"));$("descriptionInput").value="";
  capturedBlob=null;status("SNAP POSTED");await loadSnaps();
 }catch(e){console.error(e);alert("Post failed: "+e.message)}
 finally{$("postBtn").disabled=false}
}
function uploadStorage(path,blob,token){
 return new Promise((resolve,reject)=>{
  const xhr=new XMLHttpRequest();
  xhr.open("POST",`${SUPABASE_URL}/storage/v1/object/past-snaps/${encodeURIComponent(path)}`);
  xhr.setRequestHeader("Authorization","Bearer "+token);
  xhr.setRequestHeader("apikey",SUPABASE_KEY);
  xhr.setRequestHeader("Content-Type",blob.type||"application/octet-stream");
  xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve(xhr.responseText):reject(new Error("Storage "+xhr.status+" "+xhr.responseText));
  xhr.onerror=()=>reject(new Error("Storage network error"));
  xhr.send(blob);
 });
}

function openGallery(items){

 $("viewerMediaWrap").innerHTML=snap.media_type==="video"
  ?`<video id="viewerMedia" controls autoplay playsinline src="${esc(snap.image_url)}"></video>`

async function getProfileName(id){

async function loadEngagement(snap){
 const {data:likes}=await supabaseClient.from("snap_likes").select("user_id").eq("snap_id",snap.id);
 const mine=currentUser&&likes?.some(x=>x.user_id===currentUser.id);
 $("likeBtn").textContent=mine?"♥ LIKED":"♡ LIKE";
 const names=[];
 for(const l of (likes||[]).slice(0,8))names.push(await getProfileName(l.user_id));
 $("likeUsers").textContent=names.length?`Liked by: ${names.join(", ")}`:"No likes yet";
 await addView(snap);

}
async function addView(snap){

}
$("likeBtn").onclick=async()=>{
 if(!currentUser)return openAuth();

 if(data)await supabaseClient.from("snap_likes").delete().eq("id",data.id);
 else await supabaseClient.from("snap_likes").insert({snap_id:snap.id,user_id:currentUser.id});

 if(error){$("commentsList").innerHTML="Comments unavailable.";return}

   <div class="commentMeta">${new Date(x.created_at).toLocaleString()} <button class="secondary replyBtn" data-id="${x.id}" data-text="${esc(x.comment_text)}">REPLY</button></div>
   ${render(x.id,depth+1)}
  </div>`).join("");
 $("commentsList").innerHTML=render(null)||'<div class="muted">No comments yet.</div>';
}

async function createPeer(peerId,isCaller){
 currentCallPeerId=peerId;
 peerConnection=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
 localCallStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
 localCallStream.getTracks().forEach(t=>peerConnection.addTrack(t,localCallStream));
 $("localVideo").srcObject=localCallStream;
 peerConnection.ontrack=e=>{$("remoteVideo").srcObject=e.streams[0]};
 peerConnection.onicecandidate=e=>{if(e.candidate)socket.emit("webrtc-signal",{targetId:peerId,signal:{candidate:e.candidate}})};
 if(isCaller){
  const offer=await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  socket.emit("webrtc-signal",{targetId:peerId,signal:{offer}});
 }
}
socket.on("webrtc-signal",async d=>{
 if(!peerConnection)await createPeer(d.senderId,false);
 const s=d.signal;
 if(s.offer){
  await peerConnection.setRemoteDescription(new RTCSessionDescription(s.offer));
  const answer=await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  socket.emit("webrtc-signal",{targetId:d.senderId,signal:{answer}});
 }else if(s.answer){
  await peerConnection.setRemoteDescription(new RTCSessionDescription(s.answer));
 }else if(s.candidate){
  try{await peerConnection.addIceCandidate(new RTCIceCandidate(s.candidate))}catch(e){}
 }
});
function openCallUI(){show($("callModal"));$("chatBox").style.display="none"}
async function endCall(send=true){
 if(send&&currentCallPeerId)socket.emit("end-call",{targetId:currentCallPeerId});
 if(peerConnection){peerConnection.close();peerConnection=null}
 if(localCallStream){localCallStream.getTracks().forEach(t=>t.stop());localCallStream=null}
 $("localVideo").srcObject=null;$("remoteVideo").srcObject=null;
 currentCallPeerId=null;hide($("callModal"));status("CALL ENDED");
}
$("endCallBtn").onclick=()=>endCall(true);
