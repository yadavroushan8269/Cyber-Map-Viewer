<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>Past Snap</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
  overflow:hidden;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  height:100%;
  position:relative;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* =========================
   TOP
========================= */

#topBar{
  position:absolute;
  z-index:1000;
  top:10px;
  left:10px;
  right:10px;
  display:flex;
  gap:6px;
  background:rgba(0,0,0,.78);
  padding:7px;
  border-radius:15px;
}

#searchInput{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  border-radius:10px;
  padding:11px;
  font-size:15px;
}

#searchBtn,
#locBtn{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  background:#fff;
  color:#111;
  font-weight:700;
}

#locBtn{
  position:absolute;
  z-index:2000;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  box-shadow:0 4px 20px #000;
}

/* =========================
   STATUS
========================= */

#status{
  position:absolute;
  z-index:6000;
  top:70px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.86);
  padding:8px 14px;
  border-radius:20px;
  font-size:13px;
  display:none;
  max-width:92%;
  text-align:center;
}

/* =========================
   AUTH
========================= */

#authModal{
  position:absolute;
  inset:0;
  z-index:7000;
  background:#111;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.authBox{
  width:min(100%,380px);
  background:#1b1b1b;
  border-radius:20px;
  padding:22px;
  box-shadow:0 15px 60px #000;
}

.authBox h2{
  margin:0 0 5px;
  text-align:center;
}

.authSub{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:18px;
}

.authInput{
  width:100%;
  padding:13px;
  border:0;
  outline:0;
  border-radius:10px;
  margin-bottom:10px;
  font-size:15px;
}

.authBtn{
  width:100%;
  border:0;
  padding:13px;
  border-radius:11px;
  font-weight:700;
  font-size:15px;
  background:#fff;
  color:#111;
  margin-top:5px;
}

.authSwitch{
  text-align:center;
  margin-top:14px;
  color:#aaa;
  font-size:13px;
}

.authSwitch button{
  background:none;
  border:0;
  color:#fff;
  text-decoration:underline;
}

#logoutBtn{
  position:absolute;
  z-index:2000;
  top:65px;
  right:10px;
  border:0;
  background:rgba(0,0,0,.7);
  color:#fff;
  padding:8px 11px;
  border-radius:10px;
  display:none;
}

/* =========================
   MODAL
========================= */

.modal{
  display:none;
  position:absolute;
  inset:0;
  z-index:5000;
  background:#000;
  flex-direction:column;
}

/* =========================
   CAMERA
========================= */

#cameraVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  display:block;
}

#cameraVideo.mirror-preview{
  transform:scaleX(-1);
}

#cameraTop{
  position:absolute;
  top:10px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:space-between;
  padding:10px;
}

#cameraTop button,
.roundBtn{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:20px;
}

#cameraCanvas{
  display:none;
}

/* =========================
   ZOOM
========================= */

#zoomBox{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  z-index:10;
  background:rgba(0,0,0,.65);
  border-radius:18px;
  padding:8px 5px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

#zoomRange{
  writing-mode:vertical-lr;
  direction:rtl;
  width:30px;
  height:170px;
}

#zoomValue{
  font-size:12px;
  font-weight:700;
}

/* =========================
   MODES
========================= */

#modeBar{
  position:absolute;
  bottom:154px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  display:flex;
  background:rgba(0,0,0,.65);
  border-radius:20px;
  padding:4px;
}

#modeBar button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:8px 14px;
  border-radius:17px;
  font-weight:700;
}

#modeBar button.active{
  background:#fff;
  color:#111;
}

/* =========================
   FILTERS
========================= */

#filterBar{
  position:absolute;
  bottom:92px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:7px 10px;
  scrollbar-width:none;
}

#filterBar::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:0 0 auto;
  border:0;
  background:rgba(0,0,0,.65);
  color:#fff;
  padding:8px 12px;
  border-radius:17px;
  font-size:12px;
}

.filterBtn.active{
  background:#fff;
  color:#111;
}

/* =========================
   CAMERA BOTTOM
========================= */

#cameraBottom{
  position:absolute;
  bottom:14px;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:28px;
}

#mirrorBtn{
  border:0;
  background:rgba(0,0,0,.65);
  color:#fff;
  border-radius:20px;
  padding:10px 14px;
}

#mirrorBtn.active{
  background:#fff;
  color:#111;
}

#captureBtn{
  width:70px;
  height:70px;
  border-radius:50%;
  border:6px solid #fff;
  background:#fff;
}

#captureBtn.recording{
  background:#e33;
  border-radius:18px;
}

#recordTimer{
  position:absolute;
  bottom:82px;
  left:50%;
  transform:translateX(-50%);
  z-index:11;
  background:rgba(0,0,0,.75);
  padding:6px 12px;
  border-radius:16px;
  display:none;
  font-weight:700;
}

/* =========================
   POST DETAILS
========================= */

#detailsModal{
  background:#111;
  padding:15px;
  overflow:auto;
}

.detailsBox{
  width:min(100%,500px);
  margin:auto;
  padding-top:20px;
}

.detailsTitle{
  font-size:21px;
  font-weight:700;
  margin-bottom:15px;
}

.detailsInput,
.detailsTextarea{
  width:100%;
  border:0;
  outline:0;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  font-size:15px;
}

.detailsTextarea{
  height:110px;
  resize:none;
}

.locationCard{
  background:#1c1c1c;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  color:#ddd;
  font-size:13px;
}

.locationCard b{
  color:#fff;
}

.detailsButtons{
  display:flex;
  gap:10px;
}

.detailsButtons button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:700;
}

#detailsBackBtn{
  background:#333;
  color:#fff;
}

#detailsNextBtn{
  background:#fff;
  color:#111;
}

/* =========================
   PREVIEW
========================= */

#previewModal{
  background:#111;
}

#previewMediaBox{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
}

#previewImage,
#previewVideo{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

#previewInfo{
  padding:10px;
  text-align:center;
  font-size:13px;
  background:#181818;
}

#qualityBox{
  display:flex;
  gap:6px;
  justify-content:center;
  padding:8px;
  background:#181818;
}

.qualityBtn{
  border:0;
  background:#333;
  color:#fff;
  border-radius:9px;
  padding:7px 12px;
}

.qualityBtn.active{
  background:#fff;
  color:#111;
}

#previewBottom{
  display:flex;
  gap:10px;
  padding:12px;
}

#previewBottom button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  font-weight:700;
}

#cancelPreviewBtn{
  background:#333;
  color:#fff;
}

#postBtn{
  background:#fff;
  color:#111;
}

/* =========================
   UPLOAD
========================= */

#uploadBox{
  display:none;
  position:absolute;
  z-index:8000;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(90%,360px);
  background:#181818;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 50px #000;
}

#uploadTitle{
  font-size:18px;
  font-weight:700;
}

#uploadText{
  margin-top:8px;
  color:#bbb;
  font-size:13px;
}

#uploadTrack{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:18px;
}

#uploadBar{
  height:100%;
  width:0;
  background:#fff;
}

#uploadPercent{
  text-align:center;
  margin-top:8px;
  font-weight:700;
}

/* =========================
   GALLERY
========================= */

#galleryModal{
  background:#111;
}

#galleryTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
}

#galleryImageBox{
  flex:1;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
}

#galleryImage,
#galleryVideo{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.galleryArrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:38px;
  width:45px;
  height:60px;
  border-radius:10px;
}

#prevBtn{
  left:8px;
}

#nextBtn{
  right:8px;
}

#closeGalleryBtn{
  border:0;
  background:#333;
  color:#fff;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:20px;
}

#galleryDetails{
  background:#181818;
  padding:14px;
  font-size:13px;
  max-height:170px;
  overflow:auto;
}

.galleryName{
  font-size:17px;
  font-weight:700;
}

.galleryDescription{
  margin-top:7px;
  color:#ddd;
}

.gallerySong{
  margin-top:7px;
  color:#bbb;
}

.galleryLocation{
  margin-top:7px;
  color:#aaa;
}

/* =========================
   MARKER
========================= */

.markerGhost{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#fff;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  border:3px solid #111;
  position:relative;
}

.markerGhost span{
  position:absolute;
  right:-8px;
  top:-8px;
  background:#111;
  color:#fff;
  border-radius:10px;
  min-width:18px;
  text-align:center;
  font-size:10px;
  padding:2px;
}

.leaflet-control-attribution{
  font-size:9px;
}

</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <div id="topBar">
    <input
      id="searchInput"
      type="text"
      placeholder="🔍 Search any location..."
    >
    <button id="searchBtn">Search</button>
  </div>

  <button id="logoutBtn">Logout</button>

  <button id="locBtn">
    📍 My Location
  </button>

  <div id="status"></div>


  <!-- =========================
       AUTH
  ========================== -->

  <div id="authModal">

    <div class="authBox">

      <h2 id="authTitle">
        Past Snap
      </h2>

      <div class="authSub" id="authSub">
        Login to post your snaps
      </div>

      <input
        id="displayNameInput"
        class="authInput"
        placeholder="Display Name"
        style="display:none"
      >

      <input
        id="emailInput"
        class="authInput"
        type="email"
        placeholder="Email"
      >

      <input
        id="passwordInput"
        class="authInput"
        type="password"
        placeholder="Password"
      >

      <button
        id="authBtn"
        class="authBtn"
      >
        Login
      </button>

      <div class="authSwitch">

        <span id="authSwitchText">
          Don't have an account?
        </span>

        <button id="authSwitchBtn">
          Register
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       CAMERA
  ========================== -->

  <div id="cameraModal" class="modal">

    <video
      id="cameraVideo"
      autoplay
      playsinline
      muted
    ></video>

    <canvas id="cameraCanvas"></canvas>

    <div id="cameraTop">

      <button id="closeCameraBtn">
        ✕
      </button>

      <button id="switchCameraBtn">
        🔄
      </button>

    </div>


    <div id="zoomBox">

      <div id="zoomValue">
        1×
      </div>

      <input
        id="zoomRange"
        type="range"
        min="0.5"
        max="20"
        step="0.1"
        value="1"
      >

    </div>


    <div id="modeBar">

      <button
        id="photoModeBtn"
        class="active"
      >
        📷 Photo
      </button>

      <button id="videoModeBtn">
        🎥 Video
      </button>

    </div>


    <div id="filterBar">

      <button class="filterBtn active" data-filter="none">
        Normal
      </button>

      <button class="filterBtn" data-filter="vintage">
        Vintage
      </button>

      <button class="filterBtn" data-filter="bw">
        B&W
      </button>

      <button class="filterBtn" data-filter="warm">
        Warm
      </button>

      <button class="filterBtn" data-filter="cool">
        Cool
      </button>

      <button class="filterBtn" data-filter="glow">
        Glow
      </button>

      <button class="filterBtn" data-filter="night">
        Night
      </button>

      <button class="filterBtn" data-filter="pop">
        Color Pop
      </button>

      <button class="filterBtn" data-filter="dream">
        Dream
      </button>

      <button class="filterBtn" data-filter="sunset">
        Sunset
      </button>

    </div>


    <div id="recordTimer">
      00:00
    </div>


    <div id="cameraBottom">

      <button id="mirrorBtn">
        🪞 Mirror
      </button>

      <button id="captureBtn"></button>

    </div>

  </div>


  <!-- =========================
       PREVIEW
  ========================== -->

  <div id="previewModal" class="modal">

    <div id="previewMediaBox">

      <img
        id="previewImage"
        style="display:none"
      >

      <video
        id="previewVideo"
        style="display:none"
        controls
        playsinline
      ></video>

    </div>


    <div id="qualityBox">

      <button
        class="qualityBtn active"
        data-quality="480"
      >
        480p
      </button>

      <button
        class="qualityBtn"
        data-quality="720"
      >
        720p
      </button>

      <button
        class="qualityBtn"
        data-quality="1080"
      >
        1080p
      </button>

    </div>


    <div id="previewInfo">
      Ready
    </div>


    <div id="previewBottom">

      <button id="cancelPreviewBtn">
        Retake
      </button>

      <button id="postBtn">
        Next
      </button>

    </div>

  </div>


  <!-- =========================
       DETAILS
  ========================== -->

  <div id="detailsModal" class="modal">

    <div class="detailsBox">

      <div class="detailsTitle">
        Post Details
      </div>

      <div class="locationCard">

        <div>
          <b>Posted by:</b>
          <span id="detailsUserName"></span>
        </div>

        <br>

        <div>
          <b>Location:</b>
        </div>

        <div id="detailsLocation">
          Getting location...
        </div>

      </div>


      <textarea
        id="descriptionInput"
        class="detailsTextarea"
        placeholder="Write something about this snap..."
        maxlength="500"
      ></textarea>


      <input
        id="songInput"
        class="detailsInput"
        placeholder="🎵 Song name (optional)"
        maxlength="150"
      >


      <div class="detailsButtons">

        <button id="detailsBackBtn">
          Back
        </button>

        <button id="detailsNextBtn">
          📍 Post Snap
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       UPLOAD
  ========================== -->

  <div id="uploadBox">

    <div id="uploadTitle">
      📤 Uploading Snap
    </div>

    <div id="uploadText">
      Please wait...
    </div>

    <div id="uploadTrack">
      <div id="uploadBar"></div>
    </div>

    <div id="uploadPercent">
      0%
    </div>

  </div>


  <!-- =========================
       GALLERY
  ========================== -->

  <div id="galleryModal" class="modal">

    <div id="galleryTop">

      <span id="galleryCounter">
        1 / 1
      </span>

      <button id="closeGalleryBtn">
        ✕
      </button>

    </div>


    <div id="galleryImageBox">

      <img
        id="galleryImage"
        style="display:none"
      >

      <video
        id="galleryVideo"
        style="display:none"
        controls
        playsinline
      ></video>


      <button
        id="prevBtn"
        class="galleryArrow"
      >
        ‹
      </button>

      <button
        id="nextBtn"
        class="galleryArrow"
      >
        ›
      </button>

    </div>


    <div id="galleryDetails">

      <div
        class="galleryName"
        id="galleryName"
      ></div>

      <div
        class="galleryDescription"
        id="galleryDescription"
      ></div>

      <div
        class="gallerySong"
        id="gallerySong"
      ></div>

      <div
        class="galleryLocation"
        id="galleryLocation"
      ></div>

    </div>

  </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://zzxhymydsvwpjbyaslde.supabase.co";

const SUPABASE_KEY =
"sb_publishable_kqNMaZBD7Rg8P-pBwBYl9A_nGYn3JJ4";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBALS
========================================================= */

let map;

let cameraStream = null;

let currentFacing = "environment";

let mirrorEnabled = false;

let currentFilter = "none";

let currentMode = "photo";

let currentZoom = 1;

let recorder = null;

let recordedChunks = [];

let recordingStartedAt = 0;

let recordingTimer = null;

let capturedBlob = null;

let capturedImageData = null;

let capturedVideoUrl = null;

let capturedType = null;

let selectedQuality = 480;

let currentPosition = null;

let isPostingSnap = false;

let currentUser = null;

let currentProfile = null;

let galleryItems = [];

let galleryIndex = 0;

let markerGroups = {};

let modalHistory = false;


/* =========================================================
   ELEMENTS
========================================================= */

const cameraModal =
document.getElementById("cameraModal");

const previewModal =
document.getElementById("previewModal");

const detailsModal =
document.getElementById("detailsModal");

const galleryModal =
document.getElementById("galleryModal");

const authModal =
document.getElementById("authModal");

const cameraVideo =
document.getElementById("cameraVideo");

const cameraCanvas =
document.getElementById("cameraCanvas");


/* =========================================================
   STATUS
========================================================= */

function showStatus(msg,ms=2500){

  const el =
  document.getElementById("status");

  el.textContent=msg;

  el.style.display="block";

  clearTimeout(showStatus.timer);

  showStatus.timer =
  setTimeout(()=>{
    el.style.display="none";
  },ms);
}


/* =========================================================
   AUTH UI
========================================================= */

let authMode="login";

function showAuth(){

  authModal.style.display="flex";

}

function hideAuth(){

  authModal.style.display="none";

}

function updateAuthUI(){

  const title =
  document.getElementById("authTitle");

  const sub =
  document.getElementById("authSub");

  const name =
  document.getElementById("displayNameInput");

  const btn =
  document.getElementById("authBtn");

  const switchText =
  document.getElementById("authSwitchText");

  const switchBtn =
  document.getElementById("authSwitchBtn");


  if(authMode==="login"){

    title.textContent="Past Snap";

    sub.textContent="Login to post your snaps";

    name.style.display="none";

    btn.textContent="Login";

    switchText.textContent=
    "Don't have an account?";

    switchBtn.textContent="Register";

  }else{

    title.textContent="Create Account";

    sub.textContent=
    "Create your Past Snap account";

    name.style.display="block";

    btn.textContent="Register";

    switchText.textContent=
    "Already have an account?";

    switchBtn.textContent="Login";

  }

}

document
.getElementById("authSwitchBtn")
.onclick=()=>{

  authMode =
  authMode==="login"
  ? "register"
  : "login";

  updateAuthUI();

};


/* =========================================================
   REGISTER / LOGIN
========================================================= */

async function authSubmit(){

  const email =
  document.getElementById("emailInput")
  .value.trim();

  const password =
  document.getElementById("passwordInput")
  .value;

  const displayName =
  document.getElementById("displayNameInput")
  .value.trim();


  if(!email || !password){

    showStatus("Email aur password required hai.");

    return;

  }


  if(authMode==="register"){

    if(!displayName){

      showStatus("Display Name enter karo.");

      return;

    }


    if(displayName.length<2){

/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(a,b){

  const R=6371000;

  const p1=
  a.lat*Math.PI/180;

  const p2=
  b.lat*Math.PI/180;

  const dp=
  (b.lat-a.lat)*Math.PI/180;

  const dl=
  (b.lng-a.lng)*Math.PI/180;

  const x=
  Math.sin(dp/2)**2+
  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(dl/2)**2;

  return 2*R*
  Math.atan2(
    Math.sqrt(x),
    Math.sqrt(1-x)
  );

}

/* =========================================================
   RENDER SNAP MARKERS
========================================================= */

function renderSnaps(rows){

  Object
  .values(markerGroups)
  .forEach(marker=>{
    map.removeLayer(marker);
  });

  markerGroups={};


  const groups=[];


  rows.forEach(row=>{

    let group=
    groups.find(g=>
      distanceMeters(
        {
          lat:g.latitude,
          lng:g.longitude
        },
        {
          lat:row.latitude,
          lng:row.longitude
        }
      )<70
    );


    if(!group){

      group={
        latitude:row.latitude,
        longitude:row.longitude,
        items:[]
      };

      groups.push(group);

    }


    group.items.push(row);

  });


  groups.forEach((g,i)=>{

    const marker=
    L.marker(
      [g.latitude,g.longitude],
      {
        icon:
        makeGhostIcon(
          g.items.length
        )
      }
    ).addTo(map);


    marker.on(
      "click",
      ()=>openGallery(g.items)
    );


    markerGroups[i]=marker;

  });

}

/* =========================================================
   ENGLISH ADDRESS
========================================================= */

function buildEnglishAddress(address){

  const village=
    address.village ||
    address.hamlet ||
    address.town ||
    address.city ||
    address.municipality ||
    "";

  const district=
    address.county ||
    address.district ||
    "";

  const state=
    address.state ||
    "";

  const country=
    address.country ||
    "India";


  const parts=[];


  if(village)
    parts.push(
      "Village: "+village
    );


  if(district)
    parts.push(
      "District: "+district
    );


  if(state)
    parts.push(
      "State: "+state
    );


  if(country)
    parts.push(
      "Country: "+country
    );


  return parts.join(" • ");

}


/* =========================================================
   GET LOCATION
========================================================= */

function getMyLocation(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        showStatus(
          "Browser location support nahi karta."
        );

        reject();

        return;

      }


      showStatus(
        "📍 Live location mil rahi hai..."
      );


      navigator
      .geolocation
      .getCurrentPosition(

        pos=>{

          currentPosition={

            latitude:
            pos.coords.latitude,

            longitude:
            pos.coords.longitude,

            accuracy:
            pos.coords.accuracy

          };


          map.setView(
            [
              currentPosition.latitude,
              currentPosition.longitude
            ],
            17
          );


          if(
            window.userLocationMarker
          ){

            map.removeLayer(
              window.userLocationMarker
            );

          }


          window.userLocationMarker=
          L.circleMarker(
            [
              currentPosition.latitude,
              currentPosition.longitude
            ],
            {
              radius:8
            }
          ).addTo(map);


          showStatus(
            "📍 Current location set."
          );


          resolve(currentPosition);

        },


        err=>{

          console.error(err);

          showStatus(
            "Location permission allow karo."
          );

          reject(err);

        },


        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0

        }

      );

    }
  );

}

function filterToCss(filter){

  switch(filter){

    case "vintage":
      return "sepia(.7) contrast(1.1) saturate(.8)";

    case "bw":
      return "grayscale(1)";

    case "warm":
      return "sepia(.25) saturate(1.35)";

    case "cool":
      return "saturate(.9) hue-rotate(15deg)";

    case "glow":
      return "brightness(1.1) saturate(1.2)";

    case "night":
      return "brightness(.65) contrast(1.25) saturate(1.2)";

    case "pop":
      return "saturate(1.8) contrast(1.15)";

    case "dream":
      return "brightness(1.08) contrast(.9) saturate(1.2)";

    case "sunset":
      return "sepia(.25) saturate(1.5) hue-rotate(-10deg)";

    default:
      return "none";

  }

}

/* =========================================================
   ZOOM
========================================================= */

async function applyHardwareZoom(){

  const track=
  cameraStream
  ?.getVideoTracks?.()[0];


  if(!track)return;


  const caps=
  track.getCapabilities
  ? track.getCapabilities()
  : {};


  if(caps.zoom){

    const z=
    Math.max(
      caps.zoom.min,
      Math.min(
        caps.zoom.max,
        currentZoom
      )
    );


    try{

      await track.applyConstraints({

        advanced:[
          {
            zoom:z
          }
        ]

      });


      return;

    }catch(e){}

  }


  const scale=
  Math.max(
    .5,
    Math.min(
      20,
      currentZoom
    )
  );


  cameraVideo.style.transform=
  mirrorEnabled
  ? "scaleX(-1) scale("+scale+")"
  : "scale("+scale+")";

}

/* =========================================================
   DRAW PHOTO
========================================================= */

function drawVideoToCanvas(
  targetWidth,
  targetHeight
){

  cameraCanvas.width=
  targetWidth;

  cameraCanvas.height=
  targetHeight;


  const ctx=
  cameraCanvas.getContext("2d");


  ctx.save();


  ctx.filter=
  filterToCss(
    currentFilter
  );


  const vw=
  cameraVideo.videoWidth;

  const vh=
  cameraVideo.videoHeight;


  const cropW=
  vw/currentZoom;

  const cropH=
  vh/currentZoom;


  const cw=
  Math.min(vw,cropW);

  const ch=
  Math.min(vh,cropH);


  const sx=
  (vw-cw)/2;

  const sy=
  (vh-ch)/2;


  if(mirrorEnabled){

    ctx.translate(
      targetWidth,
      0
    );

    ctx.scale(-1,1);

  }


  ctx.drawImage(
    cameraVideo,
    sx,
    sy,
    cw,
    ch,
    0,
    0,
    targetWidth,
    targetHeight
  );


  ctx.restore();

}

/* =========================================================
   VIDEO
========================================================= */

function chooseMime(){

  const types=[

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm"

  ];


  return types.find(
    type=>
    MediaRecorder
    .isTypeSupported(type)
  ) || "";

}


function startRecording(){

  if(!cameraStream)
    return;


  const mime=
  chooseMime();


  if(!mime){

    showStatus(
      "Video recording supported nahi hai."
    );

    return;

  }


  recordedChunks=[];


  recorder=
  new MediaRecorder(
    cameraStream,
    {
      mimeType:mime
    }
  );


  recordingStartedAt=
  Date.now();


  recorder.ondataavailable=
  e=>{

    if(
      e.data &&
      e.data.size
    ){

      recordedChunks
      .push(e.data);

    }

  };


  recorder.onstop=()=>{

    const blob=
    new Blob(
      recordedChunks,
      {
        type:mime
      }
    );


    capturedBlob=blob;

    capturedType="video";

    capturedImageData=null;


    capturedVideoUrl=
    URL.createObjectURL(blob);


    document
    .getElementById("previewImage")
    .style.display=
    "none";


    const pv=
    document
    .getElementById("previewVideo");


    pv.style.display=
    "block";


    pv.src=
    capturedVideoUrl;


    pv.load();


    const duration=
    (Date.now()-
    recordingStartedAt)/1000;


    document
    .getElementById("previewInfo")
    .textContent=
    "Duration: "+
    formatDuration(duration)+
    " • "+
    formatMB(blob.size)+
    " • Resolution: "+
    cameraVideo.videoWidth+
    "×"+
    cameraVideo.videoHeight;


    document
    .getElementById("qualityBox")
    .style.display=
    "flex";


    stopCameraStream();

    cameraModal.style.display=
    "none";

    previewModal.style.display=
    "flex";


    updateRecordUI(false);

  };


  recorder.start(250);

  updateRecordUI(true);

  recordingTimer=
  setInterval(
    updateRecordTimer,
    250
  );

}


function stopRecording(){

  if(
    recorder &&
    recorder.state==="recording"
  ){

    recorder.stop();

  }


  clearInterval(
    recordingTimer
  );

  recordingTimer=null;

}


function updateRecordUI(on){

  const btn=
  document.getElementById(
    "captureBtn"
  );

  const timer=
  document.getElementById(
    "recordTimer"
  );


  if(on){

    btn.classList.add(
      "recording"
    );

    timer.style.display=
    "block";

  }else{

    btn.classList.remove(
      "recording"
    );

    timer.style.display=
    "none";

  }

}


function updateRecordTimer(){

  const seconds=
  Math.floor(
    (Date.now()-
    recordingStartedAt)/1000
  );


  document
  .getElementById("recordTimer")
  .textContent=
  formatDuration(seconds);

}

/* =========================================================
   HELPERS
========================================================= */

function formatMB(bytes){

  return (
    bytes/
    1024/
    1024
  ).toFixed(2)+
  " MB";

}


function formatDuration(sec){

  sec=
  Math.max(
    0,
    Math.floor(sec)
  );


  const m=
  String(
    Math.floor(sec/60)
  ).padStart(2,"0");


  const s=
  String(
    sec%60
  ).padStart(2,"0");


  return m+":"+s;

}


function dataURLToBlob(dataURL){

  const parts=
  dataURL.split(",");


  const mime=
  parts[0]
  .match(
    /:(.*?);/
  )[1];


  const binary=
  atob(parts[1]);


  const arr=
  new Uint8Array(
    binary.length
  );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    arr[i]=
    binary.charCodeAt(i);

  }


  return new Blob(
    [arr],
    {
      type:mime
    }
  );

}


/* =========================================================

/* =========================================================
   FRESH GPS
========================================================= */

function getFreshPosition(){

  return new Promise(
    (resolve,reject)=>{

      if(!navigator.geolocation){

        reject(
          new Error(
            "No geolocation"
          )
        );

        return;

      }


      navigator
      .geolocation
      .getCurrentPosition(

        pos=>{

          resolve({

            latitude:
            pos.coords.latitude,

            longitude:
            pos.coords.longitude,

            accuracy:
            pos.coords.accuracy

          });

        },

        err=>reject(err),

        {
          enableHighAccuracy:true,
          timeout:20000,
          maximumAge:0
        }

      );

    }
  );

}


/* =========================================================
   REVERSE GEOCODING ENGLISH
========================================================= */

async function reverseGeocode(
  lat,
  lon
){

  try{

    const url=
    "https://nominatim.openstreetmap.org/reverse"+
    "?format=jsonv2"+
    "&lat="+encodeURIComponent(lat)+
    "&lon="+encodeURIComponent(lon)+
    "&zoom=18"+
    "&addressdetails=1"+
    "&accept-language=en";


    const res=
    await fetch(
      url,
      {
        headers:{
          "Accept":
          "application/json"
        }
      }
    );


    const data=
    await res.json();


    return buildEnglishAddress(
      data.address || {}
    );


  }catch(e){

    console.error(e);

    return "Location available";

  }

}


/* =========================================================
   UPLOAD PROGRESS
========================================================= */

function setUploadProgress(
  percent,
  text
){

  const p=
  Math.max(
    0,
    Math.min(
      100,
      percent
    )
  );


  document
  .getElementById("uploadBar")
  .style.width=
  p+"%";


  document
  .getElementById("uploadPercent")
  .textContent=
  Math.round(p)+"%";


  document
  .getElementById("uploadText")
  .textContent=
  text;

}


/* =========================================================
   XHR UPLOAD
========================================================= */

function xhrUpload(
  filePath,
  blob
){

  return new Promise(
    (resolve,reject)=>{

      const url=
      SUPABASE_URL+
      "/storage/v1/object/past-snaps/"+
      encodeURIComponent(
        filePath
      );


      const xhr=
      new XMLHttpRequest();


      xhr.open(
        "POST",
        url,
        true
      );


      xhr.setRequestHeader(
        "apikey",
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "Authorization",
        "Bearer "+
        SUPABASE_KEY
      );


      xhr.setRequestHeader(
        "Content-Type",
        blob.type ||
        "application/octet-stream"
      );


      xhr.setRequestHeader(
        "x-upsert",
        "false"
      );


      xhr.upload.onprogress=
      e=>{

        if(
          e.lengthComputable
        ){

          const pct=
          (
            e.loaded/
            e.total
          )*100;


          setUploadProgress(
            pct,
            "Uploading "+
            formatMB(e.loaded)+
            " / "+
            formatMB(e.total)
          );

        }

      };


      xhr.onload=()=>{

        if(
          xhr.status>=200 &&
          xhr.status<300
        ){

          resolve();

        }else{

          reject(
            new Error(
              xhr.responseText ||
              "Upload failed"
            )
          );

        }

      };


      xhr.onerror=()=>
      reject(
        new Error(
          "Network error"
        )
      );


      xhr.send(blob);

    }
  );

}


/* =========================================================
   FINAL POST
========================================================= */

async function postSnap(){

  if(isPostingSnap)
    return;


  if(!capturedBlob){

    showStatus(
      "Photo/video missing."
    );

    return;

  }


  if(!currentUser){

    showStatus(
      "Login required."
    );

    return;

  }


  isPostingSnap=true;


  const btn=
  document
  .getElementById(
    "detailsNextBtn"
  );


  btn.disabled=true;

  btn.textContent=
  "Checking location...";


  try{

    /* ---------------------------------
       FRESH GPS
    --------------------------------- */

    const fresh=
    await getFreshPosition();


    /* ---------------------------------
       50 METRE CHECK
    --------------------------------- */

    if(
      fresh.accuracy &&
      fresh.accuracy>100
    ){

      throw new Error(
        "GPS accuracy is too low. Move outside or wait for a better GPS fix."
      );

    }


    if(
      currentPosition
    ){

      const d=
      distanceMeters(

        {
          lat:
          currentPosition.latitude,

          lng:
          currentPosition.longitude
        },

        {
          lat:
          fresh.latitude,

          lng:
          fresh.longitude
        }

      );


      /*
        The final post position is ALWAYS
        the fresh live GPS position.
        It is NOT selected from the map.
      */

      if(d>50){

        throw new Error(
          "Location changed. Please stay within 50 metres and try again."
        );

      }

    }


    currentPosition={
      latitude:
      fresh.latitude,

      longitude:
      fresh.longitude,

      accuracy:
      fresh.accuracy
    };


    /* ---------------------------------
       ADDRESS
    --------------------------------- */

    btn.textContent=
    "Getting address...";


    const locationName=
    await reverseGeocode(
      fresh.latitude,
      fresh.longitude
    );


    /* ---------------------------------
       USER DETAILS
    --------------------------------- */

    const description=
    document
    .getElementById(
      "descriptionInput"
    )
    .value
    .trim();


    const songName=
    document
    .getElementById(
      "songInput"
    )
    .value
    .trim();


    /* ---------------------------------
       UPLOAD
    --------------------------------- */

    btn.textContent=
    "Uploading...";


    const uploadBox=
    document
    .getElementById(
      "uploadBox"
    );


    uploadBox.style.display=
    "block";


    setUploadProgress(
      0,
      "Preparing upload..."
    );


    const ext=
    capturedType==="video"
    ? "webm"
    : "jpg";


    const filePath=
    "snap_"+
    Date.now()+
    "_"+
    Math.random()
    .toString(36)
    .slice(2,10)+
    "."+
    ext;


    await xhrUpload(
      filePath,
      capturedBlob
    );


    /* ---------------------------------
       PUBLIC URL
    --------------------------------- */

    const publicUrl=
    SUPABASE_URL+
    "/storage/v1/object/public/past-snaps/"+
    encodeURIComponent(
      filePath
    );


    setUploadProgress(
      100,
      "Saving snap..."
    );


    /* ---------------------------------
       VIDEO INFO
    --------------------------------- */

    const videoEl=
    document
    .getElementById(
      "previewVideo"
    );


    const duration=
    capturedType==="video" &&
    videoEl.duration &&
    Number.isFinite(
      videoEl.duration
    )
    ? videoEl.duration
    : null;


    /* ---------------------------------
       DATABASE
    --------------------------------- */

    const row={

      latitude:
      fresh.latitude,

      longitude:
      fresh.longitude,

      image_url:
      publicUrl,

      media_type:
      capturedType,

      duration_seconds:
      capturedType==="video"
      ? duration
      : null,

      width:
      capturedType==="video"
      ? videoEl.videoWidth
      : capturedType==="image"
      ? cameraCanvas.width
      : null,

      height:
      capturedType==="video"
      ? videoEl.videoHeight
      : capturedType==="image"
      ? cameraCanvas.height
      : null,

      user_id:
      currentUser.id,

      description:
      description || null,

      song_name:
      songName || null,

      location_name:
      locationName || null

    };


    const {
      error
    } =
    await supabaseClient
    .from("snaps")
    .insert(row);


    if(error)
      throw error;


    /* ---------------------------------
       SUCCESS
    --------------------------------- */

    uploadBox.style.display=
    "none";


    detailsModal.style.display=
    "none";


    previewModal.style.display=
    "none";


    showStatus(
      "✅ Snap posted successfully!",
      3000
    );


    if(capturedVideoUrl){

      URL.revokeObjectURL(
        capturedVideoUrl
      );

    }


    capturedVideoUrl=null;

    capturedBlob=null;

    capturedImageData=null;

    capturedType=null;


    document
    .getElementById(
      "descriptionInput"
    )
    .value="";


    document
    .getElementById(
      "songInput"
    )
    .value="";


    await loadSnaps();


  }catch(e){

    console.error(e);


    document
    .getElementById(
      "uploadBox"
    )
    .style.display=
    "none";


    showStatus(
      e.message ||
      "Post failed.",
      4000
    );


  }finally{

    isPostingSnap=false;

    btn.disabled=false;

    btn.textContent=
    "📍 Post Snap";

  }

}


document
.getElementById("detailsNextBtn")
.onclick=postSnap;
