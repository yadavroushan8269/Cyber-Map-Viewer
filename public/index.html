<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <title>PastSnap</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

</head>

<body>

  <!-- =====================================================
       CYBER BACKGROUND
  ====================================================== -->

  <div class="crt-overlay"></div>
  <div class="scanlines"></div>


  <!-- =====================================================
       TOP BAR
  ====================================================== -->

  <header class="topBar">

    <div class="brand">
      <span class="brandIcon">◉</span>
      <span>PAST<span>SNAP</span></span>
    </div>


    <div class="searchBox">

      <input
        id="searchInput"
        type="text"
        placeholder="SEARCH LOCATION..."
        autocomplete="off"
      >

      <button
        id="searchBtn"
        type="button"
      >
        SEARCH
      </button>

    </div>


    <div class="topActions">

      <button
        id="notificationBtn"
        class="cyberBtn iconBtn"
        type="button"
      >
        🔔
        <span
          id="notificationCount"
          class="notificationBadge"
        ></span>
      </button>


      <button
        id="myRoomBtn"
        class="cyberBtn"
        type="button"
      >
        📞 MY ROOM ID
      </button>


      <button
        id="accountBtn"
        class="cyberBtn"
        type="button"
      >
        LOGIN
      </button>

    </div>

  </header>


  <!-- =====================================================
       STATUS BAR
  ====================================================== -->

  <div class="statusBar">

    <div id="status">
      SYSTEM READY...
    </div>

    <div class="statusRight">

      <span>
        GPS:
        <b id="gpsStatus">--</b>
      </span>

      <span>
        SNAPS:
        <b id="snapCount">0</b>
      </span>

    </div>

  </div>


  <!-- =====================================================
       MAP
  ====================================================== -->

  <main id="map"></main>


  <!-- =====================================================
       MAP CONTROLS
  ====================================================== -->

  <div class="mapControls">

    <button
      id="compassBtn"
      class="mapControl cyberBtn"
      type="button"
      title="Rotate map"
    >
      🧭
    </button>


    <button
      id="myLocationBtn"
      class="mapControl cyberBtn"
      type="button"
      title="My location / Snap"
    >
      ◎
    </button>


    <button
      id="mapModeBtn"
      class="mapControl cyberBtn"
      type="button"
      title="Reset map rotation"
    >
      ⟳
    </button>

  </div>


  <!-- =====================================================
       CAMERA PANEL
  ====================================================== -->

  <section
    id="cameraPanel"
    class="panel cameraPanel hidden"
  >

    <div class="panelHeader">

      <span>
        CAMERA // GPS LOCK
      </span>

      <button
        id="closeCameraBtn"
        class="closeBtn"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="cameraViewport">

      <video
        id="cameraVideo"
        autoplay
        muted
        playsinline
      ></video>

      <div
        id="gpsLockIndicator"
        class="gpsLock"
      >
        GPS: WAITING...
      </div>

    </div>


    <div class="cameraControls">

      <button
        id="switchCameraBtn"
        class="cyberBtn"
        type="button"
      >
        🔄 CAMERA
      </button>


      <button
        id="photoModeBtn"
        class="cyberBtn active"
        type="button"
      >
        PHOTO
      </button>


      <button
        id="videoModeBtn"
        class="cyberBtn"
        type="button"
      >
        VIDEO
      </button>

    </div>


    <div class="captureControls">

      <button
        id="captureBtn"
        class="captureBtn"
        type="button"
      >
        ●
      </button>


      <button
        id="recordBtn"
        class="cyberBtn hidden"
        type="button"
      >
        ● RECORD
      </button>


      <button
        id="stopRecordBtn"
        class="cyberBtn hidden"
        type="button"
      >
        ■ STOP
      </button>

    </div>

  </section>


  <!-- =====================================================
       PREVIEW PANEL
  ====================================================== -->

  <section
    id="previewPanel"
    class="panel previewPanel hidden"
  >

    <div class="panelHeader">

      <span>
        SNAP PREVIEW
      </span>

    </div>


    <div
      id="previewMedia"
      class="previewMedia"
    ></div>


    <div
      id="previewCoordinates"
      class="coordinates"
    >
      GPS: --
    </div>


    <textarea
      id="descriptionInput"
      placeholder="ENTER SNAP DESCRIPTION..."
      maxlength="500"
    ></textarea>


    <div class="previewActions">

      <button
        id="retakeBtn"
        class="cyberBtn"
        type="button"
      >
        RETAKE
      </button>


      <button
        id="postSnapBtn"
        class="cyberBtn primaryBtn"
        type="button"
      >
        POST SNAP
      </button>

    </div>

  </section>


  <!-- =====================================================
       CALL PANEL
  ====================================================== -->

  <section
    id="callPanel"
    class="panel callPanel"
    style="display:none;"
  >

    <div class="panelHeader">

      <span>
        CALL // TERMINAL
      </span>

      <button
        id="closeCallPanelBtn"
        class="closeBtn"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="callIdBox">

      <div class="smallLabel">
        MY PERMANENT CALL ID
      </div>

      <div class="myCallIdRow">

        <strong id="myCallId">
          ------
        </strong>

        <button
          id="copyCallIdBtn"
          class="cyberBtn"
          type="button"
        >
          COPY
        </button>

      </div>

    </div>


    <div class="callDivider">
      TARGET USER
    </div>


    <input
      id="targetCallId"
      type="text"
      maxlength="6"
      autocomplete="off"
      placeholder="ENTER CALL ID"
    >


    <button
      id="callUserBtn"
      class="cyberBtn primaryBtn fullBtn"
      type="button"
    >
      📞 CALL USER
    </button>


    <div
      id="callHint"
      class="callHint"
    >
      CALL ID NEVER CHANGES.
    </div>

  </section>


  <!-- =====================================================
       INCOMING CALL
  ====================================================== -->

  <section
    id="incomingCallOverlay"
    class="overlay incomingCallOverlay hidden"
  >

    <div class="incomingCallBox">

      <div class="incomingIcon">
        📞
      </div>


      <div class="incomingTitle">
        INCOMING CALL
      </div>


      <div
        id="incomingCallerText"
        class="incomingCallerText"
      >
        CALL FROM UNKNOWN
      </div>


      <div
        id="incomingCallerRoom"
        class="incomingCallerRoom"
      >
        ROOM ------
      </div>


      <div class="incomingActions">

        <button
          id="acceptCallBtn"
          class="cyberBtn acceptBtn"
          type="button"
        >
          ACCEPT
        </button>


        <button
          id="rejectCallBtn"
          class="cyberBtn rejectBtn"
          type="button"
        >
          REJECT
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       ACTIVE CALL
  ====================================================== -->

  <section
    id="activeCallOverlay"
    class="overlay activeCallOverlay hidden"
  >

    <div class="activeCallBox">

      <div class="remoteVideoBox">

        <video
          id="remoteVideo"
          autoplay
          playsinline
        ></video>


        <div
          id="remoteCallStatus"
          class="remoteCallStatus"
        >
          CONNECTING
        </div>

      </div>


      <div class="localVideoBox">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

      </div>


      <div class="callControls">

        <button
          id="cameraBtn"
          class="callControlBtn"
          type="button"
        >
          📷
        </button>


        <button
          id="micBtn"
          class="callControlBtn"
          type="button"
        >
          🎙️
        </button>


        <button
          id="endBtn"
          class="callControlBtn endCallBtn"
          type="button"
        >
          ☎
        </button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       NOTIFICATIONS
  ====================================================== -->

  <section
    id="notificationPanel"
    class="panel sidePanel hidden"
  >

    <div class="panelHeader">

      <span>
        NOTIFICATIONS
      </span>

      <button
        id="closeNotificationBtn"
        class="closeBtn"
        type="button"
      >
        ×
      </button>

    </div>


    <div
      id="notificationList"
      class="notificationList"
    ></div>

  </section>


  <!-- =====================================================
       AUTH MODAL
  ====================================================== -->

  <section
    id="authModal"
    class="overlay authOverlay hidden"
  >

    <div class="authBox">

      <div class="panelHeader">

        <span id="authTitle">
          LOGIN
        </span>

        <button
          id="closeAuthBtn"
          class="closeBtn"
          type="button"
        >
          ×
        </button>

      </div>


      <!-- LOGIN -->

      <div id="loginForm">

        <input
          id="loginEmail"
          type="
